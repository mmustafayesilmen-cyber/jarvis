<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0e0e12; --card:#1a1a22; --red:#fa1e4e; --text:#f2f2f5; --mute:#8b8b99; }
  * { box-sizing: border-box; }
  body { margin:0; width:320px; background:var(--bg); color:var(--text);
         font:14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:17px; letter-spacing:.5px; }
  h1 span { color:var(--red); }
  .hero { margin:4px 18px 14px; padding:18px; border-radius:16px; text-align:center;
          background:linear-gradient(135deg,#2a0a14,#1a1a22); border:1px solid #3a1420; }
  .big { font-size:46px; font-weight:700; color:var(--red); text-shadow:0 0 24px #fa1e4e88; line-height:1; }
  .lbl { color:var(--mute); font-size:12px; margin-top:6px; }
  .row { margin:0 18px 10px; padding:12px 14px; background:var(--card); border-radius:12px;
         display:flex; align-items:center; justify-content:space-between; }
  .row small { color:var(--mute); display:block; font-size:11px; }
  .sw { position:relative; width:44px; height:24px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; background:#34343f; border-radius:24px; cursor:pointer; transition:.2s; }
  .sw i::before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px;
                  background:#fff; border-radius:50%; transition:.2s; }
  .sw input:checked + i { background:var(--red); box-shadow:0 0 12px #fa1e4e88; }
  .sw input:checked + i::before { transform:translateX(20px); }
  footer { padding:6px 18px 16px; color:var(--mute); font-size:11px; text-align:center; }
</style>
</head>
<body>
<header><h1>GX <span>SHIELD</span></h1></header>
<div class="hero"><div class="big" id="blocked">0</div><div class="lbl">bu sayfada engellendi</div></div>
<div class="row"><div>Toplam engellenen<small>tüm zamanlar</small></div><b id="total">0</b></div>
<div class="row"><div>Koruma<small>tüm siteler</small></div>
  <label class="sw"><input type="checkbox" id="all"><i></i></label></div>
<div class="row"><div>Bu sitede açık<small id="host">-</small></div>
  <label class="sw"><input type="checkbox" id="site"><i></i></label></div>
<footer>Siteyi kapatınca sayfa yenilenir.</footer>
<script src="popup.js"></script>
</body>
</html>
