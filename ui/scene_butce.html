<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS BÜTÇE</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#5ee08a;--c2:#22a85a;--ln:rgba(94,224,138,.25);--hi:rgba(94,224,138,.12);--card:rgba(6,26,16,.7)}
html,body{background:radial-gradient(ellipse at 50% -10%,#0d3d24 0%,#020a05 66%)}
#stage{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr;gap:16px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
#left{grid-column:1/3}
.bar{height:16px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;transition:width .6s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.row .a{font:600 14px Consolas}.neg{color:#ff8a70}.pos{color:#5ee08a}
#donut{width:200px;height:200px}.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.lg i{width:12px;height:12px;border-radius:3px}
.qa{display:flex;gap:8px;flex-wrap:wrap}.qa input{padding:9px;background:rgba(0,0,0,.4);border:1px solid var(--ln);border-radius:9px;color:#fff;font:14px "Segoe UI";outline:0;user-select:text}
</style></head><body>
<div id="stage">
 <div class="card" id="left" style="grid-column:1/3"><h3>BU AY <small id="mo"></small></h3>
  <div style="display:flex;gap:30px;align-items:flex-end;flex-wrap:wrap"><div><div class="mut" style="font-size:12px;letter-spacing:.2em">KALAN HARÇLIK</div><div class="big" id="left_">0 ₺</div></div>
   <div><div class="mut" style="font-size:12px">HARCANAN</div><b id="sp" style="font-size:22px;color:#ff8a70">0 ₺</b></div><div><div class="mut" style="font-size:12px">GELİR</div><b id="in_" style="font-size:22px;color:#5ee08a">0 ₺</b></div>
   <div><div class="mut" style="font-size:12px">AYLIK HARÇLIK</div><b id="al" style="font-size:22px">0 ₺</b></div></div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div class="qa"><input id="qn" placeholder="Ne için? (kitap, otobüs…)" style="flex:1;min-width:160px"><input id="qa" type="number" placeholder="Tutar ₺" style="width:110px"><button id="qadd" class="prim">HARCAMA EKLE</button><button id="qin">GELİR EKLE</button>
   <input id="qal" type="number" placeholder="Aylık harçlık" style="width:130px"><button id="qs">AYARLA</button></div></div>
 <div class="card"><h3>KATEGORİLER</h3><div style="display:flex;gap:16px;align-items:center"><svg id="donut" viewBox="0 0 200 200"></svg><div id="lgd"></div></div></div>
 <div class="card col"><h3>SON İŞLEMLER <small><a id="undo" style="cursor:pointer;color:var(--c)">son kaydı sil</a></small></h3><div id="tx"></div></div>
 <div class="card col" style="grid-column:2/4"><h3>BİRİKİM HEDEFLERİ <small>"birikim hedefi telefon 8000 TL"</small></h3><div id="gl"></div>
  <div class="qa" style="margin-top:6px"><input id="gn" placeholder="Hedef adı" style="flex:1"><input id="gt" type="number" placeholder="Tutar ₺" style="width:110px"><button id="gadd">HEDEF EKLE</button><input id="gs" type="number" placeholder="Yatır ₺" style="width:100px"><button id="gdep">YATIR</button></div></div>
</div>
<script>
const COL={"Kırtasiye":"#6ab7ff","Ulaşım":"#ffd84a","Eğlence":"#c58bff","Yemek":"#ff9a5c","Giyim":"#ff6b8a","Diğer":"#9aa7b5"},fm=n=>Math.round(n).toLocaleString("tr-TR")+" ₺";
Mode.start({kind:"butce",title:"BÜTÇE",placeholder:"Komut: harcama ekle: kitap 150 TL · gelir ekle: harçlık 500 · bu ay ne kadar harcadım · harçlığım 2000 TL olsun · birikim hedefi telefon 8000 TL",init:d=>render(d.snap),act:d=>{if(d.snap)render(d.snap)}});
function render(s){$("mo").textContent=new Date().toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
 $("left_").textContent=fm(s.left);$("left_").style.color=s.left<0?"#ff8a70":"#fff";$("sp").textContent=fm(s.spent);$("in_").textContent=fm(s.income);$("al").textContent=fm(s.allow);
 const tot=s.allow+s.income,pc=tot?Math.min(100,s.spent/tot*100):0;$("pb").style.width=pc+"%";$("pb").style.background=pc>85?"#ff8a70":pc>60?"#ffd84a":"linear-gradient(90deg,#5ee08a,#22a85a)";
 const ent=Object.entries(s.cats),sum=ent.reduce((a,[,v])=>a+v,0);let a0=-Math.PI/2,h="",lg="";
 ent.sort((x,y)=>y[1]-x[1]).forEach(([k,v])=>{const a1=a0+v/sum*6.2832,big=a1-a0>Math.PI?1:0,r=80,c=COL[k]||"#9aa7b5";
  if(ent.length===1)h+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${c}" stroke-width="30"/>`;else h+=`<path d="M${100+r*Math.cos(a0)} ${100+r*Math.sin(a0)} A${r} ${r} 0 ${big} 1 ${100+r*Math.cos(a1)} ${100+r*Math.sin(a1)}" fill="none" stroke="${c}" stroke-width="30"/>`;
  lg+=`<div class="lg"><i style="background:${c}"></i>${Mode.esc(k)} <b>${fm(v)}</b></div>`;a0=a1});
 $("donut").innerHTML=h||'<circle cx="100" cy="100" r="80" fill="none" stroke="#fff2" stroke-width="30"/>';$("lgd").innerHTML=lg||'<span class="mut">Henüz harcama yok.</span>';
 $("tx").innerHTML=s.tx.map(x=>`<div class="row"><span>${Mode.esc(x.note||x.cat)} <small class="mut">${Mode.esc(x.cat)} · ${Mode.esc(x.ts.slice(5,16))}</small></span><span class="a ${x.kind==="gelir"?"pos":"neg"}">${x.kind==="gelir"?"+":"−"}${fm(x.amt)}</span></div>`).join("")||'<span class="mut">Kayıt yok.</span>';
 $("gl").innerHTML=s.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return `<div style="margin:8px 0"><div class="row" style="border:0"><span>${Mode.esc(g.name)}</span><span class="a">${fm(g.saved)} / ${fm(g.target)}</span></div><div class="bar" style="height:10px;margin:0"><i style="width:${p}%;background:linear-gradient(90deg,#ffd84a,#5ee08a)"></i></div></div>`}).join("")||'<span class="mut">Hedef yok.</span>';
 Mode.pill(s.left<0?"AŞILDI":"DENGEDE")}
const v=i=>$(i).value.trim();
$("qadd").onclick=()=>{if(v("qa")){Mode.cmd("harcama ekle: "+(v("qn")||"harcama")+" "+v("qa")+" TL");$("qn").value=$("qa").value=""}};
$("qin").onclick=()=>{if(v("qa")){Mode.cmd("gelir ekle: "+(v("qn")||"harçlık")+" "+v("qa")+" TL");$("qn").value=$("qa").value=""}};
$("qs").onclick=()=>{if(v("qal"))Mode.cmd("harçlığım "+v("qal")+" TL olsun")};$("undo").onclick=()=>Mode.cmd("son harcamayı sil");
$("gadd").onclick=()=>{if(v("gn")&&v("gt")){Mode.cmd("birikim hedefi "+v("gn")+" "+v("gt")+" TL");$("gn").value=$("gt").value=""}};$("gdep").onclick=()=>{if(v("gs")){Mode.cmd("birikim hedefine "+v("gs")+" TL ekle");$("gs").value=""}};
document.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>e.stopPropagation()));
</script></body></html>
