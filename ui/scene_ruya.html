<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS RÜYA GÜNLÜĞÜ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#b79bff;--c2:#7a5cff;--ln:rgba(183,155,255,.25);--hi:rgba(183,155,255,.12);--card:rgba(18,10,40,.7)}
html,body{background:radial-gradient(ellipse at 60% -10%,#2a1860 0%,#05030f 68%)}
#stage{display:grid;grid-template-columns:380px 1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
textarea{width:100%;height:110px;resize:none;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--ln);border-radius:10px;color:#fff;font:14px "Segoe UI";outline:0;user-select:text}
.dr{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px;line-height:1.45}.dr b{color:var(--c);font:600 11px Consolas;letter-spacing:.1em}
.dr .tg span{display:inline-block;margin:4px 4px 0 0;padding:2px 8px;border:1px solid var(--ln);border-radius:12px;font-size:11.5px;color:var(--mut)}
.dr .yo{margin-top:6px;padding:8px 10px;background:var(--hi);border-radius:8px;font-size:12.5px;color:#d9ccff}
#map{width:100%;height:100%;display:block;border-radius:18px}
#mapc{position:relative;min-height:0}
#none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font:15px "Segoe UI";text-align:center;pointer-events:none}
</style></head><body>
<div id="stage"><div class="col"><div class="card"><h3>YENİ RÜYA</h3><textarea id="tx" placeholder="Rüyanı anlat…"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button id="add" class="prim" style="flex:1">KAYDET</button><button id="yo">SON RÜYAYI YORUMLA</button></div></div>
 <div class="card" style="flex:1;min-height:120px"><h3>GÜNLÜK <small id="cn"></small></h3><div id="list"></div></div></div>
 <div class="card" id="mapc"><h3>YILDIZ HARİTASI <small>sık geçen kelimeler büyür, aynı rüyadakiler bağlanır</small></h3><canvas id="map"></canvas><div id="none">Rüya ekledikçe anahtar kelimelerin burada takımyıldız olur.</div></div></div>
<script>
let S={rows:[],stars:[],edges:[]};const cv=$("map"),g=cv.getContext("2d");let pos={},T=0;
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function fit(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height-40;cv.style.height=(r.height-40)+"px";cv.style.marginTop="6px"}
function ui(){$("cn").textContent=S.total+" kayıt";$("none").style.display=S.stars.length?"none":"flex";
 $("list").innerHTML=S.rows.map(r=>`<div class="dr"><b>${Mode.esc(r.d)}</b><div>${Mode.esc(r.t)}</div><div class="tg">${r.w.slice(0,8).map(w=>"<span>"+Mode.esc(w)+"</span>").join("")}</div>${r.y?`<div class="yo">${Mode.esc(r.y)}</div>`:""}</div>`).join("")||'<div class="mut">Henüz kayıt yok.</div>';
 pos={};S.stars.forEach((s,i)=>{const h=hash(s.w),a=(h%6283)/1000,rad=.18+((h>>>8)%1000)/1000*.74;pos[s.w]={x:.5+Math.cos(a)*rad*.5*(i%2?1:1),y:.5+Math.sin(a)*rad*.5,n:s.n,ph:(h%100)/16}})}
function draw(t){T=t/1000;g.clearRect(0,0,cv.width,cv.height);const W=cv.width,H=cv.height;
 for(let i=0;i<70;i++){const x=(hash("a"+i)%1000)/1000*W,y=(hash("b"+i)%1000)/1000*H;g.globalAlpha=.25+.25*Math.sin(T*1.4+i);g.fillStyle="#fff";g.fillRect(x,y,1.5,1.5)}
 g.globalAlpha=1;S.edges.forEach(e=>{const a=pos[e.a],b=pos[e.b];if(!a||!b)return;g.strokeStyle="rgba(183,155,255,"+Math.min(.7,.15+e.n*.12)+")";g.lineWidth=1+Math.min(3,e.n*.5);g.beginPath();g.moveTo(a.x*W,a.y*H);g.lineTo(b.x*W,b.y*H);g.stroke()});
 Object.entries(pos).forEach(([w,p])=>{const r=3+Math.min(10,p.n*2.2),x=p.x*W,y=p.y*H,pulse=1+.15*Math.sin(T*2+p.ph);g.shadowColor="#b79bff";g.shadowBlur=14+p.n*3;g.fillStyle="#f0e8ff";g.beginPath();g.arc(x,y,r*pulse,0,6.283);g.fill();g.shadowBlur=0;
  g.fillStyle="rgba(230,220,255,.85)";g.font=(11+Math.min(7,p.n*1.5))+"px Segoe UI";g.fillText(w,x+r+5,y+4)});requestAnimationFrame(draw)}
Mode.start({kind:"ruya",title:"RÜYA GÜNLÜĞÜ",placeholder:"Komut: rüya ekle: uçan bir at gördüm · son rüyayı oku · tekrar eden temalar · rüyamı yorumla · son rüyayı sil",init:d=>{S=d.snap;ui()},act:d=>{if(d.snap){S=d.snap;ui()}}});
$("add").onclick=()=>{const v=$("tx").value.trim();if(v){Mode.cmd("rüya ekle: "+v);$("tx").value=""}};$("yo").onclick=()=>Mode.cmd("rüyamı yorumla");
$("tx").addEventListener("keydown",e=>e.stopPropagation());addEventListener("resize",fit);setTimeout(()=>{fit();requestAnimationFrame(draw)},60);
</script></body></html>
