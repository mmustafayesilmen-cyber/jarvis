<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS KAHRAMAN</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--cr:95,230,255;--ar:255,190,72;--c:rgb(var(--cr));--a:rgb(var(--ar));--bg:#01050b}
:root.web{--ar:255,86,86}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#01050b;color:var(--c);font-family:"Segoe UI",Bahnschrift,Consolas,monospace;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;transition:filter .5s}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 18px 22px;z-index:5;background:linear-gradient(#01050bf2,#01050b99 55%,transparent)}
#title{font:600 15px Bahnschrift,"Segoe UI";letter-spacing:.38em;text-shadow:0 0 14px rgba(var(--cr),.7);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title b{font-weight:600;color:var(--a);text-shadow:0 0 16px rgba(var(--ar),.85);transition:color .4s}
button{font:12px Bahnschrift,Consolas;letter-spacing:.22em;padding:8px 16px;cursor:pointer;color:var(--c);border:1px solid rgba(var(--cr),.38);border-radius:3px;background:rgba(4,22,36,.72);transition:background .15s,border-color .15s,box-shadow .15s,color .15s}
button:hover{background:rgba(10,50,75,.9);border-color:rgba(var(--cr),.8);box-shadow:0 0 12px rgba(var(--cr),.25)}
button.on{color:var(--a);border-color:rgba(var(--ar),.85);background:rgba(var(--ar),.14);box-shadow:0 0 14px rgba(var(--ar),.3),inset 0 0 10px rgba(var(--ar),.12)}
#close{border-color:rgba(255,180,84,.6);color:#ffb454}
#list,#stat,#panel{border:1px solid rgba(var(--cr),.2);border-top:2px solid rgba(var(--ar),.85);border-radius:4px;background:linear-gradient(180deg,rgba(7,24,38,.74),rgba(2,10,18,.6));backdrop-filter:blur(7px);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 24px rgba(var(--cr),.04);transition:border-color .4s}
#list{position:fixed;left:14px;top:64px;bottom:66px;width:252px;overflow:auto;z-index:4;padding:8px 6px;scrollbar-width:thin;scrollbar-color:rgba(var(--cr),.35) transparent}
#list div{font:13px/2 Consolas;padding:0 10px;cursor:pointer;white-space:nowrap;border-left:2px solid transparent;border-radius:2px;transition:background .12s}
#list div:hover{background:rgba(var(--cr),.12);border-left-color:rgba(var(--cr),.6)}
#list div.act{color:#6dffb0;text-shadow:0 0 8px #6dffb0;border-left-color:#6dffb0;background:rgba(109,255,176,.08)}
#list b{display:inline-block;width:28px;color:var(--a);opacity:.85;font-weight:400}
#stat{position:fixed;right:14px;top:64px;width:274px;z-index:4;padding:12px 14px;font:12px/1.75 Consolas}
#stat h4{margin:0 0 5px;font:600 11px Bahnschrift,Consolas;letter-spacing:.34em;color:var(--a)}
#st,#log{white-space:pre-wrap}
#log{max-height:26vh;overflow:hidden;opacity:.8}
#panel{position:fixed;right:14px;top:calc(64px + 250px);width:274px;z-index:4;padding:12px 14px;font:12px/1.7 Consolas;display:none;white-space:pre;background:linear-gradient(180deg,rgba(7,24,38,.9),rgba(2,10,18,.85))}
#bar{position:fixed;left:14px;right:14px;bottom:12px;display:flex;gap:10px;z-index:5}
#cmd{flex:1;padding:10px 14px;background:rgba(2,12,20,.8);border:1px solid rgba(var(--cr),.28);border-radius:3px;color:var(--c);font:14px Consolas;outline:0;user-select:text;transition:border-color .15s,box-shadow .15s}
#cmd:focus{border-color:var(--c);box-shadow:0 0 16px rgba(var(--cr),.25)}
#cmd::placeholder{color:rgba(var(--cr),.4)}
#hint{position:fixed;left:282px;right:302px;bottom:56px;text-align:center;font:12px Consolas;opacity:.5;z-index:3}
@media(max-width:900px){#list{width:170px}#stat{display:none}#hint{left:190px;right:12px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span id="title">KAHRAMAN MODU · <b id="tm"></b></span><button id="bArmor">ZIRH</button><button id="bWeb">AĞ</button><button id="bPix">PİKSEL</button><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="list"></div>
<div id="stat"><h4>DURUM</h4><div id="st"></div><h4 style="margin-top:8px">KAYIT</h4><div id="log"></div></div>
<div id="panel"></div>
<div id="hint">Konuşun: "on yedi numara", "miğferi kapat", "ağ at", "liste", "sıfırla" · Tab = maske değiştir · Esc = çık</div>
<div id="bar"><input id="cmd" placeholder="Komut yazın (örn: 17, gözleri mavi yap, ağ at)" spellcheck="false" autocomplete="off"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search), TOK=P.get("t");
const cv=$("c"), mainCtx=cv.getContext("2d");let ctx=mainCtx;
const pc=document.createElement("canvas"), pctx=pc.getContext("2d");let pixelMode=false;const PIX=5;
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

// ------------------------------------------------------------------ durum
let masks={armor:{title:"ZIRH MASKESİ",features:[]},web:{title:"AĞ MASKESİ",features:[]}};
let mask="armor";
const EYES={mavi:[95,230,255],kırmızı:[255,70,70],yeşil:[90,255,140],turuncu:[255,150,50],sarı:[255,230,60],beyaz:[240,248,255],mor:[190,110,255]};
let F;
function fresh(){return {eye:(mask==="web"?EYES.beyaz:EYES.mavi).slice(),eyeTo:null,eyeScale:1,mask:1,visor:0,power:1,filter:"",zoom:1,zoomTo:1,scan:0,lock:0,flight:0,flightOn:false,
  shield:0,shieldOn:false,radar:0,radarBlips:[],alert:0,stealth:0,show:0,fire:0,speedPanel:false,weapons:false,boot:0,panel:"",
  shots:[],mesh:0,net:0,swing:0,swingOn:false,climb:0,jump:0,flip:0,slow:0,danger:0,lines:0,strength:0,city:0,camo:0,mapOn:false,active:new Set()}}
F=fresh();
const T0=performance.now();
let now=0, dt=0.016;
const tweens=[];
function tw(o,k,to,ms,ease){tweens.push({o,k,from:o[k],to,t0:performance.now(),ms,ease:ease||(x=>x*x*(3-2*x))})}
function stepTweens(){const t=performance.now();for(let i=tweens.length-1;i>=0;i--){const a=tweens[i];let u=Math.min(1,(t-a.t0)/a.ms);a.o[a.k]=a.from+(a.to-a.from)*a.ease(u);if(u>=1)tweens.splice(i,1)}}
function later(fn,ms){setTimeout(fn,ms)}
function setPanel(txt,ms){const p=$("panel");if(!txt){p.style.display="none";return}p.textContent=txt;p.style.display="block";clearTimeout(setPanel.t);if(ms)setPanel.t=setTimeout(()=>{p.style.display="none"},ms)}
function flag(n,on){on?F.active.add(n):F.active.delete(n);renderList()}
function toggle(n,get,set){const v=!get();set(v);flag(n,v);return v}

// ------------------------------------------------------------------ WebAudio (kendi ürettiğimiz kısa sesler)
let AC=null;
function beep(f,d,type,vol,slide){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),AC.currentTime+d);g.gain.value=vol||0.04;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={up:()=>beep(300,.35,"sawtooth",.04,900),down:()=>beep(700,.35,"sawtooth",.04,200),ping:()=>beep(1200,.12,"sine",.05),zap:()=>beep(900,.25,"square",.03,120),whoosh:()=>beep(200,.4,"triangle",.05,1200),alarm:()=>{beep(800,.2,"square",.04);later(()=>beep(600,.2,"square",.04),220)}};

// ------------------------------------------------------------------ özellikler: ZIRH
const A={
 1:()=>{tw(F,"visor",0,700);sfx.down();flag(2,false);flag(1,true)},
 2:()=>{tw(F,"visor",1,700);sfx.up();flag(1,false);flag(2,true)},
 3:()=>{F.boot=1;tw(F,"boot",0,2800);sfx.up();setPanel("SİSTEM BAŞLATILIYOR\n\n[##########] Çekirdek\n[##########] Sensörler\n[##########] İticiler\n[##########] Kalkan\n[##########] Silahlar\nTüm sistemler çevrimiçi",3200)},
 4:()=>{tw(F,"power",1,600);sfx.up();flag(4,true);flag(5,false)},
 5:()=>{tw(F,"power",.3,600);sfx.down();flag(5,true);flag(4,false)},
 6:()=>eye("mavi",6),7:()=>eye("kırmızı",7),8:()=>eye("yeşil",8),9:()=>eye("turuncu",9),
 10:()=>{F.scan=1;flag(10,true);sfx.ping();tw(F,"scan",0,4200,x=>x);later(()=>flag(10,false),4200)},
 11:()=>{F.lock=1;flag(11,true);sfx.ping();later(()=>{F.lock=0;flag(11,false)},5000)},
 12:()=>filt("thermal",12),13:()=>filt("night",13),14:()=>filt("xray",14),
 15:()=>{F.zoomTo=Math.min(2.2,F.zoomTo*1.3);tw(F,"zoom",F.zoomTo,500);sfx.whoosh();flag(15,true);later(()=>flag(15,false),600)},
 16:()=>{F.zoomTo=Math.max(.5,F.zoomTo/1.3);tw(F,"zoom",F.zoomTo,500);sfx.whoosh();flag(16,true);later(()=>flag(16,false),600)},
 17:()=>{F.flightOn=true;tw(F,"flight",1,900);sfx.whoosh();flag(17,true);flag(18,false)},
 18:()=>{F.flightOn=false;tw(F,"flight",0,1200);sfx.down();flag(18,true);flag(17,false);later(()=>flag(18,false),1300)},
 19:()=>{const v=toggle(19,()=>F.speedPanel,v=>F.speedPanel=v);sfx.ping()},
 20:()=>{const v=toggle(20,()=>F.weapons,v=>F.weapons=v);sfx.ping();setPanel(v?"SİLAH SİSTEMİ\n\nİtici ışınlar   HAZIR\nMini füzeler    HAZIR\nEnerji darbesi  HAZIR\nDurum: ÇEVRİMİÇİ":"",v?0:1)},
 21:()=>{F.fire=1;tw(F,"fire",0,900,x=>x);sfx.zap();flag(21,true);later(()=>flag(21,false),900)},
 22:()=>{const v=toggle(22,()=>F.shieldOn,v=>F.shieldOn=v);tw(F,"shield",v?1:0,600);v?sfx.up():sfx.down()},
 23:()=>{setPanel("HASAR RAPORU\n\nMiğfer     ████████░░  %82\nGövde      █████████░  %91\nSağ kol    ██████████  %100\nSol kol    █████████░  %94\nİticiler   ██████████  %100\nGenel: KULLANILABİLİR",7000);sfx.ping()},
 24:()=>{const p=Math.round(F.power*100);setPanel("ENERJİ RAPORU\n\nÇekirdek   "+bar(p)+"  %"+p+"\nKalkan     "+bar(F.shieldOn?88:100)+"\nİticiler   "+bar(F.flightOn?64:100)+"\nTahmini süre: "+(p>60?"12 saat":"3 saat"),7000);sfx.ping()},
 25:()=>{setPanel("SİSTEM TANILAMA\n\nSensörler ....... TAMAM\nİtici sistem .... TAMAM\nKalkan .......... TAMAM\nHaberleşme ...... TAMAM\nÇekirdek ısısı .. NORMAL\n0 hata bulundu",7000);sfx.ping()},
 26:()=>{const v=toggle(26,()=>F.mapOn,v=>F.mapOn=v);sfx.ping()},
 27:()=>{const v=toggle(27,()=>!!F.radar,v=>{F.radar=v?1:0});if(v){F.radarBlips=Array.from({length:5},()=>({a:Math.random()*6.28,r:.25+Math.random()*.7,seen:0}));sfx.alarm()}},
 28:()=>{const v=toggle(28,()=>F.alert>0,v=>{});tw(F,"alert",v?1:0,300);if(v)sfx.alarm()},
 29:()=>{const v=toggle(29,()=>F.stealth>.5,v=>{});tw(F,"stealth",v?1:0,700);v?sfx.down():sfx.up()},
 30:()=>{const v=toggle(30,()=>F.show>.5,v=>{});tw(F,"show",v?1:0,500);if(v)sfx.up()}
};
function bar(p){const n=Math.round(p/10);return "█".repeat(n)+"░".repeat(10-n)}
function eye(name,n){F.eyeTo=EYES[name].slice();const from=F.eye.slice(),t0=performance.now();const tick=()=>{const u=Math.min(1,(performance.now()-t0)/400);F.eye=from.map((v,i)=>v+(F.eyeTo[i]-v)*u);if(u<1)requestAnimationFrame(tick)};tick();
  for(const k of mask==="armor"?[6,7,8,9]:[5,6,7,8])flag(k,k===n);sfx.ping()}
function filt(kind,n){const css={thermal:"sepia(1) saturate(5) hue-rotate(-35deg) contrast(1.2)",night:"grayscale(1) sepia(1) hue-rotate(65deg) saturate(3.5) brightness(1.15)",xray:"invert(1) hue-rotate(180deg) contrast(1.25)"}[kind];
  const off=F.filter===css;F.filter=off?"":css;cv.style.filter=F.filter;for(const k of mask==="armor"?[12,13,14]:[22])flag(k,false);if(!off)flag(n,true);sfx.ping()}

// ------------------------------------------------------------------ özellikler: AĞ
const B={
 1:()=>{tw(F,"mask",1,600);sfx.up();flag(1,true);flag(2,false)},
 2:()=>{tw(F,"mask",0,600);sfx.down();flag(2,true);flag(1,false)},
 3:()=>{tw(F,"eyeScale",.45,300);flag(3,true);flag(4,false)},
 4:()=>{tw(F,"eyeScale",1.25,300);flag(4,true);flag(3,false)},
 5:()=>eye("sarı",5),6:()=>eye("beyaz",6),7:()=>eye("turuncu",7),8:()=>eye("mor",8),
 9:()=>shoot(0,9),10:()=>shoot(1,10),11:()=>shoot(-1,11),
 12:()=>{const v=toggle(12,()=>F.swingOn,v=>F.swingOn=v);tw(F,"swing",v?1:0,500);sfx.whoosh()},
 13:()=>{const v=toggle(13,()=>F.shieldOn,v=>F.shieldOn=v);tw(F,"shield",v?1:0,500);v?sfx.up():sfx.down()},
 14:()=>{const v=toggle(14,()=>F.net>.5,v=>{});tw(F,"net",v?1:0,700);sfx.zap()},
 15:()=>{const v=toggle(15,()=>F.mesh>.5,v=>{});tw(F,"mesh",v?1:0,900);sfx.whoosh()},
 16:()=>{tw(F,"mesh",0,500);tw(F,"net",0,500);tw(F,"shield",0,500);F.shieldOn=false;F.shots.length=0;for(const k of [13,14,15])flag(k,false);sfx.down();setTimeout(()=>flag(16,false),400);flag(16,true)},
 17:()=>{const v=toggle(17,()=>F.climb>.5,v=>{});tw(F,"climb",v?1:0,700);sfx.whoosh()},
 18:()=>{F.jump=0;tw(F,"jump",1,900,x=>x);sfx.whoosh();flag(18,true);later(()=>{F.jump=0;flag(18,false)},950)},
 19:()=>{F.flip=0;tw(F,"flip",1,1100,x=>x);sfx.whoosh();flag(19,true);later(()=>{F.flip=0;flag(19,false)},1150)},
 20:()=>{const v=toggle(20,()=>F.slow>.5,v=>{});tw(F,"slow",v?1:0,600);v?sfx.down():sfx.up()},
 21:()=>{const v=toggle(21,()=>F.danger>.5,v=>{});tw(F,"danger",v?1:0,400);if(v)sfx.alarm()},
 22:()=>filt("night",22),
 23:()=>{F.zoomTo=Math.min(2.2,F.zoomTo*1.3);tw(F,"zoom",F.zoomTo,500);sfx.whoosh();flag(23,true);later(()=>flag(23,false),600)},
 24:()=>{F.zoomTo=Math.max(.5,F.zoomTo/1.3);tw(F,"zoom",F.zoomTo,500);sfx.whoosh();flag(24,true);later(()=>flag(24,false),600)},
 25:()=>{const v=toggle(25,()=>F.city>.5,v=>{});tw(F,"city",v?1:0,800);sfx.whoosh()},
 26:()=>{const v=toggle(26,()=>F.camo>.5,v=>{});tw(F,"camo",v?1:0,700);v?sfx.down():sfx.up()},
 27:()=>{const v=toggle(27,()=>F.lines>.5,v=>{});tw(F,"lines",v?1:0,500);sfx.whoosh()},
 28:()=>{tw(F,"strength",1,900);sfx.up();flag(28,true);later(()=>{tw(F,"strength",0,1500);flag(28,false)},4500)},
 29:()=>{const v=toggle(29,()=>!!F.radar,v=>{F.radar=v?1:0});if(v){F.radarBlips=Array.from({length:6},()=>({a:Math.random()*6.28,r:.25+Math.random()*.7,seen:0}));sfx.alarm()}},
 30:()=>{const v=toggle(30,()=>F.show>.5,v=>{});tw(F,"show",v?1:0,500);if(v)sfx.up()}
};
function shoot(dir,n){const sx=W/2,sy=H/2+40;const tx=dir===0?W/2:dir>0?W*.9:W*.1,ty=dir===0?H*.05:H*.18;F.shots.push({x1:sx,y1:sy,x2:tx,y2:ty,t:0,stick:0});sfx.zap();flag(n,true);later(()=>flag(n,false),800)}
function resetAll(){tweens.length=0;cv.style.filter="";const m=F.mask;F=fresh();setPanel("");renderList();renderStat()}

function run(m,n){
  if(m&&m!==mask)setMask(m);
  if(n===0){resetAll();log("Efektler sıfırlandı");return}
  const fn=(mask==="armor"?A:B)[n];if(fn){fn();log((n)+". "+masks[mask].features[n-1])}
}

// ------------------------------------------------------------------ arayüz
function setMask(m){mask=m;F=fresh();cv.style.filter="";setPanel("");$("tm").textContent=masks[m].title;document.documentElement.classList.toggle("web",m==="web");
  $("bArmor").classList.toggle("on",m==="armor");$("bWeb").classList.toggle("on",m==="web");renderList();renderStat()}
function renderList(){const el=$("list");const feats=masks[mask].features;el.innerHTML="";feats.forEach((name,i)=>{const d=document.createElement("div");
  if(F.active.has(i+1))d.className="act";d.innerHTML="<b>"+(i+1)+"</b>"+name;d.onclick=()=>send({type:"hero_click",mask,n:i+1});el.appendChild(d)})}
function renderStat(){const act=[...F.active].map(n=>masks[mask].features[n-1]).filter(Boolean);
  $("st").textContent="MASKE   "+masks[mask].title+"\nGÜÇ     %"+Math.round(F.power*100)+"\nZOOM    x"+F.zoom.toFixed(2)+"\nAKTİF   "+(act.length?act.join(", "):"—")}
const logs=[];function log(t){logs.unshift(t);if(logs.length>7)logs.pop();$("log").textContent=logs.join("\n")}
let ws;function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>{ws.send(JSON.stringify({type:"hero_ready"}))};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==="hero_init"){masks=m.masks;setMask(m.mask)}
    else if(m.type==="hero_do"){if(m.say)log("» "+m.say);if(m.list){$("list").scrollTop=0;$("list").style.outline="1px solid #6dffb0";setTimeout(()=>$("list").style.outline="",1500)}
      if(m.pixel!==undefined){setPixel(m.pixel==="toggle"?!pixelMode:!!m.pixel)}else if(m.switch&&m.mask)setMask(m.mask);else if(m.n!==undefined)run(m.mask,m.n)}};
  ws.onclose=()=>setTimeout(connect,1500)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
$("bArmor").onclick=()=>send({type:"hero_mask",mask:"armor"});$("bWeb").onclick=()=>send({type:"hero_mask",mask:"web"});
$("bPix").onclick=()=>setPixel(!pixelMode);
function setPixel(v){pixelMode=v;$("bPix").classList.toggle("on",v)}
$("close").onclick=()=>send({type:"hero_close"});$("peek").onclick=()=>send({type:"mode_peek"});
addEventListener("keydown",e=>{if(e.key==="Escape"){send({type:"hero_close"})}else if(e.key==="p"||e.key==="P"){if(document.activeElement!==$("cmd"))setPixel(!pixelMode)}else if(e.key==="Tab"){e.preventDefault();send({type:"hero_mask",mask:mask==="armor"?"web":"armor"})}});
$("cmd").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&e.target.value.trim()){send({type:"text",text:e.target.value.trim()});e.target.value=""}
  else if(e.key==="Escape"){send({type:"hero_close"})}});
window.heroDo=(m,n)=>run(m,n);window.heroInit=(mm,m)=>{masks=mm;setMask(m)};

// ------------------------------------------------------------------ çizim yardımcıları
const rgb=(a,al)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
function poly(pts,close){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close!==false)ctx.closePath()}
function mirror(pts){return pts.map(p=>[-p[0],p[1]])}
function bgFx(t){
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,"#04182a");g.addColorStop(.6,"#020b16");g.addColorStop(1,"#000204");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(95,230,255,.06)";ctx.lineWidth=1;const s=60;for(let x=(t*5%s);x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  const cx=W/2,cy=H/2-10,R=Math.min(W,H)*.36,ac=mask==="armor"?[255,176,70]:[255,72,72];

  if(F.mesh>.01){ctx.save();ctx.globalAlpha=F.mesh*.8;ctx.strokeStyle="rgba(220,240,250,.8)";ctx.lineWidth=1.2;const cx=W/2,cy=H/2,N=22,R=Math.hypot(W,H)/2;for(let i=0;i<N;i++){const a=i/N*6.283;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke()}for(let r=40;r<R;r+=48){ctx.beginPath();for(let i=0;i<=N;i++){const a=i/N*6.283,am=(i-.5)/N*6.283;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(!i)ctx.moveTo(x,y);else ctx.quadraticCurveTo(cx+Math.cos(am)*r*.94,cy+Math.sin(am)*r*.94,x,y)}ctx.stroke()}ctx.restore()}

  for(let i=F.shots.length-1;i>=0;i--){const s=F.shots[i];s.t=Math.min(1,s.t+dt*2.2);const x=s.x1+(s.x2-s.x1)*s.t,y=s.y1+(s.y2-s.y1)*s.t;ctx.save();ctx.strokeStyle="rgba(235,248,255,.95)";ctx.lineWidth=2.5;ctx.shadowColor="#bfefff";ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(x,y);ctx.stroke();
    if(s.t>=1){s.stick+=dt;ctx.beginPath();for(let k=0;k<8;k++){const a=k/8*6.283;ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*40,y+Math.sin(a)*40)}ctx.stroke();ctx.beginPath();ctx.arc(x,y,20,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(x,y,34,0,6.283);ctx.stroke();if(s.stick>2.5)F.shots.splice(i,1)}ctx.restore()}
  if(F.scan>.01&&mask==="armor"){const y=H*(1-F.scan);ctx.save();const g=ctx.createLinearGradient(0,y-60,0,y+4);g.addColorStop(0,rgb(F.eye,0));g.addColorStop(1,rgb(F.eye,.5));ctx.fillStyle=g;ctx.fillRect(0,y-60,W,64);ctx.strokeStyle=rgb(F.eye,.9);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.restore()}
  if(F.lock>0&&mask==="armor"){ctx.save();const cx=W/2+Math.sin(t*1.3)*80,cy=H/2-60+Math.cos(t*1.7)*40,k=1+.25*Math.sin(t*8);ctx.strokeStyle="#ff5a5a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,46*k,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,8,0,6.283);ctx.stroke();for(const a of [0,1.5708,3.1416,4.7124]){ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*30*k,cy+Math.sin(a)*30*k);ctx.lineTo(cx+Math.cos(a)*70*k,cy+Math.sin(a)*70*k);ctx.stroke()}ctx.fillStyle="#ff5a5a";ctx.font="14px Consolas";ctx.fillText("HEDEF KİLİTLİ",cx+60,cy-50);ctx.restore()}
  if(F.radar){const R=Math.min(130,H*.17),cx=W-R-40,cy=H-R-100;ctx.save();ctx.fillStyle="rgba(2,20,12,.75)";ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.fill();ctx.strokeStyle="rgba(109,255,176,.7)";ctx.lineWidth=1.2;for(let r=R/3;r<=R;r+=R/3){ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke()}ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
    const a=(t*2)%6.283;const g=ctx.createConicGradient?ctx.createConicGradient(a,cx,cy):null;if(g){g.addColorStop(0,"rgba(109,255,176,.5)");g.addColorStop(.12,"rgba(109,255,176,0)");g.addColorStop(1,"rgba(109,255,176,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.fill()}
    for(const b of F.radarBlips){const d=((a-b.a)%6.283+6.283)%6.283;if(d<.2)b.seen=1;b.seen=Math.max(0,b.seen-dt*.4);ctx.fillStyle=`rgba(255,90,90,${b.seen})`;ctx.beginPath();ctx.arc(cx+Math.cos(b.a)*b.r*R,cy+Math.sin(b.a)*b.r*R,5,0,6.283);ctx.fill()}
    ctx.fillStyle="#6dffb0";ctx.font="12px Consolas";ctx.fillText(mask==="armor"?"RADAR · "+F.radarBlips.length+" HEDEF":"TEHDİT · "+F.radarBlips.length+" HEDEF",cx-R,cy+R+16);ctx.restore()}
  if(F.speedPanel&&mask==="armor"){ctx.save();const v=F.flightOn?Math.round(900+Math.sin(t*3)*60):Math.round(Math.abs(Math.sin(t))*8);ctx.fillStyle="rgba(2,12,20,.7)";ctx.fillRect(W/2-90,H-190,180,72);ctx.strokeStyle=rgb(F.eye,.7);ctx.strokeRect(W/2-90,H-190,180,72);ctx.fillStyle=rgb(F.eye,1);ctx.font="600 34px Bahnschrift,Consolas";ctx.textAlign="center";ctx.fillText(v+" km/s",W/2,H-150);ctx.font="11px Consolas";ctx.fillText("HIZ",W/2,H-198+14);ctx.restore()}
  if(F.flight>.01&&mask==="armor"){ctx.save();ctx.fillStyle=rgb(F.eye,.8);ctx.font="12px Consolas";ctx.globalAlpha=F.flight;ctx.fillText("İRTİFA  "+Math.round(F.flight*1200+Math.sin(t)*20)+" m",290,H-110);ctx.restore()}
  if(F.weapons&&mask==="armor"){ctx.save();ctx.strokeStyle="rgba(255,120,90,.7)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2-60,170,-.6,.6);ctx.arc(W/2,H/2-60,170,Math.PI-.6,Math.PI+.6);ctx.stroke();ctx.restore()}
  if(F.mapOn&&mask==="armor"){const w=260,h=170,x=W-w-300,y=H-h-100;ctx.save();ctx.fillStyle="rgba(2,12,20,.8)";ctx.fillRect(x,y,w,h);ctx.strokeStyle=rgb(F.eye,.7);ctx.strokeRect(x,y,w,h);ctx.strokeStyle=rgb(F.eye,.2);for(let i=1;i<10;i++){ctx.beginPath();ctx.moveTo(x+i*w/10,y);ctx.lineTo(x+i*w/10,y+h);ctx.stroke()}for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(x,y+i*h/6);ctx.lineTo(x+w,y+i*h/6);ctx.stroke()}const k=(t%2)/2;ctx.strokeStyle=rgb(F.eye,1-k);ctx.beginPath();ctx.arc(x+w/2,y+h/2,6+k*40,0,6.283);ctx.stroke();ctx.fillStyle="#6dffb0";ctx.beginPath();ctx.arc(x+w/2,y+h/2,5,0,6.283);ctx.fill();ctx.fillStyle=rgb(F.eye,1);ctx.font="11px Consolas";ctx.fillText("HARİTA · SİZ",x+6,y+14);ctx.restore()}
  if(F.alert>.01){const a=F.alert*(.25+.25*Math.sin(t*14));ctx.save();ctx.fillStyle=`rgba(255,40,40,${a})`;ctx.fillRect(0,0,W,H);ctx.strokeStyle=`rgba(255,60,60,${F.alert})`;ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);ctx.fillStyle=`rgba(255,120,120,${F.alert})`;ctx.font="600 30px Bahnschrift,Consolas";ctx.textAlign="center";ctx.fillText("⚠ ACİL DURUM ⚠",W/2,110);ctx.restore()}
  if(F.slow>.01){ctx.save();const g=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,`rgba(0,10,30,${.6*F.slow})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(190,230,255,${F.slow})`;ctx.font="13px Consolas";ctx.textAlign="center";ctx.fillText("REFLEKS · ZAMAN x0.25",W/2,H-110);ctx.restore()}
  if(F.boot>.01){ctx.save();ctx.fillStyle=`rgba(95,230,255,${F.boot*.25})`;ctx.fillRect(0,0,W,H);ctx.restore()}
  if(F.stealth>.01&&mask==="armor"){ctx.save();ctx.fillStyle=`rgba(0,0,0,${F.stealth*.55})`;ctx.fillRect(0,0,W,H);ctx.restore()}
}

// ------------------------------------------------------------------ ana döngü
const mc=document.createElement("canvas"), mctx=mc.getContext("2d");
function spritePost(c){
  const w=c.width,h=c.height,g=c.getContext("2d"),im=g.getImageData(0,0,w,h),d=im.data,n=w*h,solid=new Uint8Array(n);
  for(let i=0;i<n;i++){const o=i*4;if(d[o+3]>120){solid[i]=1;d[o]=Math.round(d[o]/36)*36;d[o+1]=Math.round(d[o+1]/36)*36;d[o+2]=Math.round(d[o+2]/36)*36;d[o+3]=255}else d[o+3]=0}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(solid[i])continue;
    if((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){const o=i*4;d[o]=5;d[o+1]=9;d[o+2]=14;d[o+3]=255}}
  g.putImageData(im,0,0);
}
function xf(c,tt,sc){
  c.translate(W/2,H/2-10);
  let sw=0;if(mask==="web"&&F.swing>.01)sw=Math.sin(tt*1.8)*.35*F.swing;
  c.rotate(sw);
  let jump=0;if(F.jump>0&&F.jump<1)jump=-Math.sin(F.jump*Math.PI)*H*.28;
  const hover=Math.sin(tt*1.4)*6+(F.flight>.01?-F.flight*30+Math.sin(tt*5)*4:0);
  c.translate(0,jump+hover);
  if(F.flip>0&&F.flip<1)c.rotate(F.flip*6.283);
  c.scale(sc,sc);
}
function drawScene(tt){
  bgFx(tt);
  const sc=Math.min(W*.46/300,H*.64/400)*F.zoom;
  if(mask==="web"&&F.swing>.01){ctx.save();ctx.translate(W/2,H/2-10);const sw=Math.sin(tt*1.8)*.35*F.swing;ctx.strokeStyle=`rgba(235,248,255,${.8*F.swing})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-H);ctx.rotate(sw);ctx.lineTo(0,-250*sc/1.5);ctx.stroke();ctx.restore()}
  const fade=1-F.stealth*(mask==="armor"?.55:.2);
  if(mask==="armor"){ctx.save();xf(ctx,tt,sc);ctx.globalAlpha=fade;armorFx(tt,sc);ctx.restore()}
  if(pixelMode){
    if(mc.width!==W||mc.height!==H){mc.width=W;mc.height=H}
    const main=ctx;ctx=mctx;mctx.setTransform(1,0,0,1,0,0);mctx.clearRect(0,0,W,H);mctx.save();xf(mctx,tt,sc);(mask==="armor"?drawArmor:drawWeb)(tt);mctx.restore();ctx=main;
    spritePost(mc);ctx.globalAlpha=fade;ctx.drawImage(mc,0,0);ctx.globalAlpha=1;
  }else{ctx.save();xf(ctx,tt,sc);ctx.globalAlpha=fade;(mask==="armor"?drawArmor:drawWeb)(tt);ctx.restore()}
  if(mask==="web"){ctx.save();xf(ctx,tt,sc);ctx.globalAlpha=fade;webFx(tt,sc);ctx.restore()}
  ctx.globalAlpha=1;
}
function frame(ts){
  const tt=(ts-T0)/1000;dt=Math.min(.05,tt-now);now=tt;stepTweens();
  mainCtx.setTransform(DPR,0,0,DPR,0,0);mainCtx.clearRect(0,0,W,H);
  if(pixelMode){                                   // sahneyi küçük tuvalde çiz, keskin piksellerle büyüt
    const pw=Math.ceil(W/PIX),ph=Math.ceil(H/PIX);if(pc.width!==pw||pc.height!==ph){pc.width=pw;pc.height=ph}
    const oW=W,oH=H;ctx=pctx;W=pw;H=ph;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
    drawScene(tt);
    ctx=mainCtx;W=oW;H=oH;mainCtx.imageSmoothingEnabled=false;mainCtx.drawImage(pc,0,0,pc.width,pc.height,0,0,pc.width*PIX,pc.height*PIX);
  }else drawScene(tt);
  screenFx(tt);                                    // yazılı paneller (radar, harita...) net kalır
  if(((ts|0)%12)===0)renderStat();
  requestAnimationFrame(frame)
}
setMask("armor");
requestAnimationFrame(frame);
connect();
window.focus();
</script></body></html>
