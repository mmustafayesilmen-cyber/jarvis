<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS RENK ATÖLYESİ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#ff6fb5;--c2:#c23d85;--ln:rgba(255,255,255,.18);--hi:rgba(255,255,255,.1);--card:rgba(20,10,20,.7)}
html,body{background:#0a070c}
#stage{display:flex;flex-direction:column;gap:16px}
#pal{flex:1;display:flex;border-radius:22px;overflow:hidden;min-height:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;cursor:pointer;transition:flex .35s;font:700 18px Consolas;position:relative}
.sw:hover{flex:1.7}.sw small{font:12px "Segoe UI";opacity:.7;margin-top:4px}
#nm{font:700 30px Bahnschrift;color:#fff;letter-spacing:.1em;margin-right:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.sv{display:flex;gap:4px;height:34px;width:150px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--ln)}.sv i{flex:1}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#000c;border:1px solid var(--ln);padding:8px 18px;border-radius:20px;font:13px Consolas;color:#fff;opacity:0;transition:opacity .25s;z-index:20}
</style></head><body>
<div id="stage"><div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="nm">—</span><button id="rn" class="prim">RASTGELE</button><button id="sv">KAYDET</button><span class="mut">TIKLA: kopyala</span></div>
 <div id="pal"></div><div class="card"><div class="chips" id="mood"></div><div class="chips" id="saved" style="margin-top:10px"></div></div></div><div id="toast"></div>
<script>
let cur=null,S={saved:[],moods:[]};
function lum(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return(.299*r+.587*g+.114*b)/255}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1400)}
function copy(h){try{navigator.clipboard.writeText(h).then(()=>toast(h+" kopyalandı"),()=>fb(h))}catch(e){fb(h)}}
function fb(h){const t=document.createElement("textarea");t.value=h;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast(h+" kopyalandı")}catch(e){toast(h)}t.remove()}
function show(p){cur=p;$("nm").textContent=p.ad.toUpperCase();$("pal").innerHTML=p.c.map(h=>`<div class="sw" data-h="${h}" style="background:${h};color:${lum(h)>.55?"#111":"#fff"}">${h.toUpperCase()}<small>rgb(${[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(", ")})</small></div>`).join("");
 $("pal").querySelectorAll(".sw").forEach(e=>e.onclick=()=>copy(e.dataset.h));Mode.pill(p.c[0].toUpperCase());document.documentElement.style.setProperty("--c",p.c[0])}
function snap(s){S=s;$("mood").innerHTML=S.moods.map(m=>`<button data-m="${m}">${m.toUpperCase()}</button>`).join("");$("mood").querySelectorAll("button").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.m+" paleti"));
 $("saved").innerHTML=S.saved.length?'<span class="mut" style="align-self:center">KAYITLI</span>'+S.saved.map((p,i)=>`<div class="sv" data-i="${i}" title="${Mode.esc(p.ad)}">${p.c.map(h=>`<i style="background:${h}"></i>`).join("")}</div>`).join(""):"";
 $("saved").querySelectorAll(".sv").forEach(e=>e.onclick=()=>show(S.saved[+e.dataset.i]))}
Mode.start({kind:"renk",title:"RENK ATÖLYESİ",placeholder:"Komut: sakin palet · gün batımı paleti · neon · kırmızı için üçlü uyum · mavi tamamlayıcı renkler · #3366cc benzer · paleti kaydet",init:d=>{snap(d.snap);show(d.pal)},act:d=>{if(d.snap)snap(d.snap);if(d.pal)show(d.pal)}});
$("rn").onclick=()=>Mode.cmd("rastgele palet");$("sv").onclick=()=>Mode.cmd("paleti kaydet");
</script></body></html>
