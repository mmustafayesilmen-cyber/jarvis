<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS SINAV</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765">
<link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#ff7a8a;--c2:#ff5d7a;--ln:rgba(255,122,138,.26);--hi:rgba(255,122,138,.12);--card:rgba(32,10,18,.66)}
html,body{background:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(255,93,122,.08),transparent 70%),radial-gradient(ellipse at 50% -10%,#3a1020 0%,#0d0307 64%)}
#stage{display:grid;grid-template-columns:minmax(280px,380px) 1fr minmax(300px,380px);gap:22px}
.col{display:flex;flex-direction:column;gap:18px;min-height:0;overflow:auto}
.ex{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}.ex:first-of-type{border-top:0}
.ex .n{font:700 34px Bahnschrift,Consolas;min-width:64px;text-align:center;color:#fff;text-shadow:0 0 18px rgba(255,93,122,.6)}.ex .n small{display:block;font:11px Consolas;color:var(--mut);letter-spacing:.2em}
.ex b{font-size:17px}.ex .k{font-size:13px;color:var(--mut)}.ex.s .n{color:#ff5d5d}.ex button{margin-left:auto;padding:4px 9px;font-size:11px}
#adv{font-size:19px;line-height:1.5;color:#fff}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);margin:14px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 10px var(--c);transition:width .8s}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f input{padding:10px;font:15px "Segoe UI",sans-serif;color:#fff;background:rgba(0,0,0,.45);border:1px solid var(--ln);border-radius:10px;outline:0;user-select:text;color-scheme:dark}
.f input:focus{border-color:var(--c)}.f .w{grid-column:span 2}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 5px;border-top:1px solid rgba(255,255,255,.06);text-align:left}th{color:var(--c);font:600 11px Consolas;letter-spacing:.1em}tr.t td,tr.t th{background:var(--hi);color:#fff}
.empty{color:var(--mut);padding:14px 0;font-size:14px}
</style></head><body>
<div id="stage">
 <div class="col"><div class="card"><h3>SINAVLAR <small id="cnt"></small></h3><div id="exs"></div></div>
  <div class="card"><h3>SINAV EKLE</h3><div class="f"><input id="fd" placeholder="Ders (ör. Matematik)"><input id="fdt" type="date"><input id="fk" class="w" placeholder="Konu (isteğe bağlı)"><button id="fa" class="prim w" style="grid-column:span 2">KAYDET</button></div></div></div>
 <div style="display:flex;flex-direction:column;justify-content:center;gap:18px"><div class="card" style="padding:26px 28px"><h3>BUGÜNÜN ÇALIŞMA ÖNERİSİ</h3><div id="adv"></div><div class="bar"><i id="pb" style="width:0"></i></div><div class="mut" id="pt" style="font-size:13px"></div></div>
  <div class="card"><h3>YARIN <small id="yg"></small></h3><div id="yl" style="font-size:16px;line-height:1.6"></div></div></div>
 <div class="col"><div class="card"><h3>HAFTALIK DERS PROGRAMI</h3><table id="wk"></table></div></div>
</div>
<script>
let D=null;const AY=["ocak","şubat","mart","nisan","mayıs","haziran","temmuz","ağustos","eylül","ekim","kasım","aralık"];
Mode.start({kind:"sinav",title:"SINAV",placeholder:"Komut: matematik sınavı 15 kasım · fizik sınavı 3 gün sonra konu elektrik · sınavlarım · bugün ne çalışayım · matematik sınavını sil",init:d=>{D=d;draw()},act:d=>{if(d.data){D=d.data;draw()}}});
function draw(){if(!D)return;const ex=D.sinavlar;$("cnt").textContent=ex.length+" kayıt";
 $("exs").innerHTML=ex.length?ex.map(e=>'<div class="ex'+(e.kalan<=2?" s":"")+'"><div class="n">'+e.kalan+'<small>GÜN</small></div><div><b>'+Mode.esc(e.ders)+'</b><div class="k">'+e.tarih.split("-").reverse().join(".")+(e.konu?" · "+Mode.esc(e.konu):"")+'</div></div><button data-d="'+Mode.esc(e.ders)+'">SİL</button></div>').join(""):'<div class="empty">Kayıtlı sınav yok. Aşağıdan ya da sesle ekleyin.</div>';
 $("exs").querySelectorAll("button").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.d+" sınavını sil"));
 $("adv").textContent=D.advice||"Sınav eklediğinizde günlük odak hedefinizi burada hesaplarım.";
 const p=D.hedef?Math.min(100,Math.round(D.yapilan/D.hedef*100)):0;$("pb").style.width=p+"%";$("pt").textContent=D.hedef?D.yapilan+" / "+D.hedef+" dk odak (Pomodoro kayıtlarından)":"";
 $("yg").textContent=D.yarin_gun||"";$("yl").textContent=D.yarin&&D.yarin.length?D.yarin.join(" · "):"Yarın ders yok.";
 $("wk").innerHTML=D.hafta.map(g=>'<tr class="'+(g.bugun?"t":"")+'"><th>'+g.gun.slice(0,3).toUpperCase()+'</th><td>'+g.dersler.map(Mode.esc).join(", ")+'</td></tr>').join("")}
$("fa").onclick=()=>{const d=$("fd").value.trim(),t=$("fdt").value,k=$("fk").value.trim();if(!d||!t){$("log").textContent="Ders adı ve tarih gerekli.";return}
 const [y,m,dd]=t.split("-").map(Number);Mode.cmd(d+" sınavı "+dd+" "+AY[m-1]+(k?" konu "+k:""));$("fd").value=$("fk").value=""}
for(const id of ["fd","fk","fdt"])$(id).addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")$("fa").click();else if(e.key==="Escape")e.target.blur()});
</script></body></html>
