<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS İLLÜZYON</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--c:#5fe6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--c);font-family:"Segoe UI",Bahnschrift,Consolas,monospace;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:5;background:linear-gradient(#000000cc,transparent)}
#title{flex:1;font:600 15px Bahnschrift,"Segoe UI";letter-spacing:.3em;text-shadow:0 0 10px #000}
button{font:13px Consolas;letter-spacing:.15em;padding:7px 16px;cursor:pointer;color:var(--c);border:1px solid rgba(95,230,255,.5);background:rgba(2,12,20,.8)}
button:hover{background:rgba(10,50,75,.9)}button.on{background:rgba(95,230,255,.3)}
#close{border-color:rgba(255,180,84,.7);color:#ffb454}
#list{position:fixed;left:10px;top:56px;bottom:90px;width:230px;overflow:auto;z-index:4;padding:6px;background:rgba(0,0,0,.72);border:1px solid rgba(95,230,255,.25);scrollbar-width:thin}
#list div{font:13px/1.8 Consolas;padding:0 8px;cursor:pointer;white-space:nowrap;color:#bfefff}
#list div:hover{background:rgba(95,230,255,.18)}#list div.act{color:#6dffb0;background:rgba(109,255,176,.12)}
#list b{display:inline-block;width:26px;opacity:.55;font-weight:400}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(900px,92vw);z-index:5;text-align:center;padding:10px 16px;background:rgba(0,0,0,.72);border:1px solid rgba(95,230,255,.25);font:15px/1.5 "Segoe UI",sans-serif;color:#dff8ff}
#cap b{display:block;font:600 13px Consolas;letter-spacing:.25em;color:var(--c);margin-bottom:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span id="title">İLLÜZYON MODU</span><button id="prev">◀</button><button id="next">▶</button><button id="auto">OTOMATİK</button><button id="tgl">LİSTE</button><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="list"></div>
<div id="cap"><b id="cn"></b><span id="cd"></span></div>
<script>
"use strict";
const $=id=>document.getElementById(id), TOK=new URLSearchParams(location.search).get("t");
const cv=$("c"), ctx=cv.getContext("2d");
let W=0,H=0,u=10,cx=0,cy=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;u=Math.min(W,H)/100;cx=W/2;cy=H/2-3*u}
addEventListener("resize",resize);resize();
const TAU=Math.PI*2;
const bg=c=>{ctx.fillStyle=c;ctx.fillRect(0,0,W,H)};
const ln=(x1,y1,x2,y2,c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w||u*.7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
const ci=(x,y,r,f,s,w)=>{ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=w||u*.5;ctx.stroke()}};
const rc=(x,y,w,h,f)=>{ctx.fillStyle=f;ctx.fillRect(x,y,w,h)};
const pg=(pts,f,s,w)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=w||u*.4;ctx.stroke()}};
const flash=(t,p)=>Math.max(0,Math.min(1,(Math.sin(t*(p||.8))-.2)*2.2));   // "gerçeği göster" ipucu: periyodik belirir
const guide=(x1,y1,x2,y2,t)=>{const a=flash(t);if(a>0)ln(x1,y1,x2,y2,`rgba(255,70,70,${a})`,u*.25)};

const D=[];
// 1 Müller-Lyer
D[1]=t=>{bg("#ece9df");const L=40*u,y1=cy-10*u,y2=cy+10*u,a=6*u,lw=u*.8;ln(cx-L/2,y1,cx+L/2,y1,"#111",lw);ln(cx-L/2,y2,cx+L/2,y2,"#111",lw);
  for(const s of[-1,1]){ln(cx+s*L/2,y1,cx+s*(L/2+a),y1-a,"#111",lw);ln(cx+s*L/2,y1,cx+s*(L/2+a),y1+a,"#111",lw);ln(cx+s*L/2,y2,cx+s*(L/2-a),y2-a,"#111",lw);ln(cx+s*L/2,y2,cx+s*(L/2-a),y2+a,"#111",lw);guide(cx+s*L/2,y1-16*u,cx+s*L/2,y2+16*u,t)}};
// 2 Ponzo
D[2]=t=>{bg("#e9e6dc");const g="#555";ln(cx-34*u,cy+34*u,cx-4*u,cy-34*u,g,u);ln(cx+34*u,cy+34*u,cx+4*u,cy-34*u,g,u);for(let i=0;i<7;i++){const y=cy+30*u-i*9*u,k=(y-(cy-34*u))/(68*u),x=4*u+k*30*u;ln(cx-x,y,cx+x,y,"rgba(90,90,90,.35)",u*.4)}
  const w=20*u;rc(cx-w/2,cy-18*u,w,u*2.2,"#d33");rc(cx-w/2,cy+14*u,w,u*2.2,"#26c");guide(cx-w/2,cy-30*u,cx-w/2,cy+30*u,t);guide(cx+w/2,cy-30*u,cx+w/2,cy+30*u,t)};
// 3 Ebbinghaus
D[3]=t=>{bg("#eee");const r=6*u;for(const s of[-1,1]){const X=cx+s*26*u,n=s<0?6:9,R=s<0?9*u:3*u,d=s<0?r+R+1.5*u:r+R+1*u;for(let i=0;i<n;i++){const a=i/n*TAU+t*.25*s;ci(X+Math.cos(a)*d,cy+Math.sin(a)*d,R,"#8a97a8")}ci(X,cy,r,"#f08a1c")}guide(cx-26*u-r,cy+22*u,cx-26*u-r,cy-22*u,t)};
// 4 Hermann
D[4]=t=>{bg("#fff");const s=11*u,g=2.4*u;for(let y=-1;y<H/s+1;y++)for(let x=-1;x<W/s+1;x++)rc(x*s+g/2+(cx%s),y*s+g/2+(cy%s),s-g,s-g,"#111")};
// 5 Kıvılcımlı ızgara
D[5]=t=>{bg("#000");const s=11*u,o=cx%s,p=cy%s;for(let x=-1;x<W/s+1;x++)ln(x*s+o,0,x*s+o,H,"#445",u*1.1);for(let y=-1;y<H/s+1;y++)ln(0,y*s+p,W,y*s+p,"#445",u*1.1);for(let y=-1;y<H/s+1;y++)for(let x=-1;x<W/s+1;x++)ci(x*s+o,y*s+p,u*1.15,"#fff")};
// 6 Kafe duvarı
D[6]=t=>{bg("#9a9a9a");const tw=10*u,th=6*u,rows=Math.ceil(H/th)+1;for(let r=-1;r<rows;r++){const sh=(r%2)*tw*.5+((r%4>1)?tw*.0:0);for(let x=-2;x<W/tw+2;x++){rc(x*tw*2+sh,r*th,tw,th-u*.4,"#111");rc(x*tw*2+tw+sh,r*th,tw,th-u*.4,"#f4f4f4")}}
  const a=flash(t,.7);if(a>0)for(let r=0;r<rows;r+=2)ln(0,r*th,W,r*th,`rgba(255,70,70,${a})`,u*.2)};
// 7 Zöllner
D[7]=t=>{bg("#eee");const n=6,sp=12*u;for(let i=0;i<n;i++){const x=cx+(i-(n-1)/2)*sp;ln(x-14*u,cy-30*u,x+14*u,cy+30*u,"#111",u*.7);const dir=i%2?1:-1;for(let k=-8;k<=8;k++){const px=x+k*1.7*u,py=cy+k*3.75*u;ln(px-2.6*u,py-2.6*u*dir,px+2.6*u,py+2.6*u*dir,"#111",u*.35)}}};
// 8 Hering
D[8]=t=>{bg("#f2f2f2");for(let i=0;i<32;i++){const a=i/32*TAU+t*.05;ln(cx,cy,cx+Math.cos(a)*120*u,cy+Math.sin(a)*120*u,"#444",u*.3)}ln(cx-14*u,0,cx-14*u,H,"#d22",u*.8);ln(cx+14*u,0,cx+14*u,H,"#d22",u*.8)};
// 9 Wundt
D[9]=t=>{bg("#f2f2f2");for(const s of[-1,1])for(let i=0;i<22;i++){const a=i/22*TAU+t*.05*s;ln(cx+s*34*u,cy,cx+s*34*u+Math.cos(a)*90*u,cy+Math.sin(a)*90*u,"#444",u*.3)}ln(cx-14*u,0,cx-14*u,H,"#d22",u*.8);ln(cx+14*u,0,cx+14*u,H,"#d22",u*.8)};
// 10 Poggendorff
D[10]=t=>{bg("#eee");const bw=14*u;rc(cx-bw/2,cy-34*u,bw,68*u,"#555");const m=1.1,x1=cx-34*u,y1=cy+26*u,xs=cx+34*u,ys=y1-m*(xs-x1);ln(x1,y1,cx-bw/2,y1-m*(bw?cx-bw/2-x1:0),"#d22",u*.7);ln(cx+bw/2,y1-m*(cx+bw/2-x1),xs,ys,"#d22",u*.7);
  const a=flash(t,.7);if(a>0)ln(x1,y1,xs,ys,`rgba(40,40,40,${a})`,u*.2)};
// 11 Kanizsa üçgeni
D[11]=t=>{bg("#f4f4f4");const R=26*u,pr=7*u;const pts=[0,1,2].map(i=>{const a=-Math.PI/2+i*TAU/3;return[cx+Math.cos(a)*R,cy+8*u+Math.sin(a)*R,a]});
  const m=.35+.1*Math.sin(t*2);pts.forEach(([x,y,a])=>{ctx.fillStyle="#111";ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,pr,a+Math.PI-(.52+m*0)+0,a+Math.PI+(.52));ctx.closePath();ctx.fill()});
  for(let i=0;i<3;i++){const [x,y,a]=pts[i],[x2,y2]=pts[(i+1)%3];ln(x+Math.cos(a+Math.PI)*0,y,x,y,"#111",1)}
  // zıt yönlü V'ler: ters üçgen hissi
  pts.forEach(([x,y,a])=>{const b=a+Math.PI;ln(cx+Math.cos(b)*R*1.0,cy+8*u+Math.sin(b)*R*1.0,cx+Math.cos(b+.0)*R,cy+8*u+Math.sin(b)*R,"#111",1)})};
// 12 Kanizsa karesi
D[12]=t=>{bg("#f4f4f4");const h=20*u,pr=8*u;for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){const x=cx+sx*h,y=cy+sy*h,a=Math.atan2(-sy,-sx);ctx.fillStyle="#111";ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,pr,a+Math.PI/4,a+Math.PI*7/4);ctx.closePath();ctx.fill()}};
// 13 Necker küpü
D[13]=t=>{bg("#101820");const s=16*u,a=t*.5,b=.6,v=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1]){let X=x*Math.cos(a)+z*Math.sin(a),Z=-x*Math.sin(a)+z*Math.cos(a),Y=y*Math.cos(b)-Z*Math.sin(b);v.push([cx+X*s,cy+Y*s])}
  const e=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];for(const[i,j]of e)ln(v[i][0],v[i][1],v[j][0],v[j][1],"#8fe6ff",u*.6);for(const p of v)ci(p[0],p[1],u*.6,"#fff")};
// 14 Dönen küre (nokta)
let SPH=null;
D[14]=t=>{bg("#06121c");if(!SPH){SPH=[];for(let i=0;i<420;i++){const z=Math.random()*2-1,a=Math.random()*TAU,r=Math.sqrt(1-z*z);SPH.push([r*Math.cos(a),z,r*Math.sin(a)])}}
  const R=26*u,an=t*.9;for(const[x,y,z]of SPH){const X=x*Math.cos(an)+z*Math.sin(an);ci(cx+X*R,cy+y*R,u*.5,"#cfeeff")}};
// 15 Spiral sonrası etkisi (20 sn dönüş, 12 sn sabit)
D[15]=t=>{const ph=t%32;bg("#000");const rot=ph<20;const an=rot?t*1.6:0;ctx.save();ctx.translate(cx,cy);
  if(rot){for(let k=0;k<8;k++){ctx.strokeStyle=k%2?"#fff":"#fff";ctx.lineWidth=u*2.2;ctx.beginPath();for(let a=0;a<14;a+=.1){const r=a*3.2*u*.55,th=a+an+k*TAU/8;const x=Math.cos(th)*r,y=Math.sin(th)*r;a?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ci(0,0,u*.8,"#f33")}
  else{ctx.fillStyle="#bbb";ctx.font=`${u*4}px Consolas`;ctx.textAlign="center";ctx.fillText("ŞİMDİ BURAYA BAKIN",0,-10*u);for(let i=-6;i<=6;i++)ln(i*6*u,-3*u,i*6*u,30*u,"#777",u*.4);ci(0,-26*u,u*.8,"#f33")}ctx.restore();
  ctx.fillStyle="rgba(95,230,255,.8)";ctx.font=`${u*2.2}px Consolas`;ctx.textAlign="center";ctx.fillText(rot?`Kırmızı noktaya bakın · ${Math.ceil(20-ph)} sn`:"Sabit görüntüye bakın",cx,H*.14)};
// 16 Şelale etkisi
D[16]=t=>{const ph=t%32;bg("#111");const rot=ph<20,w=50*u,x0=cx-w/2;ctx.save();ctx.beginPath();ctx.rect(x0,cy-30*u,w,60*u);ctx.clip();const sp=rot?24*u:0,o=(t*sp)%(6*u);for(let y=-12*u;y<70*u;y+=6*u){rc(x0,cy-30*u+y+(rot?o:0),w,3*u,"#e8e8e8")}ctx.restore();ln(x0,cy-30*u,x0,cy+30*u,"#555",u*.3);ln(x0+w,cy-30*u,x0+w,cy+30*u,"#555",u*.3);
  ctx.fillStyle="rgba(95,230,255,.8)";ctx.font=`${u*2.2}px Consolas`;ctx.textAlign="center";ctx.fillText(rot?`Ortasına bakın, şeritler akıyor · ${Math.ceil(20-ph)} sn`:"Şimdi durdu: yukarı kayıyor mu?",cx,H*.14)};
// 17 Fraser sarmalı
D[17]=t=>{bg("#cfcfcf");for(let y=0;y<H;y+=4*u)rc(0,y,W,2*u,"#ddd");for(let r=6*u;r<46*u;r+=6*u){const N=Math.round(r/u*3.2);for(let k=0;k<N;k++){const a=k/N*TAU+t*.05,da=TAU/N;ctx.strokeStyle=k%2?"#111":"#fafafa";ctx.lineWidth=u*1.4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r-1.2*u),cy+Math.sin(a)*(r-1.2*u));ctx.lineTo(cx+Math.cos(a+da)*(r+1.2*u),cy+Math.sin(a+da)*(r+1.2*u));ctx.stroke()}}};
// 18 Çevresel kayma
D[18]=t=>{bg("#9a9a9a");const cols=7,rows=4,s=15*u,pal=["#000","#3a3a3a","#fff","#c8c8c8"];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const X=cx+(i-(cols-1)/2)*s,Y=cy+(j-(rows-1)/2)*s*.95,sgn=(i+j)%2?1:-1;for(let ring=0;ring<2;ring++){const r0=(ring?3.2:5.8)*u;for(let k=0;k<16;k++){ctx.fillStyle=pal[(k%4+(ring?0:0))%4];ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,r0*1.45,k/16*TAU,(k+1)/16*TAU);ctx.closePath();if(ring===0)ctx.fill()}}ci(X,Y,u*3.4,"#9a9a9a");for(let k=0;k<16;k++){ctx.fillStyle=pal[(3-k%4+4)%4];ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,u*3.4,k/16*TAU,(k+1)/16*TAU);ctx.closePath();ctx.fill()}}};
// 19 Leylak kovalayıcı
D[19]=t=>{bg("#8d8d8d");const n=12,R=28*u,off=Math.floor(t*8)%n;for(let i=0;i<n;i++){if(i===off)continue;const a=i/n*TAU;const g=ctx.createRadialGradient(cx+Math.cos(a)*R,cy+Math.sin(a)*R,0,cx+Math.cos(a)*R,cy+Math.sin(a)*R,6*u);g.addColorStop(0,"#f0a0e0");g.addColorStop(.7,"rgba(240,160,224,.8)");g.addColorStop(1,"rgba(240,160,224,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,6*u,0,TAU);ctx.fill()}
  ln(cx-2*u,cy,cx+2*u,cy,"#000",u*.5);ln(cx,cy-2*u,cx,cy+2*u,"#000",u*.5)};
// 20 Troxler
D[20]=t=>{bg("#8a8a8a");const g=ctx.createRadialGradient(cx,cy,12*u,cx,cy,30*u);g.addColorStop(0,"rgba(120,150,190,0)");g.addColorStop(.5,"rgba(130,160,200,.55)");g.addColorStop(1,"rgba(120,150,190,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,30*u,0,TAU);ctx.fill();ci(cx,cy,u*.9,"#000")};
// 21 Renkli art-görüntü
D[21]=t=>{const ph=t%36,on=ph<20;bg(on?"#000":"#fff");if(on){const c=["#00d0d0","#d000d0","#e0e000"];for(let i=0;i<3;i++){ci(cx+(i-1)*24*u,cy-6*u,10*u,c[i])}pg([[cx-8*u,cy+22*u],[cx+8*u,cy+22*u],[cx,cy+10*u]],"#00d0d0")}
  ci(cx,cy-6*u,u*.7,on?"#fff":"#000");ctx.fillStyle=on?"rgba(255,255,255,.7)":"rgba(0,0,0,.6)";ctx.font=`${u*2.3}px Consolas`;ctx.textAlign="center";ctx.fillText(on?`Ortadaki noktaya bakın · ${Math.ceil(20-ph)} sn`:"Şimdi beyaza bakın, tamamlayıcı renkler beliriyor",cx,H*.14)};
// 22 Gölge satranç
D[22]=t=>{bg("#6b6b6b");const s=8.2*u,x0=cx-4*s,y0=cy-4*s,dk=105,lt=190;for(let j=0;j<8;j++)for(let i=0;i<8;i++){const v=(i+j)%2?lt:dk;rc(x0+i*s,y0+j*s,s,s,`rgb(${v},${v},${v})`)}
  const sx=cx+6*u,sy=cy,g=ctx.createRadialGradient(sx,sy,6*u,sx,sy,18*u);g.addColorStop(0,"rgba(0,0,0,.45)");g.addColorStop(.7,"rgba(0,0,0,.45)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(x0,y0,8*s,8*s);
  const A=[x0+2*s,y0+3*s],B=[x0+5*s,y0+4*s];ctx.fillStyle="#fff";ctx.font=`${u*3}px Consolas`;ctx.textAlign="center";rc(A[0]+s*.2,A[1]+s*.2,s*.6,s*.6,"rgba(0,0,0,0)");
  const a=flash(t,.6);if(a>0)ln(A[0]+s/2,A[1]+s/2,B[0]+s/2,B[1]+s/2,`rgba(128,128,128,${a})`,s*.45);ctx.fillStyle="#fff";ctx.font=`bold ${u*3.2}px Consolas`;ctx.fillText("A",A[0]+s/2,A[1]+s*.7);ctx.fillText("B",B[0]+s/2,B[1]+s*.7)};
// 23 Eşzamanlı kontrast
D[23]=t=>{rc(0,0,W/2,H,"#222");rc(W/2,0,W/2,H,"#ddd");const s=18*u;rc(cx-W/4-s/2,cy-s/2,s,s,"#808080");rc(cx+W/4-s/2,cy-s/2,s,s,"#808080");const a=flash(t,.7);if(a>0)rc(cx-W/4,cy-s*.2,W/2,s*.4,`rgba(128,128,128,${a})`)};
// 24 Mach bantları
D[24]=t=>{const n=8,w=W*.76/n,x0=W*.12;for(let i=0;i<n;i++){const v=40+i*24;rc(x0+i*w,cy-26*u,w+1,52*u,`rgb(${v},${v},${v})`)}ctx.fillStyle="rgba(95,230,255,.8)";ctx.font=`${u*2.2}px Consolas`;ctx.textAlign="center";bg0();function bg0(){}};
// 25 Cornsweet
D[25]=t=>{const x0=cx-36*u,w=72*u,g=ctx.createLinearGradient(x0,0,x0+w,0);g.addColorStop(0,"#808080");g.addColorStop(.4,"#808080");g.addColorStop(.5,"#505050");g.addColorStop(.5001,"#b0b0b0");g.addColorStop(.6,"#808080");g.addColorStop(1,"#808080");bg("#222");ctx.fillStyle=g;ctx.fillRect(x0,cy-24*u,w,48*u);const a=flash(t,.7);if(a>0){rc(cx-w/2,cy-4*u,w*.38,u*2,`rgba(128,128,128,${a})`);rc(cx+w*.12,cy-4*u,w*.38,u*2,`rgba(128,128,128,${a})`)}};
// 26 Bezold
D[26]=t=>{rc(0,0,W/2,H,"#f4f4f4");rc(W/2,0,W/2,H,"#111");for(let y=0;y<H;y+=6*u){rc(0,y,W,1.2*u,"#d01818")}};
// 27 Munker-White
D[27]=t=>{bg("#f4f4f4");const bh=3.4*u;for(let y=cy-26*u,k=0;y<cy+26*u;y+=bh,k++){rc(W*.2,y,W*.6,bh,k%2?"#2a5cd6":"#e6c42e")}
  for(let x=0;x<8;x++){const X=W*.2+4*u+x*7*u,Y=cy-26*u+((x*3)%14)*bh;rc(X,Y,4*u,bh,"#8a8a8a")}};
// 28 Koffka halkası

let items=[],cur=1,autoOn=false,autoT=0,t0=performance.now();

let ws;function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>ws.send(JSON.stringify({type:"ill_ready"}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==="ill_init"){items=m.items;buildList();show(cur)}
    else if(m.type==="ill_do"){if(m.auto!==undefined){autoOn=!!m.auto;$("auto").classList.toggle("on",autoOn);autoT=performance.now();if(autoOn&&m.n===undefined)show(1)}
      if(m.list){$("list").style.display="block";$("list").style.outline="1px solid #6dffb0";setTimeout(()=>$("list").style.outline="",1500)}
      if(m.n!==undefined)show(m.n)}};
  ws.onclose=()=>setTimeout(connect,1500)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
$("next").onclick=()=>send({type:"ill_click",n:cur%50+1});$("prev").onclick=()=>send({type:"ill_click",n:(cur+48)%50+1});
$("auto").onclick=()=>send({type:"ill_auto",on:!autoOn});$("tgl").onclick=()=>{const l=$("list");l.style.display=l.style.display==="none"?"block":"none"};$("close").onclick=()=>send({type:"ill_close"});$("peek").onclick=()=>send({type:"mode_peek"});
