<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS LAB</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--c:#ffcf7f;--bg:#0b0803;--ln:rgba(255,207,127,.24);--hi:rgba(255,207,127,.16)}
body.ast{--c:#9fd0ff;--bg:#02060f;--ln:rgba(159,208,255,.26);--hi:rgba(159,208,255,.16)}
body.geo{--c:#e0b080;--bg:#0c0805;--ln:rgba(224,176,128,.26);--hi:rgba(224,176,128,.16)}
body.mat{--c:#c3adff;--bg:#06040f;--ln:rgba(195,173,255,.26);--hi:rgba(195,173,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f4ecdd;font-family:"Segoe UI",Bahnschrift,Consolas,sans-serif;user-select:none}
body.mat{color:#ece6fb}
#top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:5;background:linear-gradient(#000c,transparent);border-bottom:1px solid var(--ln)}
#title{font:600 13px Bahnschrift,Consolas;letter-spacing:.16em;color:var(--c);white-space:nowrap;flex:none}
#tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}#tabs button{padding:6px 9px;letter-spacing:.04em;font-size:12px;flex:none}@media(max-width:1250px){#title{font-size:11px;letter-spacing:.06em}#kit-dock .kit-b:not(#kit-priv){padding:0 4px}}#top>button,#top>#kit-dock{flex:none}
button{font:12.5px Consolas;letter-spacing:.1em;padding:7px 12px;cursor:pointer;color:var(--c);border:1px solid var(--ln);background:rgba(0,0,0,.45);white-space:nowrap}
button:hover{background:var(--hi)}button.on{background:var(--hi);border-color:var(--c)}
#close{border-color:rgba(255,120,84,.7);color:#ff9a7a}
#main{position:fixed;top:50px;bottom:46px;left:0;right:0;display:flex}
#list{width:230px;overflow:auto;border-right:1px solid var(--ln);padding:6px;background:rgba(0,0,0,.35);scrollbar-width:thin}
#list div{padding:5px 8px;font:13px/1.35 "Segoe UI";cursor:pointer;color:#e8dcc4;border-left:3px solid transparent}
body.mat #list div{color:#ddd4f6}
#list div:hover{background:var(--hi)}#list div.act{background:var(--hi);border-left-color:var(--c);color:#fff}
#list small{display:block;opacity:.6;font-size:11px}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%}
#chips{position:absolute;left:10px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:92%}
#tip{position:absolute;right:12px;bottom:10px;text-align:right;font:12px Consolas;color:var(--c);opacity:.75;z-index:2;pointer-events:none;white-space:pre}
#card{width:min(400px,35vw);overflow:auto;border-left:1px solid var(--ln);padding:12px 14px;background:rgba(0,0,0,.38);scrollbar-width:thin}
#ct{margin:0 0 4px;font:600 17px Bahnschrift,Consolas;letter-spacing:.1em;color:var(--c)}
#cb{font:13.5px/1.55 "Segoe UI";user-select:text}
#cb h4{margin:12px 0 3px;font:600 12px Consolas;letter-spacing:.25em;color:var(--c);opacity:.9}
#cb ul{margin:2px 0 4px 18px;padding:0}#cb li{margin:2px 0}
#cb .k{opacity:.65}
#cb .res{border-left:3px solid var(--c);background:var(--hi);padding:6px 10px;margin:8px 0;font:13px/1.55 Consolas;user-select:text}
#params{margin-top:8px}
.pr{margin:7px 0}.pr label{display:flex;justify-content:space-between;font:12px Consolas;color:var(--c);letter-spacing:.05em}
.pr input[type=range]{width:100%;accent-color:var(--c);margin:2px 0}
#bar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--ln);background:rgba(0,0,0,.6);z-index:5}
#cmd{flex:1;padding:8px 12px;background:rgba(0,0,0,.55);border:1px solid var(--ln);color:var(--c);font:14px Consolas;outline:0;user-select:text}
#cmd:focus{border-color:var(--c)}#hint{font:11.5px Consolas;opacity:.55;white-space:nowrap}
@media(max-width:1000px){#list{width:160px}#card{width:300px}#hint{display:none}}
/* ---- görsel cila */
button{border-radius:7px;transition:background .18s,border-color .18s,color .18s,transform .12s}button:active{transform:scale(.96)}
#tabs button{border-radius:7px 7px 0 0;border-bottom-color:transparent}
#tabs button.on{color:#fff;box-shadow:inset 0 -2px 0 var(--c),0 6px 18px -8px var(--c)}
#list{scrollbar-color:var(--ln) transparent}#list div{border-radius:0 7px 7px 0;margin:1px 0;transition:background .16s,padding-left .16s,color .16s}
#list div:hover{padding-left:12px}#list div.act{box-shadow:inset 0 0 22px -10px var(--c)}
#card{scrollbar-color:var(--ln) transparent;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),rgba(0,0,0,.42)}
#ct{animation:cardIn .35s both}#cb>*{animation:cardIn .4s both}#cb>*:nth-child(2){animation-delay:.04s}#cb>*:nth-child(3){animation-delay:.08s}#cb>*:nth-child(n+4){animation-delay:.12s}
@keyframes cardIn{from{opacity:0;transform:translateY(7px)}}
#cb h4{display:flex;align-items:center;gap:8px}#cb h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
#cb .res{border-radius:0 9px 9px 0;box-shadow:0 0 24px -12px var(--c);animation:cardIn .4s both}
#params{border-top:1px solid var(--ln);padding-top:6px}
.pr{padding:7px 10px 5px;border:1px solid transparent;border-radius:9px;transition:background .2s,border-color .2s}.pr:hover{background:var(--hi);border-color:var(--ln)}
.pr label span:last-child{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.pr input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--c),var(--ln));outline:0;margin:8px 0 4px;cursor:pointer}
.pr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--c);box-shadow:0 0 10px var(--c);transition:transform .12s}
.pr input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}
#chips button{border-radius:16px;backdrop-filter:blur(6px)}
#tip{padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.35)}#tip:empty{display:none}
#cmd{border-radius:8px;transition:border-color .2s,box-shadow .2s}#cmd:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
</style></head><body>
<div id="top"><span id="title">LAB</span><div id="tabs"></div><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="main"><div id="list"></div>
 <div id="stage"><canvas id="cv"></canvas><div id="tip"></div><div id="chips"></div></div>
 <div id="card"><h3 id="ct"></h3><div id="cb"></div><div id="params"></div></div></div>
<div id="bar"><input id="cmd" placeholder="Komut yazın ya da söyleyin… (örn: eğik atış · açıyı 60 yap · x kare eksi 4 çiz · küre yarıçap 3 hacim)" spellcheck="false" autocomplete="off"><span id="hint">Esc = çık</span></div>
<script>
"use strict";
const $=id=>document.getElementById(id),TOK=new URLSearchParams(location.search).get("t");
const KIND=location.pathname.split("/").pop(),FIZ=KIND!=="matematik";document.body.classList.add(KIND==="fizik"?"fiz":KIND==="astronomi"?"ast":KIND==="jeoloji"?"geo":"mat");
const cv=$("cv"),ctx=cv.getContext("2d");let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=$("stage").getBoundingClientRect();W=Math.max(10,r.width);H=Math.max(10,r.height);cv.width=W*DPR;cv.height=H*DPR}addEventListener("resize",resize);
const TAU=Math.PI*2,R=Math.random,rad=d=>d*Math.PI/180;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fm=(x,d)=>{if(!isFinite(x))return"—";const a=Math.abs(x);return a>=1e5||(a<1e-3&&a>0)?x.toExponential(2):(+x.toPrecision(d||4)).toString()};
let D=null,tab=null,S={},T0=performance.now(),tt=0,P={};
const TABS=KIND==="fizik"?[["exp","DENEYLER"],["calc","HESAP"],["info","KAVRAMLAR"]]:FIZ?[["exp","DENEYLER"],["info","KAVRAMLAR"]]:[["graph","GRAFİK"],["solve","DENKLEM"],["shape","3B CİSİMLER"],["circle","BİRİM ÇEMBER"],["calc","HESAP"],["info","KAVRAMLAR"]];
$("title").textContent={fizik:"FİZİK LABORATUVARI",astronomi:"ASTRONOMİ LABORATUVARI",jeoloji:"JEOLOJİ LABORATUVARI",matematik:"MATEMATİK LABORATUVARI"}[KIND];
// ------------------------------------------------------------------ iletişim
let ws;function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function state(o){S=Object.assign(S,o);send({type:"scene_state",kind:KIND,state:o})}
function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>send({type:"scene_ready",kind:KIND});
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.kind!==KIND)return;
  if(m.type==="scene_init"){D=m.data;buildTabs();setTab(TABS[0][0])}else if(m.type==="scene_do"&&D)handleDo(m.do||{})};
 ws.onclose=()=>setTimeout(connect,1500)}
function handleDo(d){
 if(!FIZ&&d.angle!==undefined)CIR.a=((d.angle%360)+360)%360;
 if(d.tab&&d.tab!==tab)setTab(d.tab);
 if(FIZ){if(d.exp&&d.exp!==S.exp)selExp(d.exp,d.set);else if(d.set)applySet(d.set)}
 else{if(d.shape&&(d.shape!==S.shape||d.set))selShape(d.shape,d.set);if(d.fns!==undefined)setFns(d.fns,d.reset);if(d.angle!==undefined)setAngle(d.angle);if(d.zoom)zoomBy(d.zoom);}
 if(d.concept)selConcept(d.concept);
 if(d.result)showResult(d.result)}
function buildTabs(){const el=$("tabs");el.innerHTML="";TABS.forEach(([k,n])=>{const b=document.createElement("button");b.dataset.k=k;b.textContent=n;b.onclick=()=>setTab(k);el.appendChild(b)})}
function setList(items,onClick,sel){const l=$("list");l.style.display=items?"block":"none";l.innerHTML="";if(items)items.forEach((it,i)=>{const d=document.createElement("div");d.innerHTML=esc(it[0])+(it[1]?`<small>${esc(it[1])}</small>`:"");d.dataset.i=i;d.onclick=()=>onClick(i);l.appendChild(d)});markList(sel);resize()}
function markList(i){document.querySelectorAll("#list div").forEach(d=>d.classList.toggle("act",+d.dataset.i===i));const a=document.querySelector("#list div.act");if(a)a.scrollIntoView({block:"nearest"})}
function card(title,html){$("ct").textContent=title;$("cb").innerHTML=html}
function showResult(r){if(!r)return;let h=$("cb").querySelector(".res");if(!h){h=document.createElement("div");h.className="res";$("cb").prepend(h)}h.innerHTML=`<b>${esc(r.title||"")}</b><br>`+r.lines.map(esc).join("<br>");S.result=r}
function chips(arr){const c=$("chips");c.innerHTML="";arr.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>send({type:"text",text:t});c.appendChild(b)})}
function setTab(k){tab=k;T0=performance.now();document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));$("chips").innerHTML="";$("params").innerHTML="";$("tip").textContent="";resize();state({tab:k});
 ({exp:tabExp,calc:tabCalc,info:tabInfo,graph:tabGraph,solve:tabSolve,shape:tabShape,circle:tabCircle}[k])()}
function sliders(defs,vals,onChange){const box=$("params");box.innerHTML="";defs.forEach(([k,name,unit,lo,hi,def,step])=>{const d=document.createElement("div");d.className="pr";const v=vals[k]!==undefined?vals[k]:def;
  d.innerHTML=`<label><span>${esc(name)}</span><span id="pv_${k}">${fm(v)} ${esc(unit||"")}</span></label><input type="range" min="${lo}" max="${hi}" step="${step}" value="${v}" data-k="${k}">`;
  d.querySelector("input").oninput=e=>{const x=+e.target.value;vals[k]=x;$("pv_"+k).textContent=fm(x)+" "+(unit||"");onChange(k,x)};box.appendChild(d)})}
function syncSliders(defs,vals){defs.forEach(([k,,unit])=>{const i=document.querySelector(`#params input[data-k="${k}"]`);if(i){i.value=vals[k];$("pv_"+k).textContent=fm(vals[k])+" "+(unit||"")}})}
let pT=0;function askParam(extra){clearTimeout(pT);pT=setTimeout(()=>send(Object.assign({type:"sci_param",kind:KIND},extra)),90)}
// ================================================================== FİZİK
function curExp(){return D.exps.find(e=>e.key===S.exp)}
function tabExp(){const arr=D.exps;setList(arr.map(e=>[e.name,""]),i=>selExp(arr[i].key),Math.max(0,arr.findIndex(e=>e.key===(S.exp||arr[0].key))));selExp(S.exp||arr[0].key,S.params)}
function selExp(k,set){const i=D.exps.findIndex(e=>e.key===k);if(i<0)return;const e=D.exps[i];const changed=S.exp!==k;S.exp=k;if(changed||!P[k]){P[k]={};e.params.forEach(p=>P[k][p[0]]=p[5])}
 if(set)Object.assign(P[k],set);S.params=P[k];T0=performance.now();ST.pen=null;ST.col=null;ST.blk=null;ST.orb=null;state({exp:k,params:P[k]});markList(i);
 card(e.name,`<p>${esc(e.aim)}</p><h4>FORMÜLLER</h4><ul>${e.formulas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h4>NEDEN?</h4><p>${esc(e.why)}</p>`);
 sliders(e.params,P[k],()=>{T0=performance.now();ST.pen=null;ST.col=null;ST.blk=null;ST.orb=null;state({params:P[k]});askParam({exp:k,params:P[k]})});askParam({exp:k,params:P[k]})}
function applySet(set){const k=S.exp;if(!k)return;Object.assign(P[k],set);const e=curExp();syncSliders(e.params,P[k]);T0=performance.now();ST.pen=null;ST.col=null;ST.blk=null;ST.orb=null;state({params:P[k]})}
function tabCalc(){setList(null);if(FIZ){card("Formül hesaplayıcı",`<p>Değerleri birimleriyle söyleyin ya da yazın; Jarvis formülü seçip hesaplar.</p><ul><li>5 kilo 3 m/s² kuvvet</li><li>12 volt 4 ohm akım</li><li>10 kg 20 m/s kinetik enerji</li><li>2 kg 10 metre potansiyel enerji</li><li>100 metre 12 saniye hız</li><li>50 newton 3 metre iş</li><li>200 joule 10 saniye güç</li></ul>`);chips(["5 kilo 3 m/s² kuvvet","12 volt 4 ohm akım","10 kg 20 m/s kinetik enerji","100 metre 12 saniye hız"])}
 else{card("Hesap",`<p>Aritmetik, sayı teorisi, kombinatorik, türev ve integral.</p><ul><li>12 çarpı 7 artı 3</li><li>karekök 144 · 2 üzeri 10</li><li>10 faktöriyel</li><li>360 asal çarpanlar · 17 asal mı</li><li>48 ve 36 ebob ekok</li><li>10'un 3'lü kombinasyonu</li><li>240'ın yüzde 15'i</li><li>3 x kare artı 2 x eksi 5 türevi</li></ul>`);chips(["12 çarpı 7 artı 3","10 faktöriyel","360 asal çarpanlar","48 ve 36 ebob ekok","3 x kare artı 2 x eksi 5 türevi"])}}
function tabInfo(){const arr=D.concepts;setList(arr.map(c=>[c.title,""]),i=>selConcept(arr[i].title),0);selConcept(S.concept||arr[0].title)}
function selConcept(t){const i=D.concepts.findIndex(c=>c.title===t);if(i<0)return;S.concept=t;markList(i);const sn=D.concepts[i].text.split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ0-9(])/);card(D.concepts[i].title,`<p>${esc(sn[0])}</p>`+(sn.length>1?"<ul>"+sn.slice(1).map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>":""))}
// ---- simülasyon çizimleri
const ST={};
const BGC={fizik:[[58,40,16],"#0b0803","#040301","255,207,127"],astronomi:[[14,30,66],"#02060f","#000103","159,208,255"],jeoloji:[[56,38,22],"#0c0805","#040302","224,176,128"],matematik:[[36,24,78],"#06040f","#020108","195,173,255"]}[KIND];
const BGS=Array.from({length:150},(_,i)=>({x:(i*.7548777)%1,y:(i*.5698403)%1,r:.5+((i*7)%10)/7,s:.5+(i%9)*.2,p:i*1.3}));
function bg(){ctx.setTransform(DPR,0,0,DPR,0,0);const t=performance.now()/1000,g=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.78);g.addColorStop(0,`rgb(${BGC[0]})`);g.addColorStop(.55,BGC[1]);g.addColorStop(1,BGC[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(KIND==="astronomi"){for(const s of BGS){const a=.25+.55*Math.abs(Math.sin(t*s.s*.6+s.p));ctx.fillStyle=`rgba(${s.p%3<1?"255,236,204":"214,230,255"},${a})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*.6,0,TAU);ctx.fill()}}
 else{ctx.strokeStyle=`rgba(${BGC[3]},.045)`;ctx.lineWidth=1;ctx.beginPath();for(let x=(W/2)%44;x<W;x+=44){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=(H*.4)%44;y<H;y+=44){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  for(let i=0;i<36;i++){const s=BGS[i],x=((s.x+t*.005*s.s)%1)*W,y=((s.y-t*.008*s.s)%1+1)%1*H;ctx.fillStyle=`rgba(${BGC[3]},${.04+.06*Math.abs(Math.sin(t*s.s+s.p))})`;ctx.beginPath();ctx.arc(x,y,1+s.r,0,TAU);ctx.fill()}}
 const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.4)");ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function txt(s,x,y,col,sz,al){ctx.fillStyle=col||"#f4ecdd";ctx.font=`${sz||13}px Consolas`;ctx.textAlign=al||"left";ctx.fillText(s,x,y)}
function arrow(x0,y0,x1,y1,col,w){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L<2)return;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-9*Math.cos(a-.4),y1-9*Math.sin(a-.4));ctx.lineTo(x1-9*Math.cos(a+.4),y1-9*Math.sin(a+.4));ctx.fill()}
function ball(x,y,r,c0,c1,gl){if(gl){const h=ctx.createRadialGradient(x,y,r*.6,x,y,r*2.6);h.addColorStop(0,gl);h.addColorStop(1,"rgba(0,0,0,0)");ctx.save();ctx.globalCompositeOperation="lighter";ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,r*2.6,0,TAU);ctx.fill();ctx.restore()}const g=ctx.createRadialGradient(x-r*.36,y-r*.38,r*.08,x,y,r);g.addColorStop(0,"#fff");g.addColorStop(.28,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function sunBall(x,y,r){const t=performance.now()/1000;ctx.save();ctx.globalCompositeOperation="lighter";const h=ctx.createRadialGradient(x,y,r*.7,x,y,r*3.4);h.addColorStop(0,"rgba(255,180,70,.5)");h.addColorStop(.35,"rgba(255,140,30,.14)");h.addColorStop(1,"rgba(255,120,0,0)");ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,r*3.4,0,TAU);ctx.fill();
 for(let i=0;i<14;i++){const a=i/14*TAU+t*.06,l=r*(1.55+.4*Math.sin(t*1.1+i*2.3));ctx.fillStyle="rgba(255,200,100,.16)";ctx.beginPath();ctx.moveTo(x+Math.cos(a-.09)*r*.95,y+Math.sin(a-.09)*r*.95);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.lineTo(x+Math.cos(a+.09)*r*.95,y+Math.sin(a+.09)*r*.95);ctx.fill()}ctx.restore();
