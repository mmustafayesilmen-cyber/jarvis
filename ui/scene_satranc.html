<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS SATRANÇ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--c:#3fe8ff;--gold:#ffd27a;--txt:#e2f7fb;--mut:rgba(226,247,251,.58);--ln:rgba(63,232,255,.2);--card:rgba(6,22,32,.66);--lt:#2a4a5c;--dk:#13293a;--bad:#ff8a70;--ok:#5ee08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(255,210,122,.06),transparent 70%),radial-gradient(ellipse at 50% -10%,#08303f 0%,#020a10 62%);color:var(--txt);font-family:"Segoe UI",Bahnschrift,sans-serif;user-select:none}
#top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;z-index:5;background:linear-gradient(#000d,transparent)}
#title{font:600 15px Bahnschrift,Consolas;letter-spacing:.42em;color:#fff}#title b{color:var(--gold);font-weight:600}
#sp{flex:1}
button{font:600 12px Bahnschrift,Consolas;letter-spacing:.1em;padding:8px 14px;cursor:pointer;color:var(--c);border:1px solid var(--ln);background:rgba(0,14,20,.6);border-radius:10px;white-space:nowrap}
button:hover{background:rgba(63,232,255,.12);border-color:var(--c)}button:disabled{opacity:.4;cursor:default}
#close{border-color:rgba(255,120,84,.55);color:var(--bad)}
#wrap{position:fixed;top:66px;bottom:92px;left:22px;right:22px;display:grid;grid-template-columns:minmax(240px,300px) 1fr minmax(280px,340px);gap:22px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;padding:2px}
.cardbox{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px)}
h3{margin:0 0 10px;font:600 11.5px Bahnschrift,Consolas;letter-spacing:.3em;color:var(--c);display:flex;align-items:center;gap:8px}h3 small{margin-left:auto;font:11px Consolas;letter-spacing:.04em;color:var(--mut)}
.pl{display:flex;align-items:center;gap:12px}.pl .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:28px;border:1px solid var(--ln)}
.pl b{display:block;font-size:15px}.pl span{font-size:12px;color:var(--mut)}
.pl .av.w{color:#fbfbf5;text-shadow:0 0 1px #000,0 2px 3px rgba(0,0,0,.7)}.pl .av.b{color:#1a1a22;text-shadow:1px 0 0 #c8d6dc,-1px 0 0 #c8d6dc,0 1px 0 #c8d6dc,0 -1px 0 #c8d6dc;background:rgba(255,255,255,.06)}
.pl.turn .av{border-color:var(--gold);box-shadow:0 0 16px rgba(255,210,122,.35)}
.caps{min-height:26px;font-size:20px;letter-spacing:-2px;margin-top:8px;color:#cfe;opacity:.85}.caps small{font-size:12px;letter-spacing:0;color:var(--mut);margin-left:8px}
#think{display:none;align-items:center;gap:8px;font-size:12.5px;color:var(--gold);margin-top:8px}#think i{width:12px;height:12px;border:2px solid rgba(255,210,122,.3);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#center{display:flex;align-items:center;justify-content:center;gap:14px;min-height:0}
#bw{position:relative;height:min(100%,calc(100vh - 170px));aspect-ratio:1;max-width:100%}
#board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,210,122,.25),0 0 40px rgba(63,232,255,.08)}
.s{position:relative;display:grid;place-items:center;cursor:pointer}.s.l{background:var(--lt)}.s.d{background:var(--dk)}
.s .co{position:absolute;font:600 11px Consolas;opacity:.55;pointer-events:none}.s .cf{right:4px;bottom:2px}.s .cr{left:4px;top:2px}
.s.last::before{content:"";position:absolute;inset:0;background:rgba(255,210,122,.22)}
.s.sel::before{content:"";position:absolute;inset:0;background:rgba(63,232,255,.32)}
.s.hint::before{content:"";position:absolute;inset:0;background:rgba(94,224,138,.3);animation:hl 1.2s ease-in-out infinite}@keyframes hl{50%{opacity:.4}}
.s.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,80,60,.85),rgba(255,80,60,0) 70%)}
.s .dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(63,232,255,.55);pointer-events:none}
.s .ring{position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(63,232,255,.6);pointer-events:none}
.pc{position:relative;font-size:min(7.4vh,64px);line-height:1;pointer-events:none;transition:transform .15s}
.pc.w{color:#fbfbf5;text-shadow:0 0 1px #000,0 2px 3px rgba(0,0,0,.7),1px 0 0 #333,-1px 0 0 #333,0 1px 0 #333,0 -1px 0 #333}
.pc.b{color:#1a1a22;text-shadow:0 0 1px #000,0 2px 4px rgba(0,0,0,.6),1px 0 0 #c8d6dc,-1px 0 0 #c8d6dc,0 1px 0 #c8d6dc,0 -1px 0 #c8d6dc}
.s.sel .pc{transform:scale(1.1)}
#evb{width:12px;height:min(100%,calc(100vh - 170px));border-radius:6px;background:#1a1a22;overflow:hidden;border:1px solid var(--ln);display:flex;flex-direction:column-reverse}#evb i{display:block;background:#fbfbf5;transition:height .6s}
#promo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,6,10,.6);z-index:5;border-radius:12px}#promo.on{display:flex}
#promo div{display:flex;gap:10px;background:rgba(4,18,26,.97);border:1px solid var(--gold);border-radius:16px;padding:14px}#promo button{font-size:46px;padding:4px 14px;line-height:1}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}#over.on{display:flex}
#over div{background:rgba(4,18,26,.92);border:1px solid var(--gold);border-radius:18px;padding:18px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}#over b{display:block;font:700 26px Bahnschrift;color:var(--gold)}#over span{color:var(--mut);font-size:13px}
#moves{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font:13.5px Consolas;max-height:32vh;overflow:auto;align-content:start}
#moves .n{color:var(--mut)}#moves .m{padding:2px 6px;border-radius:6px}#moves .m.cur{background:rgba(255,210,122,.15);color:var(--gold)}
#coach{font-size:13.5px;line-height:1.5;min-height:42px}#coach.none{color:var(--mut)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:7px 4px}.seg button.on{background:rgba(255,210,122,.14);border-color:var(--gold);color:#fff}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.lv button{padding:7px 0}.lv button.on{background:rgba(255,210,122,.14);border-color:var(--gold);color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;cursor:pointer;margin-top:10px}.sw .t{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid var(--ln);position:relative}
.sw .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#9fb6bf;transition:.2s}.sw.on .t{background:rgba(255,210,122,.3);border-color:var(--gold)}.sw.on .t::after{left:20px;background:#fff}
.mut{color:var(--mut);font-size:12.5px}
table.st{width:100%;border-collapse:collapse;font:12.5px Consolas}table.st td,table.st th{padding:4px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}table.st th{color:var(--mut);font-weight:400}table.st td:first-child{text-align:left}
#bar{position:fixed;left:22px;right:22px;bottom:14px;z-index:9;display:flex;flex-direction:column;gap:6px}
#cmdw{display:flex;align-items:center;gap:10px;background:rgba(0,10,16,.75);border:1px solid var(--ln);border-radius:14px;padding:4px 6px 4px 14px}#cmdw span{font:600 13px Consolas;color:var(--c)}
#cmd{flex:1;padding:9px 0;background:transparent;border:0;color:#fff;font:14px Consolas;outline:0;user-select:text}
#log{font:12.5px Consolas;color:#cfeeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;opacity:.85}
@media(max-width:1200px){#wrap{display:flex;flex-direction:column;overflow:auto}#bw{height:min(80vw,600px)}}
</style></head><body>
<div id="top"><span id="title">SATRANÇ <b>· JARVIS</b></span><span id="sp"></span><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="wrap">
 <div class="col">
  <div class="cardbox"><div class="pl" id="pj"><div class="av" id="avj">♚</div><div><b>Jarvis</b><span id="lvn">seviye</span></div></div><div id="think"><i></i>düşünüyor…</div><div class="caps" id="capj"></div></div>
  <div class="cardbox"><div class="pl" id="pu"><div class="av" id="avu">♔</div><div><b>Siz</b><span id="ucol">beyaz</span></div></div><div class="caps" id="capu"></div></div>
  <div class="cardbox"><h3>İSTATİSTİK <small>seviyeye göre</small></h3><table class="st" id="stats"></table></div>
  <div id="kit-cap-slot"></div>
 </div>
 <div id="center"><div id="evb" title="malzeme dengesi"><i></i></div><div id="bw"><div id="board"></div>
  <div id="promo"><div id="pbtns"></div></div><div id="over"><div><b id="ovt"></b><span id="ovs"></span></div></div></div></div>
 <div class="col">
  <div class="cardbox"><h3>HAMLELER <small id="mc"></small></h3><div id="moves"></div></div>
  <div class="cardbox" id="opnbox" style="display:none"><h3>AÇILIŞ</h3><div id="opn" style="font-size:13.5px;line-height:1.5"></div></div>
  <div class="cardbox"><h3>KOÇ</h3><div id="coach" class="none">Hamle yaptıkça belirgin hatalarınızı burada açıklarım.</div>
   <div class="sw" id="coachsw"><span>Koç uyarıları</span><span class="t"></span></div></div>
  <div class="cardbox"><h3>OYUN</h3>
   <div class="ctl"><button id="undo">↶ GERİ AL</button><button id="hint">💡 İPUCU</button><button id="flip">⇅ ÇEVİR</button><button id="resign" style="color:var(--bad);border-color:rgba(255,138,112,.35)">⚑ TESLİM</button></div>
   <p class="mut" style="margin:12px 0 6px">Yeni oyun · renginiz</p><div class="seg" id="colsel"><button data-c="w" class="on">♔ BEYAZ</button><button data-c="b">♚ SİYAH</button></div>
   <p class="mut" style="margin:10px 0 6px">Seviye</p><div class="lv" id="lvsel"></div>
   <button id="newg" style="width:100%;margin-top:10px;background:rgba(255,210,122,.12);border-color:var(--gold);color:#fff">YENİ OYUN</button></div>
 </div>
</div>
<div id="bar"><div id="cmdw"><span>›</span><input id="cmd" placeholder="Hamle ya da komut: e4 · at f3 · fil c4 alır · kısa rok · ipucu · geri al · yeni oyun siyah seviye 3 · çık" spellcheck="false" autocomplete="off"></div><div id="log">Jarvis: hamlenizi söyleyin ya da taşa tıklayıp gideceği kareye tıklayın.</div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),TOK=new URLSearchParams(location.search).get("t");
const GL={K:"♚︎",Q:"♛︎",R:"♜︎",B:"♝︎",N:"♞︎",P:"♟︎"},F="abcdefgh";
let ws,V=null,sel=null,flipped=null,newColor="w",newLevel=2,pend=null;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function cmd(t){send({type:"text",text:t});$("log").textContent="› komut uygulanıyor…"}
const nm=i=>F[i%8]+(Math.floor(i/8)+1),idx=n=>F.indexOf(n[0])+8*(+n[1]-1);
function render(v){V=v;if(flipped===null)flipped=v.color==="b";
 const B=$("board");B.innerHTML="";const mine=v.turn===v.color&&!v.result&&!v.thinking;
 for(let vr=0;vr<8;vr++)for(let vf=0;vf<8;vf++){const r=flipped?vr:7-vr,f=flipped?7-vf:vf,i=r*8+f,n=nm(i),p=v.sq[i];
  const d=document.createElement("div");d.className="s "+((r+f)%2?"l":"d");d.dataset.n=n;
  if(v.last&&v.last.includes(n))d.classList.add("last");if(v.check===n)d.classList.add("chk");if(sel===n)d.classList.add("sel");if(v.hint&&v.hint.includes(n))d.classList.add("hint");
  if(vr===7){const c=document.createElement("span");c.className="co cf";c.textContent=F[f];d.appendChild(c)}
  if(vf===0){const c=document.createElement("span");c.className="co cr";c.textContent=r+1;d.appendChild(c)}
  if(p!=="."){const s=document.createElement("span");s.className="pc "+(p===p.toUpperCase()?"w":"b");s.textContent=GL[p.toUpperCase()];d.appendChild(s)}
  if(sel&&(v.legal[sel]||[]).includes(n)){const m=document.createElement("span");m.className=p!=="."?"ring":"dot";d.appendChild(m)}
  d.onclick=()=>click(n);B.appendChild(d)}
 const me=v.color,jw=me==="w"?"b":"w";
 $("avu").textContent=$("avj").textContent="♚︎";$("avu").className="av "+me;$("avj").className="av "+jw;$("ucol").textContent=me==="w"?"beyaz":"siyah";$("lvn").textContent=`seviye ${v.level} · ${v.levelName}`;
 $("pu").classList.toggle("turn",v.turn===me&&!v.result);$("pj").classList.toggle("turn",v.turn!==me&&!v.result);$("think").style.display=v.thinking?"flex":"none";
 const capStr=a=>a.map(c=>GL[c.toUpperCase()]).join("");const myMat=v.material*(me==="w"?1:-1);
 $("capu").innerHTML=capStr(v.captured[jw])+(myMat>=100?`<small>+${Math.round(myMat/100)}</small>`:"");$("capj").innerHTML=capStr(v.captured[me])+(myMat<=-100?`<small>+${Math.round(-myMat/100)}</small>`:"");
 const wp=Math.max(5,Math.min(95,50+v.material/20));$("evb").firstElementChild.style.height=(flipped?100-wp:wp)+"%";
 const M=$("moves");M.innerHTML="";v.san.forEach((s,i)=>{if(i%2===0){const n=document.createElement("span");n.className="n";n.textContent=(i/2+1)+".";M.appendChild(n)}const e=document.createElement("span");e.className="m"+(i===v.san.length-1?" cur":"");e.textContent=s;M.appendChild(e)});
 if(v.san.length%2===1)M.appendChild(document.createElement("span"));M.scrollTop=M.scrollHeight;$("mc").textContent=v.san.length?`${Math.ceil(v.san.length/2)}. hamle`:"";
 $("opnbox").style.display=v.opening?"block":"none";if(v.opening){$("opn").innerHTML="";const b=document.createElement("b");b.textContent=v.opening[0];$("opn").appendChild(b);$("opn").appendChild(document.createElement("br"));$("opn").appendChild(document.createTextNode(v.opening[1]))}
 $("coach").textContent=v.comment||(v.coach?"Şu an bir uyarım yok.":"Koç kapalı.");$("coach").className=v.comment?"":"none";$("coachsw").classList.toggle("on",v.coach);
 $("over").classList.toggle("on",!!v.result);if(v.result){const [res,why]=v.result.split(" · ");const win=(res==="1-0"&&me==="w")||(res==="0-1"&&me==="b");$("ovt").textContent=res==="1/2-1/2"?"BERABERE":win?"KAZANDINIZ":"JARVIS KAZANDI";$("ovs").textContent=why||""}
 $("undo").disabled=!v.san.length||v.thinking;$("hint").disabled=!mine;$("resign").disabled=!!v.result||!v.san.length;
 const T=$("stats");T.innerHTML="<tr><th>Seviye</th><th>G</th><th>M</th><th>B</th></tr>"+[1,2,3,4,5].map(l=>{const s=v.stats[l]||{};return `<tr><td>${l} · ${v.levels[l]}</td><td>${s["kazanç"]||0}</td><td>${s["kayıp"]||0}</td><td>${s["beraberlik"]||0}</td></tr>`}).join("");
 $("lvsel").innerHTML=[1,2,3,4,5].map(l=>`<button data-l="${l}" class="${l===newLevel?"on":""}" title="${v.levels[l]}">${l}</button>`).join("");
 $("lvsel").querySelectorAll("button").forEach(b=>b.onclick=()=>{newLevel=+b.dataset.l;send({type:"satranc_level",level:newLevel});render(V)})}
function click(n){if(!V||V.result||V.thinking||V.turn!==V.color)return;const p=V.sq[idx(n)];
 if(sel&&(V.legal[sel]||[]).includes(n)){const from=sel,piece=V.sq[idx(from)].toUpperCase(),last=n[1]==="8"||n[1]==="1";sel=null;
  if(piece==="P"&&last){pend={from,to:n};const g=V.color==="w"?["Q","R","B","N"]:["Q","R","B","N"];$("pbtns").innerHTML=g.map(x=>`<button data-p="${x}">${GL[x]}</button>`).join("");$("promo").classList.add("on");
   $("pbtns").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("promo").classList.remove("on");send({type:"satranc_move",from:pend.from,to:pend.to,promo:b.dataset.p});pend=null});render(V);return}
  send({type:"satranc_move",from,to:n});render(V);return}
 if(p!=="."&&(p===p.toUpperCase())===(V.color==="w")&&V.legal[n]){sel=sel===n?null:n}else sel=null;render(V)}
function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>{send({type:"scene_ready",kind:"satranc"});setTimeout(()=>send({type:"satranc_resume"}),600)};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.kind!=="satranc")return;
  if(m.type==="scene_init"&&m.data){newLevel=m.data.level;newColor=m.data.color;render(m.data);document.querySelectorAll("#colsel button").forEach(b=>b.classList.toggle("on",b.dataset.c===newColor))}
  else if(m.type==="scene_do"){const d=m.do||{};if(d.new){flipped=null;sel=null}if(d.flip){flipped=!flipped}if(d.data)render(d.data);if(d.msg)$("log").textContent="Jarvis: "+d.msg}};
 ws.onclose=()=>setTimeout(connect,1500)}
$("undo").onclick=()=>send({type:"satranc_undo"});$("hint").onclick=()=>send({type:"satranc_hint"});$("flip").onclick=()=>{flipped=!flipped;render(V)};
$("resign").onclick=()=>{if(confirm("Teslim olmak istiyor musunuz?"))send({type:"satranc_resign"})};
$("coachsw").onclick=()=>send({type:"satranc_coach",on:!(V&&V.coach)});
document.querySelectorAll("#colsel button").forEach(b=>b.onclick=()=>{newColor=b.dataset.c;document.querySelectorAll("#colsel button").forEach(x=>x.classList.toggle("on",x===b))});
$("newg").onclick=()=>{if(V&&V.san.length&&!V.result&&!confirm("Süren oyun bırakılıp yeni oyun başlasın mı?"))return;send({type:"satranc_new",color:newColor,level:newLevel})};
function shut(){send({type:"scene_close"})}
$("close").onclick=shut;$("peek").onclick=()=>send({type:"mode_peek"});
$("cmd").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&e.target.value.trim()){cmd(e.target.value.trim());e.target.value=""}else if(e.key==="Escape")e.target.blur()});
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("promo").classList.contains("on")){$("promo").classList.remove("on");pend=null;return}if(sel){sel=null;render(V);return}shut()}});
addEventListener("resize",()=>{if(V)render(V)});
connect();window.focus();
</script></body></html>
