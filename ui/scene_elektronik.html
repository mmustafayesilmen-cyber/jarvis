 if((PLAN.notlar||[]).length)h+='<div class="h">NOTLAR</div>'+PLAN.notlar.map(x=>'<div class="is">'+e(x)+"</div>").join("");
 h+='<div class="h">BLOKLAR ('+BLK.length+")</div>";Object.keys(KKAT).forEach(k=>{const l=BLK.filter(b=>b.kat===k);if(!l.length)return;h+='<div class="kt"><span>'+KKAT[k]+"</span><span>"+l.length+"</span></div>"+l.map(b=>'<div class="li" style="flex-wrap:wrap;cursor:default" title="'+e(b.acik||"")+'"><b>'+e(b.ad)+'</b><a style="margin-left:auto;color:var(--c)" data-a="blk:'+e(b.id)+'">+ EKLE</a>'+((b.param||[]).length?'<div style="flex-basis:100%;display:flex;gap:6px;margin-top:4px">'+b.param.map(q=>q.tip==="secim"?'<select class="t" style="padding:3px 6px;font-size:11.5px" data-bp="'+e(b.id)+"|"+e(q.ad)+'" title="'+e(q.ad)+'">'+(q.secenekler||[]).map(o=>"<option"+(String(o)===String(q.varsayilan)?" selected":"")+">"+e(o)+"</option>").join("")+"</select>":'<input class="t" style="padding:3px 6px;font-size:11.5px;width:'+(q.tip==="sayi"?"64px":"100%")+'" data-bp="'+e(b.id)+"|"+e(q.ad)+'" value="'+e(q.varsayilan==null?"":q.varsayilan)+'" title="'+e(q.ad)+'">').join("")+"</div>":"")+'<div class="mut" style="flex-basis:100%;font-size:11.5px">'+e(b.acik||"")+"</div></div>").join("")});
 return h}
function wireRow(t,i){const A=I.get(t.a[0]),Bq=I.get(t.b[0]);return'<div class="li"><i style="width:10px;height:10px;border-radius:50%;background:'+(t.renk||(t.tip==="kablo"&&ends(t)?wcolor(t,ends(t),i):(MASK[K.renk]||MASK.yesil)[1]))+'"></i>'+e((A?A.d.etiket:"?")+"."+t.a[1]+" → "+(Bq?Bq.d.etiket:"?")+"."+t.b[1])+' <span class="mut">'+t.tip+'</span><a data-a="unw:'+i+'">×</a></div>'}
$("pb").onclick=ev=>{const el=ev.target.closest("[data-a]");if(!el)return;ev.stopPropagation();const a=el.dataset.a,k=a.indexOf(":"),op=k<0?a:a.slice(0,k),v=k<0?"":a.slice(k+1);
 if(op==="rot")rotSel();else if(op==="dup")dup();else if(op==="del"){delPart(sel);commit()}else if(op==="add"){setTool("sec");addPart(v,{},true)}else if(op==="unw"){K.teller.splice(+v,1);commit();show()}
 else if(op==="sel"){const it=I.get(v);if(it){select(it);camT.tx=wx(it.d.x);camT.tz=wz(it.d.z)}}else if(op==="open")Mode.send({type:"text",text:"§ac|"+v});else if(op==="delk")Mode.send({type:"text",text:"§silkart|"+v});else if(op==="tpl")Mode.send({type:"text",text:"§sablon|"+v});else if(op==="cmd")Mode.cmd(v);
 else if(op==="kurtarif"){kq=($("kq")||{}).value||kq;if(kq.trim()){Mode.send({type:"text",text:"kart kur: "+kq.trim()});PLAN.calisiyor=true;show()}}
 else if(op==="kex"){kq=v;Mode.send({type:"text",text:"kart kur: "+v});PLAN.calisiyor=true;show()}
 else if(op==="blk"){const pr={};$("pb").querySelectorAll('[data-bp^="'+v+'|"]').forEach(x=>{const n=x.dataset.bp.split("|")[1];pr[n]=x.type==="text"&&x.value!==""&&!isNaN(+x.value)?+x.value:x.value});Mode.send({type:"text",text:"§blok|"+v+"|"+JSON.stringify(pr)})}
 else if(op==="blx")Mode.send({type:"text",text:"§blokcikar|"+v});else if(op==="plk")Mode.send({type:"text",text:"§kur"});else if(op==="plt")Mode.send({type:"text",text:"§plantemizle"});
 else if(op==="copy"){const x=$("pb").querySelector("pre");if(x){const s=x.textContent;(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).catch(()=>{const r=document.createRange();r.selectNodeContents(x);const g=getSelection();g.removeAllRanges();g.addRange(r);document.execCommand("copy")});el.textContent="KOPYALANDI"}}};
$("pb").oninput=ev=>{if(ev.target.id==="kq")kq=ev.target.value};
$("pb").onchange=ev=>{if(ev.target.dataset.m){Mode.send({type:"text",text:"§mcu|"+ev.target.value});return}const f=ev.target.dataset.f;if(!f||!sel)return;const v=ev.target.value.trim();if(f==="etiket"){if(!v||K.parcalar.some(d=>d!==sel.d&&d.etiket===v)){ev.target.value=sel.d.etiket;return}sel.d.etiket=v;commit()}else{sel.d[f]=v;reb(sel);commit()}};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v));document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.c));
$("bS").onclick=()=>Mode.cmd(sim?"simülasyonu durdur":"simülasyonu başlat");$("bR").onclick=rotSel;$("bD").onclick=dup;$("bX").onclick=()=>{if(sel){delPart(sel);commit()}};$("bU").onclick=undoDo;
$("bc").innerHTML=Object.keys(MASK).map(k=>'<span class="sw" data-k="'+k+'" style="background:'+MASK[k][0]+'" title="'+k+'"></span>').join("");$("bc").onclick=ev=>{const k=ev.target.dataset.k;if(k){K.renk=k;mkBoardKeep();commit()}};
$("wc").innerHTML=WC.map((c,i)=>'<span class="sw'+(i?"":" cur")+'" data-k="'+c+'" style="background:'+(c||"linear-gradient(135deg,#22a565,#ff9a3c)")+'" title="'+(c?"Tel rengi":"Otomatik renk")+'"></span>').join("");$("wc").onclick=ev=>{const s=ev.target.closest(".sw");if(!s)return;wcol=s.dataset.k;document.querySelectorAll("#wc .sw").forEach(x=>x.classList.toggle("cur",x===s))};
function mkBoardKeep(){const d=camT.d;mkBoard();camT.d=d}
$("nm").onchange=ev=>{K.ad=ev.target.value.trim()||"Yeni Kart";commit()};$("nm").oninput=ev=>{K.ad=ev.target.value;dirty=1};
function resize(w,h){K.w=Math.max(10,Math.min(80,w|0||K.w));K.h=Math.max(10,Math.min(80,h|0||K.h));mkBoard();I.forEach(it=>{clamp(it);pose(it)});commit()}
$("bw").onchange=$("bh").onchange=()=>resize(+$("bw").value,+$("bh").value);

/* ---------- Python'dan gelen işlemler ---------- */
const SEV={hata:"HATA",uyari:"UYARI",bilgi:"BİLGİ"};
function act(d){const op=d.op;if(!op)return;
 if(op==="ekle"){let it;for(let i=0;i<Math.max(1,Math.min(20,d.n|0||1));i++)it=addPart(d.p,{deger:d.deger,renk:d.renk});if(it)select(it)}
 else if(op==="sil"){const h=d.hedef;if(h==="hepsi"){[...I.values()].forEach(delPart);K.teller=[]}else if(h==="secili")delPart(sel);else{const it=byTag(h)||[...I.values()].reverse().find(x=>x.d.p===h);delPart(it)}commit()}
 else if(op==="kart"){if(d.kart){undo.push(last);loadKart(d.kart);clearTimeout(syncT);syncT=setTimeout(()=>syncKart(),350);infoP=null;if(tab!=="kur")setTab("bilgi");else show()}}
 else if(op==="ad"){K.ad=d.ad||K.ad;$("nm").value=K.ad;commit()}else if(op==="boyut")resize(d.w,d.h);else if(op==="renk"){if(MASK[d.renk]){K.renk=d.renk;mkBoardKeep();commit()}}
 else if(op==="bagla"){const A=byTag(d.a&&d.a[0]),Bq=byTag(d.b&&d.b[0]);if(A&&Bq){const f=(it,n)=>P[it.d.p].pinler.findIndex(q=>q.ad.toLowerCase()===String(n).toLowerCase()),ka=f(A,d.a[1]),kb=f(Bq,d.b[1]);if(ka>=0&&kb>=0)addWire(A,ka,Bq,kb,d.tip==="kablo"?"kablo":"iz",d.renk)}}
 else if(op==="bilgi"){if(P[d.p]){if(sel&&sel.d.p!==d.p)select(null);infoP=d.p;setTab("bilgi")}}else if(op==="gorunum")setView(d.v)
 else if(op==="kontrol"){const s=d.sorunlar||[];out='<div class="h">DEVRE KONTROLÜ</div>'+(d.puan!=null?'<div class="sc">'+d.puan+'<small style="font-size:14px;color:var(--mut)"> / 100</small></div>':"")+(s.length?s.map(x=>'<div class="is '+e(x.sev)+'"'+(x.i?' data-a="sel:'+e(x.i)+'"':"")+"><b>"+(SEV[x.sev]||"")+"</b> "+e(x.msg)+"</div>").join(""):'<div class="is">Sorun bulunamadı. Devre temiz görünüyor.</div>');setTab("cikti")}
 else if(op==="sim"){simStart(d);out='<div class="h">SİMÜLASYON</div><table class="kv"><tr><td>Çalışan</td><td>'+(d.acik||[]).length+"</td></tr><tr><td>Yanıp sönen</td><td>"+(d.yanip||[]).length+"</td></tr><tr><td>Yanan (hasar)</td><td>"+(d.yanik||[]).length+"</td></tr></table>"+(d.not||[]).map(x=>'<div class="is">'+e(x)+"</div>").join("")+'<p class="mut">Simülasyon kural tabanlı ve yaklaşıktır; gerçek devreyi kurmadan önce KONTROL sonucuna da bakın.</p>';setTab("cikti")}
 else if(op==="simdur")simStop()
 else if(op==="kod"){out='<div class="h">'+e(d.baslik||"ARDUINO KODU")+'</div><div class="frm"><div class="w"><button class="s" data-a="copy">KOPYALA</button><button class="s" data-a="cmd:kodu kaydet">DOSYAYA KAYDET</button></div></div>'+(d.dosya?'<p class="mut">'+e(d.dosya)+"</p>":"")+'<pre class="kd">'+e(d.kod||"")+"</pre>";setTab("cikti")}
 else if(op==="bom"){out='<div class="h">MALZEME LİSTESİ</div><table class="kv"><tr><td>Adet</td><td>Parça</td></tr>'+(d.satirlar||[]).map(x=>"<tr><td>"+e(x.adet)+"×</td><td><b>"+e(x.ad)+"</b>"+(x.deger?" · "+e(x.deger):"")+'<br><span class="mut">'+e([].concat(x.etiketler||[]).join(", "))+"</span></td></tr>").join("")+"</table>";setTab("cikti")}
 else if(op==="hesap"){out='<div class="h">'+e(d.baslik||"HESAP")+'</div><table class="kv">'+(d.satirlar||[]).map(x=>"<tr><td>"+e(x[0])+"</td><td><b>"+e(x[1])+"</b></td></tr>").join("")+"</table>"+(d.aciklama?"<p>"+e(d.aciklama)+"</p>":"");setTab("cikti")}
 else if(op==="anlat"){out='<div class="h">DEVRE ANLATIMI</div>'+String(d.metin||"").split("\n").map(x=>"<p>"+e(x)+"</p>").join("");setTab("cikti")}
 else if(op==="plan"){PLAN=Object.assign({plan:[],notlar:[],mcu:"",calisiyor:false},d);if(tab==="kur")show();else setTab("kur")}
 else if(op==="kartlar"){BOARDS=d.kartlar||[];if(tab==="kart")show()}}
function init(d){P=d.parts||{};KATS=d.kats||[];TPL=d.sablonlar||[];BLK=d.bloklar||[];MC=d.mcular||[];if(d.plan)PLAN=Object.assign(PLAN,{plan:d.plan});BOARDS=d.kartlar||[];renderCat();loadKart(d.kart||K);undo=[];show()}
Mode.start({kind:"elektronik",title:"ELEKTRONİK LABORATUVARI",placeholder:"Komut: kırmızı led ekle · üç tane 220 ohm direnç ekle · kartın adını Robot Kolu yap · transistör nedir · devreyi kontrol et · trafik lambası devresini kur",init,act});
$("bg").style.display="none";requestAnimationFrame(loop);
if(!Mode.tok)fetch("/el_init.json").then(r=>r.json()).then(d=>{init(d);window.__act=act}).catch(()=>{});
</script></body></html>
