<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS PANEL</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
#stage{display:flex;flex-direction:column;gap:12px}
#tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#tools .sp{flex:1}
#grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:16px;padding:4px}
.t{position:relative;display:flex;flex-direction:column;cursor:grab;transition:border-color .2s,box-shadow .2s,transform .15s;min-height:0;overflow:hidden}
.t:hover{border-color:var(--c);box-shadow:0 12px 36px rgba(0,0,0,.4),0 0 22px color-mix(in srgb,var(--c) 28%,transparent)}
.t.s1{grid-column:span 1}.t.s2{grid-column:span 2}.t.s3{grid-column:span 2;grid-row:span 2}
.t.over{border-color:#fff;transform:scale(1.02)}.t.drag{opacity:.4}
.t .ctl{position:absolute;top:10px;right:12px;display:none;gap:4px}.t:hover .ctl{display:flex}.ctl button{padding:2px 8px;font-size:12px;letter-spacing:0}
.t .v{font:700 40px Bahnschrift,Consolas;color:#fff;text-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent);line-height:1.1}.t .v small{font-size:16px;color:var(--mut);font-weight:400}
.t .s{font-size:14px;color:var(--mut);margin-top:4px;line-height:1.45}.t .r{display:flex;justify-content:space-between;font-size:15px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
.up{color:var(--ok)}.dn{color:var(--bad)}.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 8px var(--c)}
.wk{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:10px}.wk div{flex:1;text-align:center;font:10px Consolas;color:var(--mut)}.wk i{display:block;background:var(--c);border-radius:3px 3px 0 0;margin-bottom:3px;opacity:.8;min-height:2px}
.nodata{color:var(--mut);font-size:14px;margin:auto 0}
@media(max-width:1100px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="stage"><div id="tools"></div><div id="grid"></div></div>
<script>
const TITLE={hava:"HAVA DURUMU",kur:"KURLAR · TL",sure:"BİLGİSAYAR SÜRESİ",pomodoro:"ODAK",sinav:"SINAVLAR",ajanda:"AJANDA",muzik:"ÇALAN MÜZİK",sistem:"SİSTEM"};
const DEF={order:["hava","sure","kur","pomodoro","sinav","ajanda","muzik","sistem"],size:{hava:3,sure:2,kur:1,pomodoro:1,sinav:1,ajanda:2,muzik:1,sistem:1},hidden:[]};
let L=load(),D=null,drag=null,stamp=0;
function load(){try{const x=JSON.parse(localStorage.getItem("panel_layout"));if(x&&x.order)return {...DEF,...x}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem("panel_layout",JSON.stringify(L))}catch(e){}}
Mode.start({kind:"panel",title:"PANEL",placeholder:"Komut: hava kutusunu büyüt · kur kutusunu gizle · müzik kutusunu göster · yenile · sıfırla · bugün ne kadar kullandım",init:d=>{D=d;draw();if(d.loading)Mode.cmd("yenile")},act,tick:()=>{if(Date.now()-stamp>60000){stamp=Date.now();Mode.send({type:"text",text:"yenile"})}}});
function act(d){if(d.data){D=d.data;stamp=Date.now();draw()}if(d.reset){L=JSON.parse(JSON.stringify(DEF));save();draw()}
 if(d.tile){const k=d.tile,h=L.hidden.indexOf(k);if(d.op==="hide"&&h<0)L.hidden.push(k);if(d.op==="show"&&h>=0)L.hidden.splice(h,1);
  if(d.op==="big")L.size[k]=Math.min(3,(L.size[k]||1)+1);if(d.op==="small")L.size[k]=Math.max(1,(L.size[k]||1)-1);save();draw()}}
const hm=s=>{const m=Math.floor(s/60);return Math.floor(m/60)+"<small> sa </small>"+(m%60)+"<small> dk</small>"};
const R={
 hava:(d,sz)=>'<div class="v">'+d.temp+'°<small> '+Mode.esc(d.city)+'</small></div><div class="s">'+Mode.esc(d.d)+' · hissedilen '+d.feels+'° · rüzgâr '+d.wind+' km/s</div>'+(sz>1?d.days.map((x,i)=>'<div class="r"><span>'+["Bugün","Yarın","Öbür gün"][i]+' · '+Mode.esc(x.d)+'</span><span>'+x.hi+'° / '+x.lo+'° · %'+(x.pp==null?0:x.pp)+'</span></div>').join(""):""),
 kur:d=>d.map(x=>'<div class="r"><span>'+x.k+'</span><b>'+x.v.toLocaleString("tr-TR",{minimumFractionDigits:2})+' ₺</b></div>').join(""),
 sure:(d,sz)=>'<div class="v">'+hm(d.sec)+'</div><div class="s">bugün aktif (Jarvis açıkken ölçülür)</div>'+(d.apps.length?d.apps.map(a=>'<div class="r"><span>'+Mode.esc(a.name)+'</span><span>'+Math.round(a.sec/60)+' dk</span></div>').join(""):"")+
   (sz>1&&d.week?'<div class="wk">'+(()=>{const mx=Math.max(1,...d.week.map(w=>w.sec));return d.week.map(w=>'<div><i style="height:'+Math.round(w.sec/mx*44)+'px"></i>'+w.gun+'</div>').join("")})()+'</div>':""),
 pomodoro:d=>'<div class="v">'+d.min+'<small> dk</small></div><div class="s">bugün odak · '+d.done+' tur · '+Mode.esc(d.phase)+'</div>',
 sinav:d=>d&&d.length?d.map(a=>'<div class="r"><span>'+Mode.esc(a.ders)+'</span><b>'+a.kalan+' gün</b></div>').join(""):'<div class="nodata">Kayıtlı sınav yok.</div>',
 ajanda:d=>d.length?d.map(a=>'<div class="r"><span>'+Mode.esc(a.t)+'</span><span class="mut">'+Mode.esc(a.w)+'</span></div>').join(""):'<div class="nodata">Yaklaşan kayıt yok.</div>',
 muzik:d=>d?'<div class="v" style="font-size:22px">'+Mode.esc(d.title)+'</div><div class="s">'+Mode.esc(d.artist||"")+(d.playing===false?" · duraklatıldı":"")+'</div>':'<div class="nodata">Şu an çalan bir şey yok.</div>',
 sistem:d=>'<div class="r"><span>İşlemci</span><b>%'+d.cpu+'</b></div><div class="bar"><i style="width:'+d.cpu+'%"></i></div><div class="r"><span>Bellek</span><b>%'+d.ram+'</b></div><div class="bar"><i style="width:'+d.ram+'%"></i></div>'+(d.bat!=null?'<div class="r"><span>Pil</span><b>%'+d.bat+(d.plug?" ⚡":"")+'</b></div>':"")};
function draw(){if(!D)return;
 $("tools").innerHTML='<span class="mut" style="font-size:13px">Kutucukları sürükleyerek yer değiştirin · üzerine gelince boyut ve gizle düğmeleri çıkar</span><span class="sp"></span>'+L.hidden.map(k=>'<button data-s="'+k+'">+ '+TITLE[k]+'</button>').join("")+'<button id="rf">YENİLE</button><button id="rs">DÜZENİ SIFIRLA</button>';
 $("tools").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>act({tile:b.dataset.s,op:"show"}));$("rf").onclick=()=>Mode.cmd("yenile");$("rs").onclick=()=>Mode.cmd("sıfırla");
 $("grid").innerHTML="";
 for(const k of L.order){if(L.hidden.includes(k))continue;const sz=L.size[k]||1,e=document.createElement("div");e.className="card t s"+sz;e.draggable=true;e.dataset.k=k;
  const v=D.data&&D.data[k],body=D.loading?'<div class="nodata">Yükleniyor…</div>':v==null?'<div class="nodata">Veri yok (bağlantıyı kontrol edin).</div>':R[k](v,sz);
  e.innerHTML='<h3>'+TITLE[k]+'</h3>'+body+'<div class="ctl"><button data-o="small">−</button><button data-o="big">+</button><button data-o="hide">✕</button></div>';
  e.querySelectorAll("[data-o]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();act({tile:k,op:b.dataset.o})});
  e.ondragstart=()=>{drag=k;e.classList.add("drag")};e.ondragend=()=>{e.classList.remove("drag");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))};
  e.ondragover=ev=>{ev.preventDefault();e.classList.add("over")};e.ondragleave=()=>e.classList.remove("over");
  e.ondrop=ev=>{ev.preventDefault();if(drag&&drag!==k){const a=L.order.indexOf(drag),b=L.order.indexOf(k);L.order.splice(a,1);L.order.splice(L.order.indexOf(k)+(a<b?1:0),0,drag);save();draw()}drag=null};
  $("grid").appendChild(e)}}
</script></body></html>
