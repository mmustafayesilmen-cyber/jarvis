<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060c"><title>Jarvis Tarayıcı</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'">
<link rel="stylesheet" href="/kit/modes.css">
<style>
html,body{height:100dvh}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
body.fs #bar1,body.fs #stat,body.fs #bar2{display:none}body.fs #fx{display:flex}
#fx{display:none;position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:30;gap:6px}#fx button{padding:8px 12px;background:rgba(0,0,0,.65)}
#bar1{display:flex;gap:6px;padding:8px;flex:none;align-items:center;background:linear-gradient(#0b2230,#06141d);border-bottom:1px solid var(--ln)}
#bar1 button{padding:9px 11px;font-size:15px;letter-spacing:0}
#u{flex:1;min-width:0;padding:10px 12px;font:15px "Segoe UI",system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.5);border:1px solid var(--ln);border-radius:10px;outline:0}#u:focus{border-color:var(--c)}
#view{flex:1;min-height:0;overflow:hidden;background:#000;position:relative}
#f{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-drag:none;object-fit:contain;background:#fff}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:rgba(216,246,251,.8);pointer-events:none;background:#02060c}#msg.hide{display:none}
#bar2{display:flex;gap:6px;padding:8px;flex:none;background:rgba(2,10,16,.95);border-top:1px solid var(--ln)}
#t{flex:1;min-width:0;padding:11px 12px;font:16px "Segoe UI",system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.5);border:1px solid var(--ln);border-radius:10px;outline:0}#t:focus{border-color:var(--c)}
#bar2 button{padding:0 12px}
#stat{font:11px Consolas,monospace;color:var(--mut);padding:0 10px 4px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="fx"><button id="fb">‹</button><button id="fu">ADRES</button><button id="fo">⛶ ÇIK</button></div>
<div id="bar1"><button id="bk">‹</button><button id="fw">›</button><button id="rl">⟳</button><input id="u" placeholder="Adres ya da arama" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="go" class="prim">GİT</button><button id="snd" title="Sesi telefonda çal">🔇</button><button id="fsb" title="Tam ekran">⛶</button><button id="cl" title="Tarayıcıyı kapat">✕</button></div>
<div id="view"><img id="f" alt=""><div id="msg">Tarayıcı açılıyor…</div></div>
<div id="stat"></div>
<input id="kbd" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none;font-size:16px">
<div id="bar2"><input id="t" placeholder="Sayfadaki kutuya yazılacak metin" enterkeyhint="send" autocomplete="off"><button id="ty">YAZ</button><button id="en">⏎</button><button id="bs">⌫</button><button id="pu">▲</button><button id="pd">▼</button><button id="mn">MENÜ</button></div>
<script>
const $=id=>document.getElementById(id);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
async function renew(){try{const r=await fetch("/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({d:ls("jv_rdev")})});const d=await r.json();if(d.ok){ls("jv_s",d.s);return true}}catch(e){}return false}
let ws,ready=false,wait=false,url="",last=0,frames=0,vpn=false,VH=760,lastBlob="";
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({...o,s:ls("jv_s")}))};
function ask(){if(!ready||wait||document.hidden)return;wait=true;send({type:"frame"});setTimeout(()=>{wait=false},6000)}
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?k=browser");ws.binaryType="blob";
 ws.onclose=()=>{ready=false;wait=false;$("msg").classList.remove("hide");$("msg").textContent="Bağlantı kesildi, yeniden bağlanılıyor…";setTimeout(()=>renew().then(ok=>ok?connect():location.href="/"),1500)};
 ws.onmessage=ev=>{if(typeof ev.data!=="string"){const u=URL.createObjectURL(ev.data);$("f").onload=()=>{if(lastBlob)URL.revokeObjectURL(lastBlob);lastBlob=u};$("f").src=u;$("msg").classList.add("hide");frames++;return}
  let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.type==="ready"){if(!m.ok){$("msg").textContent=m.msg||"Açılamadı";return}ready=true;vpn=m.vpn;sendSize();if(!url)send({type:"nav",url:"https://www.google.com/"});ask()}
  else if(m.type==="focus"){kbdMode(!!m.edit)}
  else if(m.type==="info"){wait=false;if(m.url!==undefined){url=m.url;if(m.vh)VH=m.vh;if(document.activeElement!==$("u"))$("u").value=m.url;$("stat").textContent=(m.title||"")+(vpn?"  ·  VPN":"")}setTimeout(ask,m.same?250:30)}
  else if(m.type==="msg"){$("stat").textContent=m.text;wait=false;ask()}
  else if(m.type==="auth"){renew().then(ok=>{if(!ok)location.href="/"})}}}
function nav(){const v=$("u").value.trim();if(v){send({type:"nav",url:v});$("u").blur()}}
$("go").onclick=nav;$("u").addEventListener("keydown",e=>{if(e.key==="Enter")nav()});$("u").addEventListener("focus",e=>e.target.select());
$("bk").onclick=()=>send({type:"back"});$("fw").onclick=()=>send({type:"forward"});$("rl").onclick=()=>send({type:"reload"});
$("cl").onclick=()=>{send({type:"close"});setTimeout(()=>location.href="/",300)};$("mn").onclick=()=>{location.href="/"};
$("ty").onclick=()=>{const v=$("t").value;if(v){send({type:"text",text:v});$("t").value=""}};$("t").addEventListener("keydown",e=>{if(e.key==="Enter"){$("ty").click();send({type:"key",key:"Enter"})}});
$("pu").onclick=()=>{scrollBy(0,-f.getBoundingClientRect().height*0.8);setTimeout(ask,300)};$("pd").onclick=()=>{scrollBy(0,f.getBoundingClientRect().height*0.8);setTimeout(ask,300)};
$("en").onclick=()=>send({type:"key",key:"Enter"});$("bs").onclick=()=>send({type:"key",key:"Backspace"});
const f=$("f");let p=null;
/* parmakla kaydırma: iki eksen, bırakınca ivmeli devam (fling); dokunup durdurulabilir */
let vx=0,vy=0,lt=0,fl=0;
const stopFling=()=>{cancelAnimationFrame(fl);fl=0};
function scrollBy(dx,dy){const r=f.getBoundingClientRect(),k=VH/r.height;send({type:"scroll",dy:dy*k,dx:dx*k})}
f.addEventListener("pointerdown",e=>{stopFling();p={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};vx=vy=0;lt=performance.now();f.setPointerCapture(e.pointerId)});
f.addEventListener("pointermove",e=>{if(!p)return;if(Math.abs(e.clientY-p.y)+Math.abs(e.clientX-p.x)>8)p.moved=true;
 if(p.moved){const dx=p.lx-e.clientX,dy=p.ly-e.clientY;if(Math.abs(dx)+Math.abs(dy)>=3){const n=performance.now(),dt=Math.max(8,n-lt);vx=dx/dt;vy=dy/dt;lt=n;scrollBy(dx,dy);p.lx=e.clientX;p.ly=e.clientY}}});
f.addEventListener("pointerup",e=>{if(p&&!p.moved){const r=f.getBoundingClientRect();send({type:"tap",x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});try{$("kbd").focus({preventScroll:true})}catch(_){}setTimeout(ask,250)}
 else if(p&&performance.now()-lt<90&&(Math.abs(vx)>.3||Math.abs(vy)>.3)){let t0=performance.now();const step=n=>{const dt=n-t0;t0=n;scrollBy(vx*dt,vy*dt);vx*=.94;vy*=.94;if(Math.abs(vx)>.03||Math.abs(vy)>.03)fl=requestAnimationFrame(step);else{fl=0;setTimeout(ask,200)}};fl=requestAnimationFrame(step)}
 else setTimeout(ask,200);p=null});
f.addEventListener("pointercancel",()=>{p=null});
f.addEventListener("wheel",e=>{e.preventDefault();send({type:"scroll",dy:e.deltaY})},{passive:false});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ask()});
let szT=0;function sendSize(){const r=$("view").getBoundingClientRect();if(r.width>100&&r.height>100)send({type:"size",w:Math.round(r.width),h:Math.round(r.height)})}
function resized(){clearTimeout(szT);szT=setTimeout(sendSize,250)}addEventListener("resize",resized);addEventListener("orientationchange",resized);
async function fsOn(){document.body.classList.add("fs");try{await document.documentElement.requestFullscreen()}catch(e){}resized()}
async function fsOff(){document.body.classList.remove("fs");try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}resized()}
$("fsb").onclick=fsOn;$("fo").onclick=fsOff;$("fb").onclick=()=>send({type:"back"});$("fu").onclick=()=>{fsOff().then(()=>$("u").focus())};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("fs");resized()});
let aw=null,ac=null,nextT=0,sndOn=false;
function sndStop(){sndOn=false;$("snd").textContent="🔇";$("snd").classList.remove("on");try{if(aw)aw.close()}catch(e){}try{if(ac)ac.close()}catch(e){}aw=ac=null}
function sndStart(){ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();nextT=0;aw=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws?k=audio");aw.binaryType="arraybuffer";
 aw.onopen=()=>aw.send(JSON.stringify({s:ls("jv_s")}));
 aw.onmessage=ev=>{if(typeof ev.data==="string"){let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.type==="ready"){sndOn=true;$("snd").textContent="🔊";$("snd").classList.add("on")}else if(m.type==="auth"||m.type==="msg"){$("stat").textContent=m.text||"Ses oturumu geçersiz";sndStop()}return}
  const i16=new Int16Array(ev.data),f=new Float32Array(i16.length);for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  const b=ac.createBuffer(1,f.length,22050);b.copyToChannel(f,0);const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);
  const now=ac.currentTime;if(nextT<now+0.05)nextT=now+0.18;else if(nextT>now+0.9)nextT=now+0.18;s.start(nextT);nextT+=b.duration};
 aw.onclose=()=>{if(sndOn)sndStop()}}
/* sayfadaki yazı kutusuna dokununca telefon klavyesi açılır; yazılanlar doğrudan sayfaya gider */
const kbd=$("kbd");let kprev="";
function kbdMode(on){if(on){kbd.inputMode="text";kbd.value="";kprev="";try{kbd.blur();kbd.focus({preventScroll:true})}catch(_){}}else{kbd.inputMode="none";try{kbd.blur()}catch(_){}}}
kbd.addEventListener("input",()=>{const v=kbd.value;let i=0;while(i<kprev.length&&i<v.length&&kprev[i]===v[i])i++;
 for(let k=kprev.length;k>i;k--)send({type:"key",key:"Backspace"});
 const add=v.slice(i);if(add)send({type:"text",text:add});kprev=v;if(v.length>200){kbd.value="";kprev=""}setTimeout(ask,250)});
kbd.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send({type:"key",key:"Enter"});kbd.value="";kprev="";setTimeout(ask,300)}
 else if(e.key==="Tab"){e.preventDefault();send({type:"key",key:"Tab"})}
 else if(e.key==="Backspace"&&kbd.value===""){send({type:"key",key:"Backspace"})}});
/* ses: ilk dokunuşta kendiliğinden açılır (tarayıcılar ses için dokunuş ister); 🔊 düğmesiyle kapatılabilir */
document.addEventListener("pointerdown",()=>{if(!aw&&!sndOn)sndStart()},{once:true});
$("snd").onclick=()=>{sndOn||aw?sndStop():sndStart()};
setInterval(()=>{if(aw&&aw.readyState===1)aw.send(JSON.stringify({s:ls("jv_s")}))},20000);
setInterval(renew,45000);renew().then(ok=>ok?connect():location.href="/");
</script></body></html>
