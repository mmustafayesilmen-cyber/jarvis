<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS MÜZİK KUTUSU</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#ffd36e;--c2:#e0a420;--ln:rgba(255,211,110,.25);--hi:rgba(255,211,110,.12);--card:rgba(32,22,4,.7)}
html,body{background:radial-gradient(ellipse at 50% -10%,#4a3408 0%,#0b0802 66%)}
#stage{display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:center}
#kb{position:relative;height:min(46vh,340px);width:min(94vw,1100px);user-select:none}
.k{position:absolute;bottom:0;border-radius:0 0 9px 9px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font:600 11px Consolas;padding-bottom:8px;transition:background .1s,transform .06s}
.w{background:linear-gradient(#f8f4ea,#d9d2bf);color:#6a5a2a;border:1px solid #8a7a4a;z-index:1}.b{background:linear-gradient(#2a2a2a,#050505);color:#bba96a;height:62%;z-index:2;border:1px solid #000}
.k.dn{background:linear-gradient(var(--c),var(--c2));color:#000;transform:translateY(3px)}
#nm{font:700 40px Bahnschrift;color:#fff;text-shadow:0 0 24px var(--c);min-height:50px}.ins{display:flex;gap:8px}
</style></head><body>
<div id="stage"><div id="nm">♪</div><div id="kb"></div><div class="ins" id="ins"></div><div class="mut" style="font:12px Consolas">Klavye: A S D F G H J K L (beyaz) · W E T Y U O (siyah)</div></div>
<script>
const NAMES=["do","do♯","re","re♯","mi","fa","fa♯","sol","sol♯","la","la♯","si"],BLK=[1,3,6,8,10],INS=["piyano","org","çan","synth","gitar"];let inst="piyano",ac=null;const keys={};
const KM="a s d f g h j k l ş i".split(" "),KB={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74};
function build(){const kb=$("kb");kb.innerHTML="";const whites=[];for(let m=60;m<=83;m++)if(!BLK.includes(m%12))whites.push(m);const w=100/whites.length;
 whites.forEach((m,i)=>{const e=document.createElement("div");e.className="k w";e.style.cssText=`left:${i*w}%;width:${w}%;height:100%`;e.textContent=NAMES[m%12];kb.appendChild(e);keys[m]=e;e.onpointerdown=()=>press(m)});
 for(let m=60;m<=83;m++)if(BLK.includes(m%12)){const wi=whites.indexOf(m-1),e=document.createElement("div");e.className="k b";e.style.cssText=`left:${(wi+1)*w-w*.3}%;width:${w*.6}%`;kb.appendChild(e);keys[m]=e;e.onpointerdown=()=>press(m)}}
function note(m,t,dur,ins){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const f=440*Math.pow(2,(m-69)/12),g=ac.createGain(),out=ac.destination;g.connect(out);const T=t||ac.currentTime;
 function osc(type,fr,vol,dec){const o=ac.createOscillator(),gg=ac.createGain();o.type=type;o.frequency.value=fr;o.connect(gg);gg.connect(g);gg.gain.value=vol;o.start(T);o.stop(T+dec+.05)}
 if(ins==="piyano"){osc("triangle",f,.5,1.4);osc("sine",f*2,.2,.8);osc("sine",f*3,.07,.4);g.gain.setValueAtTime(.001,T);g.gain.linearRampToValueAtTime(.9,T+.008);g.gain.exponentialRampToValueAtTime(.001,T+dur+1.2)}
 else if(ins==="org"){osc("sawtooth",f,.18,dur+.2);osc("square",f/2,.1,dur+.2);osc("sine",f*2,.15,dur+.2);g.gain.setValueAtTime(.001,T);g.gain.linearRampToValueAtTime(.7,T+.04);g.gain.setValueAtTime(.7,T+dur);g.gain.linearRampToValueAtTime(.001,T+dur+.15)}
 else if(ins==="çan"){[1,2.76,5.4,8.93].forEach((r,i)=>osc("sine",f*r,.4/(i+1),2.4));g.gain.setValueAtTime(.9,T);g.gain.exponentialRampToValueAtTime(.001,T+2.4)}
 else if(ins==="synth"){const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.setValueAtTime(3200,T);fl.frequency.exponentialRampToValueAtTime(500,T+dur+.3);fl.connect(g);const o=ac.createOscillator(),o2=ac.createOscillator();o.type="sawtooth";o2.type="sawtooth";o.frequency.value=f;o2.frequency.value=f*1.006;o.connect(fl);o2.connect(fl);o.start(T);o2.start(T);o.stop(T+dur+.4);o2.stop(T+dur+.4);g.gain.setValueAtTime(.3,T);g.gain.exponentialRampToValueAtTime(.001,T+dur+.35)}
 else{osc("triangle",f,.5,.9);osc("sawtooth",f,.12,.5);g.gain.setValueAtTime(.001,T);g.gain.linearRampToValueAtTime(.9,T+.004);g.gain.exponentialRampToValueAtTime(.001,T+.9)}
 const dly=Math.max(0,(T-ac.currentTime)*1000);setTimeout(()=>{const k=keys[m];if(k){k.classList.add("dn");setTimeout(()=>k.classList.remove("dn"),Math.max(160,dur*700))}$("nm").textContent=NAMES[m%12].toUpperCase()+(m>=72?"²":"")},dly)}
function press(m){note(m,null,.5,inst)}
function seq(a,step){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();a.forEach((m,i)=>note(m,ac.currentTime+.05+i*step,step*.9,inst))}
function chord(a){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();a.forEach(m=>note(m,ac.currentTime+.03,1.4,inst))}
function setInst(k){inst=k;$("ins").innerHTML=INS.map(x=>`<button class="${x===k?"cur":""}" data-i="${x}">${x.toUpperCase()}</button>`).join("");$("ins").querySelectorAll("button").forEach(b=>b.onclick=()=>{setInst(b.dataset.i);Mode.cmd("enstrümanı "+b.dataset.i+" yap")});Mode.pill(k.toUpperCase())}
Mode.start({kind:"nota",title:"MÜZİK KUTUSU",placeholder:"Komut: do re mi fa sol çal · do majör gam çal · la minör akor çal · enstrümanı org yap · şarkı çal",init:d=>{build();setInst(d.inst||"piyano")},
 act:d=>{if(d.inst)setInst(d.inst);if(d.seq)seq(d.seq,d.step||.3);if(d.chord)chord(d.chord)}});
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.repeat)return;const m=KB[e.key.toLowerCase()];if(m)press(m)});
</script></body></html>
