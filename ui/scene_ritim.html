<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS RİTİM STÜDYOSU</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#ff9d3c;--c2:#e5611d;--ln:rgba(255,157,60,.25);--hi:rgba(255,157,60,.12);--card:rgba(34,16,4,.7)}
html,body{background:radial-gradient(ellipse at 50% -10%,#4a2308 0%,#0b0502 66%)}
#stage{display:flex;flex-direction:column;gap:16px;justify-content:center}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row .nm{width:64px;font:600 12px Consolas;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.cell{width:calc((100% - 64px)/16 - 8px);aspect-ratio:1;max-height:54px;border-radius:10px;border:1px solid var(--ln);background:rgba(0,0,0,.35);cursor:pointer;transition:background .08s,box-shadow .08s}
.cell.g4{border-color:rgba(255,157,60,.5)}.cell.on{background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}.cell.now{outline:2px solid #fff;outline-offset:1px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ctl input[type=range]{width:200px;accent-color:var(--c)}#bp{font:700 34px Bahnschrift;color:#fff;width:90px;text-align:center}
</style></head><body>
<div id="stage"><div class="card"><div class="ctl"><button id="pl" class="prim" style="padding:12px 30px">▶ ÇAL</button><button id="rn">RASTGELE</button><button id="cl">TEMİZLE</button><span class="mut" style="margin-left:14px">TEMPO</span><input type="range" id="tp" min="50" max="200"><span id="bp">110</span><button id="sw">SWING</button></div></div>
 <div class="card" id="grid"></div><div class="card"><div class="ctl" id="pre"></div><div class="ctl" id="sv" style="margin-top:10px"></div></div></div>
<script>
const INS=["kick","snare","hat","clap","tom"];let S={bpm:110,steps:{},swing:0,play:false,saved:[],presets:[]},step=0,ac=null,nextT=0,timer=null,gl=[];
function mkGrid(){$("grid").innerHTML=INS.map(k=>`<div class="row"><span class="nm">${k}</span>${Array.from({length:16},(_,i)=>`<div class="cell ${i%4==0?"g4":""} ${(S.steps[k]||[])[i]?"on":""}" data-k="${k}" data-i="${i}"></div>`).join("")}</div>`).join("");
 $("grid").querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const k=c.dataset.k,i=+c.dataset.i;S.steps[k][i]=S.steps[k][i]?0:1;c.classList.toggle("on");Mode.send({type:"text",text:"§step|"+k+"|"+i+"|"+S.steps[k][i]})})}
function ui(){mkGrid();$("tp").value=S.bpm;$("bp").textContent=S.bpm;$("pl").textContent=S.play?"■ DURDUR":"▶ ÇAL";$("sw").className=S.swing?"cur":"";Mode.pill(S.bpm+" BPM");
 $("pre").innerHTML='<span class="mut">HAZIR RİTİMLER</span>'+S.presets.map(p=>`<button data-p="${p}">${p.toUpperCase()}</button>`).join("");$("pre").querySelectorAll("button").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.p+" ritmi"));
 $("sv").innerHTML='<span class="mut">KAYITLI</span>'+(S.saved.map(p=>`<button data-p="${Mode.esc(p)}">${Mode.esc(p)}</button>`).join("")||'<span class="mut">— ritmi kaydet adı</span>');$("sv").querySelectorAll("button").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.p+" ritmini yükle"))}
function hit(k,t){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
 function noise(d,hp){const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const gg=ac.createGain();s.connect(f);f.connect(gg);gg.connect(ac.destination);return[s,gg]}
 if(k==="kick"){o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.34)}
 else if(k==="tom"){o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.2);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3)}
 else{o.disconnect();const [s,gg]=noise(k==="hat"?.08:.2,k==="hat"?7000:k==="clap"?1200:1800);gg.gain.setValueAtTime(k==="hat"?.35:.6,t);gg.gain.exponentialRampToValueAtTime(.001,t+(k==="hat"?.06:.18));s.start(t);
  if(k==="snare"){o.type="triangle";o.frequency.value=190;o.connect(g);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.14)}}}
function tick(){while(nextT<ac.currentTime+.12){const i=step%16;INS.forEach(k=>{if((S.steps[k]||[])[i])hit(k,nextT)});const t=nextT,s=i;setTimeout(()=>mark(s),Math.max(0,(t-ac.currentTime)*1000));
  const d=60/S.bpm/4;nextT+=d*(i%2===0?1+S.swing:1-S.swing);step++}}
function mark(i){document.querySelectorAll(".cell.now").forEach(c=>c.classList.remove("now"));if(S.play)document.querySelectorAll('.cell[data-i="'+i+'"]').forEach(c=>c.classList.add("now"))}
function play(on){S.play=on;clearInterval(timer);$("pl").textContent=on?"■ DURDUR":"▶ ÇAL";if(on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();step=0;nextT=ac.currentTime+.06;timer=setInterval(tick,25)}else mark(-1)}
function take(d){if(d.snap){const wasPlay=S.play;S=d.snap;S.play=wasPlay;ui()}if(d.play===true)play(true);else if(d.play===false)play(false)}
Mode.start({kind:"ritim",title:"RİTİM STÜDYOSU",placeholder:"Komut: house ritmi · trap ritmi · tempo 120 · kick ekle 1 5 9 · snare çıkar 5 · rastgele ritim · ritmi kaydet gece · çal · durdur",init:d=>take({snap:d.snap}),act:take});
$("pl").onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();play(!S.play)};$("rn").onclick=()=>Mode.cmd("rastgele ritim");$("cl").onclick=()=>Mode.cmd("ritmi temizle");$("sw").onclick=()=>Mode.cmd("swing");
$("tp").oninput=()=>{S.bpm=+$("tp").value;$("bp").textContent=S.bpm;Mode.send({type:"text",text:"§bpm|"+S.bpm})};
</script></body></html>
