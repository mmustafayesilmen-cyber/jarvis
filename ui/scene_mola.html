<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS MOLA</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--c:#5ee08a;--ph:#5ee08a;--ph2:#1fb6a0;--txt:#d8f6fb;--mut:rgba(216,246,251,.55);--ln:rgba(94,224,138,.24);--card:rgba(6,26,22,.62);--hi:rgba(94,224,138,.12);--bad:#ff8a70}
body.pause{--ph:#8fb3c2;--ph2:#4a6a78;--c:#8fb3c2;--ln:rgba(143,179,194,.26);--hi:rgba(143,179,194,.12)}
body.done{--ph:#ffb454;--ph2:#ff7a45;--c:#ffb454;--ln:rgba(255,180,84,.28);--hi:rgba(255,180,84,.12)}
body.idle{--ph:#5ee08a;--ph2:#1fb6a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#02100c;color:var(--txt);font-family:"Segoe UI",Bahnschrift,sans-serif;user-select:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 60% at 50% 46%,color-mix(in srgb,var(--ph) 16%,transparent),transparent 70%),radial-gradient(ellipse at 50% -10%,#08362a 0%,transparent 60%);transition:background 1s}
#top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;z-index:5;background:linear-gradient(#000d,transparent)}
#logo{width:12px;height:12px;border-radius:50%;background:var(--ph);box-shadow:0 0 14px var(--ph),0 0 30px var(--ph);transition:background 1s}
#title{font:600 15px Bahnschrift,Consolas;letter-spacing:.42em;color:#fff}
#pill{font:600 11px Consolas;letter-spacing:.25em;padding:5px 12px;border:1px solid var(--ph);color:var(--ph);border-radius:20px;background:color-mix(in srgb,var(--ph) 10%,transparent);transition:all .6s}
#sp{flex:1}#clock{font:14px Consolas;color:var(--mut);letter-spacing:.1em}
button{font:600 12px Bahnschrift,Consolas;letter-spacing:.12em;padding:8px 14px;cursor:pointer;color:var(--c);border:1px solid var(--ln);background:rgba(0,14,10,.6);border-radius:10px;white-space:nowrap;transition:background .2s,border-color .2s,transform .1s}
button:hover{background:var(--hi);border-color:var(--c)}button:active{transform:scale(.97)}
#close{border-color:rgba(255,120,84,.55);color:var(--bad)}#close:hover{background:rgba(255,120,84,.12)}
#wrap{position:fixed;top:66px;bottom:92px;left:22px;right:22px;display:grid;grid-template-columns:minmax(300px,360px) 1fr minmax(300px,380px);gap:22px;z-index:2}
.col{display:flex;flex-direction:column;gap:18px;min-height:0;overflow:auto;padding:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card h3{margin:0 0 14px;font:600 11.5px Bahnschrift,Consolas;letter-spacing:.32em;color:var(--c)}
.card h3 small{margin-left:8px;font:11px Consolas;letter-spacing:.05em;color:var(--mut)}
#presets button.cur{background:var(--hi);border-color:var(--c);color:#fff}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.presets button{padding:14px 6px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;margin-top:14px}.row .lb{flex:1;font-size:14px}
.nv{width:70px;text-align:center;font:600 17px Bahnschrift,Consolas;color:#fff;background:rgba(0,0,0,.4);border:1px solid var(--ln);border-radius:9px;padding:6px 2px;outline:0;user-select:text;-moz-appearance:textfield}
.nv::-webkit-inner-spin-button,.nv::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.nv:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(94,224,138,.15)}
.step{display:flex;align-items:center;gap:6px}.step button{width:30px;height:30px;padding:0;border-radius:50%;font-size:16px;letter-spacing:0}
.unit{font:11px Consolas;color:var(--mut)}
.prim{background:linear-gradient(135deg,var(--c),var(--ph2));color:#021016;border:0}.prim:hover{filter:brightness(1.1)}
#center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0}
#ringw{position:relative;width:min(56vh,520px);aspect-ratio:1}
#ringw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:rgba(255,255,255,.06);stroke-width:12}
#arc{fill:none;stroke:url(#gr);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 12px var(--ph))}
#mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#phase{font:600 15px Bahnschrift,Consolas;letter-spacing:.5em;color:var(--ph);text-shadow:0 0 14px var(--ph);transition:color .8s}
#time{font:700 min(13vh,120px) Bahnschrift,Consolas;color:#fff;line-height:1;text-shadow:0 0 30px color-mix(in srgb,var(--ph) 60%,transparent);font-variant-numeric:tabular-nums}
#sub{font-size:14px;color:var(--mut);text-align:center;max-width:70%}
body.run #ringw{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
body.done #time{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
#ctl{display:flex;align-items:center;gap:18px}
#ctl .sec{height:48px;padding:0 20px;border-radius:24px}
#go{width:86px;height:86px;border-radius:50%;padding:0;display:grid;place-items:center;border:0;color:#021016;background:radial-gradient(circle at 35% 30%,#fff,var(--ph) 55%,var(--ph2));box-shadow:0 0 30px color-mix(in srgb,var(--ph) 55%,transparent),0 8px 24px rgba(0,0,0,.4)}
#go:hover{filter:brightness(1.08)}svg.ic{width:34px;height:34px;fill:currentColor}
#tip{min-height:84px;font-size:16px;line-height:1.5;color:#fff}#tipn{font:11px Consolas;letter-spacing:.2em;color:var(--mut);margin-top:10px}
#breath{margin:14px auto 0;width:92px;height:92px;border-radius:50%;border:2px solid var(--ph);box-shadow:0 0 24px color-mix(in srgb,var(--ph) 45%,transparent);display:grid;place-items:center;font:12px Consolas;letter-spacing:.15em;color:var(--ph);animation:br 10s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}40%,50%{transform:scale(1.12)}}
#bar{position:fixed;left:22px;right:22px;bottom:14px;z-index:9;display:flex;flex-direction:column;gap:6px}
#cmdw{display:flex;align-items:center;gap:10px;background:rgba(0,10,8,.75);border:1px solid var(--ln);border-radius:14px;padding:4px 6px 4px 14px;backdrop-filter:blur(8px)}
#cmdw:focus-within{border-color:var(--c)}#cmdw span{font:600 13px Consolas;color:var(--c)}
#cmd{flex:1;padding:9px 0;background:transparent;border:0;color:#fff;font:14px Consolas;outline:0;user-select:text}
#log{font:12.5px Consolas;color:#cfeeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;opacity:.85}
@media(max-width:1180px){#wrap{overflow:auto;display:flex;flex-direction:column}.col,#center{flex:none;overflow:visible}#ringw{width:min(70vw,420px)}#center{padding:10px 0}}
</style></head><body class="idle">
<canvas id="bg"></canvas><div id="glow"></div>
<div id="top"><span id="logo"></span><span id="title">MOLA</span><span id="pill">HAZIR</span><span id="sp"></span><span id="clock"></span><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>

<div id="wrap">
 <div class="col">
  <div class="card"><h3>HIZLI MOLA <small>dakika · tıklayınca başlar</small></h3>
   <div class="presets" id="presets"></div>
   <div class="row"><span class="lb">Başka süre</span><input class="nv" type="number" id="v_custom" min="1" max="180" step="1" value="10"><span class="unit">dk</span><button class="prim" id="b_custom">BAŞLAT</button></div>
  </div>
  <div class="card"><h3>VARSAYILAN SÜRE <small>"mola ver" deyince bu kadar sürer</small></h3>
   <div class="row" style="margin-top:0"><span class="lb">Mola süresi</span><span class="step"><button id="d_minus">−</button><input class="nv" type="number" id="v_def" min="1" max="180" step="1" value="10"><button id="d_plus">+</button></span><span class="unit">dk</span></div>
  </div>
 </div>
 <div id="center">
  <div id="ringw"><svg viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee08a"/><stop offset="1" stop-color="#1fb6a0"/></linearGradient></defs>
   <circle class="trk" cx="100" cy="100" r="88"/><circle id="arc" cx="100" cy="100" r="88" transform="rotate(-90 100 100)"/></svg>
   <div id="mid"><div id="phase">HAZIR</div><div id="time">10:00</div><div id="sub">Bir mola süresi seçin ya da başlat deyin.</div></div></div>
  <div id="ctl"><button class="sec" id="add5">+5 DK</button><button id="go" title="Başlat"><svg class="ic" viewBox="0 0 24 24" id="goi"></svg></button><button class="sec" id="end">BİTİR</button></div>
 </div>
 <div class="col">
  <div class="card"><h3>MOLADA YAPIN</h3><div id="tip"></div><div id="tipn"></div><div id="breath">NEFES</div></div>
 </div>
</div>
<div id="bar"><div id="cmdw"><span>›</span><input id="cmd" placeholder="Komut: başlat · on beş dakika · beş dakika ekle · duraklat · devam · ne kadar kaldı · mola süresi on dakika olsun · bitir" spellcheck="false" autocomplete="off"></div><div id="log">Jarvis: mola modu hazır.</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id),TOK=new URLSearchParams(location.search).get("t");
let ws,S=null,endAt=0;
const TIPS=["Bir bardak su için.","Ayağa kalkın, omuzlarınızı ve boynunuzu gevşetin.","Gözlerinizi ekrandan ayırıp 20 saniye uzaktaki bir noktaya bakın.","Kollarınızı yukarı uzatıp gerinin.","Pencereyi açıp biraz temiz hava alın.","Derin nefes alın: 4 saniye alın, 4 saniye tutun, 6 saniye verin.","Kısa bir yürüyüş yapın, odanın içinde bile olsa.","Telefonunuza bakmak yerine gözlerinizi kapatıp dinlenin."];
const ICON={play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',check:'<path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/>'};
const CIRC=2*Math.PI*88;$("arc").style.strokeDasharray=CIRC;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function cmd(t){send({type:"text",text:t});$("log").textContent="› komut uygulanıyor…"}
const mm=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function leftS(){if(!S||!S.on)return 0;return S.paused?S.left:Math.max(0,(endAt-Date.now())/1000)}
function render(s){S=s;endAt=s.on&&!s.paused?Date.now()+s.left*1000:0;
 $("v_def").value=S.default;if(document.activeElement!==$("v_custom"))$("v_custom").value=S.default;paint()}
function paint(){if(!S)return;const left=leftS(),fin=S.on&&!S.paused&&left<=0,run=S.on&&!S.paused&&!fin;
 document.body.className=!S.on?"idle":S.paused?"pause":fin?"done":"run";
 $("pill").textContent=!S.on?"HAZIR":S.paused?"DURAKLATILDI":fin?"MOLA BİTTİ":"MOLADA";
 $("phase").textContent=!S.on?"HAZIR":S.paused?"DURAKLATILDI":fin?"MOLA BİTTİ":"MOLA";
 $("time").textContent=S.on?mm(left):mm(S.default*60);
 const frac=S.on&&S.len?Math.max(0,Math.min(1,left/(S.len*60))):1;$("arc").style.strokeDashoffset=CIRC*(1-frac);
 $("sub").textContent=!S.on?"Bir mola süresi seçin ya da başlat deyin.":fin?"Hazır olduğunuzda BİTİR'e basın ya da +5 DK ile uzatın.":S.paused?"Devam etmek için düğmeye basın.":S.len+" dakikalık mola · bitince Jarvis haber verir";
 $("goi").innerHTML=fin?ICON.check:run?ICON.pause:ICON.play;$("go").title=fin?"Çalışmaya dön":run?"Duraklat":S.paused?"Devam":"Başlat";
 $("add5").style.visibility=S.on?"visible":"hidden";$("end").style.visibility=S.on?"visible":"hidden";
 document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("cur",S.on&&S.len===Number(b.dataset.m)))}
$("go").onclick=()=>{if(!S)return;const left=leftS();if(S.on&&!S.paused&&left<=0)cmd("bitir");else cmd(!S.on?"başlat":S.paused?"devam":"duraklat")};
$("add5").onclick=()=>cmd("5 dakika ekle");$("end").onclick=()=>cmd("bitir");
function mkPresets(list){const p=$("presets");p.innerHTML="";list.forEach(m=>{const b=document.createElement("button");b.dataset.m=m;b.textContent=m+" DK";b.onclick=()=>cmd(m+" dakika");p.appendChild(b)})}
mkPresets([5,10,15,20,30,45]);
function clampV(v,lo,hi){v=Math.round(Number(v));return isNaN(v)?null:Math.max(lo,Math.min(hi,v))}
function startCustom(){const v=clampV($("v_custom").value,1,180);if(v)cmd(v+" dakika")}
$("b_custom").onclick=startCustom;
function setDef(v){v=clampV(v,1,180);if(v)cmd(`mola süresi ${v} dakika olsun`)}
$("d_minus").onclick=()=>setDef((S?S.default:10)-5<1?1:(S?S.default:10)-5);$("d_plus").onclick=()=>setDef((S?S.default:10)+5);
for(const [id,fn] of [["v_custom",startCustom],["v_def",()=>setDef($("v_def").value)]]){const e=$(id);
 e.addEventListener("keydown",ev=>{ev.stopPropagation();if(ev.key==="Enter"){fn();e.blur()}else if(ev.key==="Escape")e.blur()})}
function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>send({type:"scene_ready",kind:"mola"});
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.kind!=="mola")return;
  if(m.type==="scene_init"&&m.data)render(m.data);
  else if(m.type==="scene_do"){const d=m.do||{};if(d.snap)render(d.snap);if(d.msg)$("log").textContent="Jarvis: "+d.msg}};
 ws.onclose=()=>setTimeout(connect,1500)}
function shut(){send({type:"scene_close"})}
$("close").onclick=shut;$("peek").onclick=()=>send({type:"mode_peek"});
$("cmd").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&e.target.value.trim()){cmd(e.target.value.trim());e.target.value=""}else if(e.key==="Escape")shut()});
addEventListener("keydown",e=>{if(e.key==="Escape"){const a=document.activeElement;if(a&&a.tagName==="INPUT"){a.blur();return}shut()}});
let tipI=Math.floor(Math.random()*TIPS.length);function tip(){$("tip").textContent=TIPS[tipI%TIPS.length];$("tipn").textContent=`ÖNERİ ${tipI%TIPS.length+1}/${TIPS.length}`;tipI++}
tip();setInterval(tip,18000);
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("tr-TR");paint()},500);
(()=>{const c=$("bg"),x=c.getContext("2d");let W,H;const P=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);
 for(let i=0;i<60;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,v:Math.random()*.00022+.00006,a:Math.random()*.5+.15});
 (function f(){x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.body).getPropertyValue("--ph")||"#5ee08a";
  for(const p of P){p.y-=p.v;if(p.y<-.02){p.y=1.02;p.x=Math.random()}x.globalAlpha=p.a*(.5+.5*Math.sin(performance.now()/1500+p.x*20));x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,6.283);x.fill()}
  x.globalAlpha=1;requestAnimationFrame(f)})()})();
connect();window.focus();
</script></body></html>
