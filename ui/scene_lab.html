<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS LAB</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
:root{--c:#7fe0ff;--bg:#030a12;--ln:rgba(127,224,255,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#cfeeff;font-family:"Segoe UI",Bahnschrift,Consolas,sans-serif;user-select:none}
body.bio{--c:#8dffb0;--bg:#02100a;--ln:rgba(141,255,176,.22)}
#top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:5;background:linear-gradient(#000c,transparent);border-bottom:1px solid var(--ln)}
#title{font:600 13px Bahnschrift,Consolas;letter-spacing:.16em;color:var(--c);white-space:nowrap;flex:none}
#tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}#tabs button{padding:6px 9px;letter-spacing:.04em;font-size:12px;flex:none}@media(max-width:1250px){#title{font-size:11px;letter-spacing:.06em}#kit-dock .kit-b:not(#kit-priv){padding:0 4px}}#top>button,#top>#kit-dock{flex:none}
button{font:12.5px Consolas;letter-spacing:.1em;padding:7px 12px;cursor:pointer;color:var(--c);border:1px solid var(--ln);background:rgba(0,12,20,.7);white-space:nowrap}
button:hover{background:rgba(127,224,255,.16)}button.on{background:rgba(127,224,255,.28);border-color:var(--c)}
body.bio button:hover{background:rgba(141,255,176,.16)}body.bio button.on{background:rgba(141,255,176,.28)}
#close{border-color:rgba(255,180,84,.7);color:#ffb454}
#main{position:fixed;top:50px;bottom:46px;left:0;right:0;display:flex}
#list{width:230px;overflow:auto;border-right:1px solid var(--ln);padding:6px;background:rgba(0,0,0,.35);scrollbar-width:thin}
#list div{padding:5px 8px;font:13px/1.35 "Segoe UI";cursor:pointer;color:#bfe9fa;border-left:3px solid transparent}
#list div:hover{background:rgba(127,224,255,.12)}#list div.act{background:rgba(127,224,255,.2);border-left-color:var(--c);color:#fff}
#list small{display:block;opacity:.6;font-size:11px}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%}
#ptable{position:absolute;inset:0;padding:8px;display:none;overflow:hidden}
#grid{display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,1fr) 14px repeat(2,1fr);gap:2px;height:calc(100% - 38px)}
.el{border:1px solid rgba(255,255,255,.12);cursor:pointer;padding:1px 2px;overflow:hidden;line-height:1.05;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.el b{font:600 clamp(11px,1.5vw,19px) Bahnschrift,Consolas}.el i{font:normal clamp(7px,.8vw,10px) Consolas;opacity:.75}.el span{font:clamp(6px,.65vw,9px) "Segoe UI";opacity:.7;white-space:nowrap}
.el:hover,.el.sel{outline:2px solid #fff;z-index:2;transform:scale(1.12)}
.alk{background:#7a3a2a}.ear{background:#7a5a22}.trn{background:#2a5a7a}.pst{background:#3d5a6a}.mtl{background:#2f6a52}.nmt{background:#2f7a3a}.hal{background:#6a6a2a}.nbl{background:#5a3a7a}.lan{background:#6a2a5a}.act{background:#7a2a42}.unk{background:#3a3a3a}

#ct{margin:0 0 4px;font:600 17px Bahnschrift,Consolas;letter-spacing:.12em;color:var(--c)}
#cb{font:13.5px/1.55 "Segoe UI";color:#dff4ff;user-select:text}
#cb h4{margin:10px 0 3px;font:600 12px Consolas;letter-spacing:.25em;color:var(--c);opacity:.9}
#cb ul,#cb ol{margin:2px 0 4px 18px;padding:0}#cb li{margin:2px 0}
#cb .warn{border-left:3px solid #ffb454;background:rgba(255,180,84,.09);padding:5px 9px;margin-top:6px;color:#ffd9a3}
#cb .k{opacity:.65}
#cb li.hl{color:#fff;background:rgba(127,224,255,.16)}
#bar{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--ln);background:rgba(0,0,0,.6);z-index:5}
#cmd{flex:1;padding:8px 12px;background:rgba(0,10,18,.85);border:1px solid var(--ln);color:var(--c);font:14px Consolas;outline:0;user-select:text}
#cmd:focus{border-color:var(--c)}#hint{font:11.5px Consolas;opacity:.55;white-space:nowrap}
@media(max-width:1000px){#list{width:160px}#card{width:300px}#hint{display:none}}
/* ---- görsel cila */
button{border-radius:7px;transition:background .18s,border-color .18s,color .18s,transform .12s}button:active{transform:scale(.96)}
#tabs button{position:relative;border-radius:7px 7px 0 0;border-bottom-color:transparent}
#tabs button.on{color:#fff;box-shadow:inset 0 -2px 0 var(--c),0 6px 18px -8px var(--c)}
#list{scrollbar-color:var(--ln) transparent}#list div{border-radius:0 7px 7px 0;margin:1px 0;transition:background .16s,padding-left .16s,color .16s}
#list div:hover{padding-left:12px}#list div.act{box-shadow:inset 0 0 22px -10px var(--c)}
#card{scrollbar-color:var(--ln) transparent;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%),rgba(0,0,0,.4)}
#ct{animation:cardIn .35s both}#cb>*{animation:cardIn .4s both}#cb>*:nth-child(2){animation-delay:.04s}#cb>*:nth-child(3){animation-delay:.08s}#cb>*:nth-child(4){animation-delay:.12s}#cb>*:nth-child(n+5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(7px)}}
#cb h4{display:flex;align-items:center;gap:8px}#cb h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
#cb li{transition:background .3s,color .3s,padding .3s;border-radius:5px}#cb li.hl{padding:2px 7px;box-shadow:inset 2px 0 0 var(--c)}
#cb .warn{border-radius:0 8px 8px 0}
#mini{border-radius:10px}
.el{border-radius:4px;transition:transform .14s,opacity .25s,box-shadow .14s,filter .14s;background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,0) 45%,rgba(0,0,0,.28));animation:elIn .5s both}
.el:hover,.el.sel{outline:2px solid #fff;z-index:2;transform:scale(1.16);box-shadow:0 0 18px rgba(255,255,255,.45);filter:brightness(1.25)}
.el.sel{animation:elIn .5s both,elSel 1.8s ease-in-out infinite}
@keyframes elIn{from{opacity:0;transform:scale(.6)}}@keyframes elSel{50%{box-shadow:0 0 26px rgba(255,255,255,.75)}}
#legend span{border-radius:10px;transition:transform .12s,filter .12s}#legend span:hover{transform:translateY(-1px);filter:brightness(1.3)}
#chips button{border-radius:16px;backdrop-filter:blur(6px)}
#cmd{border-radius:8px;transition:border-color .2s,box-shadow .2s}#cmd:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
</style></head><body>
<div id="top"><span id="title">LAB</span><div id="tabs"></div><button id="peek" title="Masaüstüne geç (Ctrl+Alt+M)">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="main"><div id="list"></div>
 <div id="stage"><canvas id="cv"></canvas><div id="ptable"><div id="legend"></div><div id="grid"></div></div><div id="chips"></div></div>

<div id="bar"><input id="cmd" placeholder="Komut yazın ya da söyleyin… (örn: demir, su molekülü, lahana deneyi, H2 + O2 -> H2O denkleştir)" spellcheck="false" autocomplete="off"><span id="hint">Esc = çık</span></div>
<script>
"use strict";

const cv=$("cv"),ctx=cv.getContext("2d"),mini=$("mini"),mctx=mini.getContext("2d");let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);const r=$("stage").getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR}addEventListener("resize",resize);
const TAU=Math.PI*2,R=Math.random;
let D=null,tab=null,S={},T0=performance.now(),tt=0;
const TABS=BIO?[["cell","HÜCRE"],["sys","SİSTEM"],["exp","DENEY"],["gen","GENETİK"],["cls","SINIFLANDIRMA"],["info","KAVRAM"]]:[["table","PERİYODİK TABLO"],["mol","MOLEKÜL"],["exp","DENEY"],["ph","pH"],["calc","HESAP"],["info","KAVRAM"],["safe","GÜVENLİK"]];

// ------------------------------------------------------------------ iletişim
let ws;function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function state(o){S=Object.assign(S,o);send({type:"scene_state",kind:KIND,state:o})}
function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>send({type:"scene_ready",kind:KIND});
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.kind!==KIND)return;
  if(m.type==="scene_init"){D=m.data;buildTabs();setTab(TABS[0][0])}
  else if(m.type==="scene_do"&&D)handleDo(m.do||{})};
 ws.onclose=()=>setTimeout(connect,1500)}
function handleDo(d){if(d.tab&&d.tab!==tab)setTab(d.tab);
 if(d.el)selEl(d.el,true);if(d.mol!==undefined)selMol(d.mol,true);if(d.exp)selExp(d.exp,true);if(d.ph!==undefined)selPh(d.ph,d.name);
 if(d.cell)setCell(d.cell,true);if(d.org)selOrg(d.org,true);if(d.sys)selSys(d.sys,true);if(d.punnett){S.punnett=d.punnett;S.dna=null;gen()}if(d.dna){S.dna=d.dna;S.punnett=null;gen()}
 if(d.result)showResult(d.result);if(d.fact)showFact(d.fact);
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab))}
// ------------------------------------------------------------------ sekmeler ve listeler
function buildTabs(){const el=$("tabs");el.innerHTML="";TABS.forEach(([k,n])=>{const b=document.createElement("button");b.dataset.k=k;b.textContent=n;b.onclick=()=>setTab(k);el.appendChild(b)})}
function setList(items,onClick,sel){const l=$("list");l.style.display=items?"block":"none";l.innerHTML="";if(items)items.forEach((it,i)=>{const d=document.createElement("div");d.innerHTML=esc(it[0])+(it[1]?`<small>${esc(it[1])}</small>`:"");d.dataset.i=i;d.onclick=()=>onClick(i);if(i===sel)d.classList.add("act");l.appendChild(d)});setTimeout(resize,0)}
function markList(i){document.querySelectorAll("#list div").forEach(d=>d.classList.toggle("act",+d.dataset.i===i));const a=document.querySelector("#list div.act");if(a)a.scrollIntoView({block:"nearest"})}
function card(title,html,mini_){$("ct").textContent=title;$("cb").innerHTML=html;mini.style.display=mini_?"block":"none"}
function setTab(k){tab=k;T0=performance.now();document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));$("ptable").style.display="none";$("chips").innerHTML="";cv.style.display="block";resize();
 ({table:tabTable,mol:tabMol,exp:tabExp,ph:tabPh,calc:tabCalc,safe:tabSafe,cell:tabCell,sys:tabSys,gen:tabGen,cls:tabCls,info:tabInfo}[k])()}
function showResult(r){if(!r)return;card(r.title,"<ul>"+r.lines.map(l=>`<li>${esc(l)}</li>`).join("")+"</ul>",false);S.result=r;if(r.concept&&tab==="info"&&D.concepts){const i=D.concepts.findIndex(c=>c.title===r.concept);if(i>=0)markList(i)}}
function showFact(f){card("İlginç bilgi",`<p>${esc(f)}</p>`,false);S.fact=f}
// ================================================================== KİMYA
function tabTable(){setList(null);cv.style.display="none";const pt=$("ptable");pt.style.display="block";const g=$("grid");if(!g.children.length){
  for(const e of D.elements){const d=document.createElement("div");d.className="el "+e.cat;d.style.gridRow=e.row>8?e.row:e.row;d.style.gridColumn=e.col;d.dataset.z=e.z;d.innerHTML=`<i>${e.z}</i><b>${e.sym}</b><span>${e.name}</span>`;d.onclick=()=>selEl(e.z);g.appendChild(d)}
  const lg=$("legend");const names={alk:"Alkali metal",ear:"Toprak alkali",trn:"Geçiş metali",pst:"Zayıf metal",mtl:"Yarı metal",nmt:"Ametal",hal:"Halojen",nbl:"Soy gaz",lan:"Lantanit",act:"Aktinit",unk:"Bilinmiyor"};
  for(const k in names){const s=document.createElement("span");s.className=k;s.textContent=names[k];s.onclick=()=>{document.querySelectorAll(".el").forEach(x=>x.style.opacity=x.classList.contains(k)?1:.22)};lg.appendChild(s)}
  lg.onmouseleave=()=>document.querySelectorAll(".el").forEach(x=>x.style.opacity=1)}
 selEl(S.z||26)}
function selEl(z,fromSrv){S.z=z;const e=D.elements[z-1];document.querySelectorAll(".el").forEach(x=>x.classList.toggle("sel",+x.dataset.z===z));state({z});
 card(`${e.name} (${e.sym})`,`<p class="k">Atom numarası ${e.z} · kütle ${e.mass} · ${esc(e.catname)} · oda sıcaklığında ${esc(e.phase)}</p><p>${esc(e.fact)}</p><h4>ELEKTRON DAĞILIMI</h4><p>${esc(e.config)}</p><p class="k">Kabuklar (K, L, M…): ${e.shells.join(", ")}</p>`,true)}
const CPK={H:"#f2f2f2",C:"#8a8a8a",N:"#3050f8",O:"#ff2a1a",S:"#e8d020",Cl:"#1fd01f",Na:"#ab5cf2",F:"#90e050",P:"#ff8000"};
function tabMol(){setList(D.molecules.map(m=>[m.name,m.formula]),selMol,S.mol||0);selMol(S.mol||0)}
function selMol(i,fromSrv){S.mol=i;markList(i);state({mol:i});const m=D.molecules[i];card(`${m.name} · ${m.formula}`,`<p class="k">Geometri: ${esc(m.geom)} · ${m.polar?"polar":"apolar"} · ${m.atoms.length} atom</p><p>${esc(m.desc)}</p><p class="k">Fareyle sürükleyerek modeli çevirebilirsiniz.</p>`,false)}
function drawMol(t){const m=D.molecules[S.mol||0];backdrop();const ay=t*.7+(S.dx||0),ax=.35+(S.dy||0),sc=Math.min(W,H)/ (m.atoms.length>6?7.5:5.6);
 glow(W/2,H/2,Math.min(W,H)*.46,[90,190,255],.12);ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(W/2,H*.86,Math.min(W,H)*.24,Math.min(W,H)*.03,0,0,TAU);ctx.fill();const P=m.atoms.map(([s,x,y,z])=>{let X=x*Math.cos(ay)+z*Math.sin(ay),Z=-x*Math.sin(ay)+z*Math.cos(ay),Y=y*Math.cos(ax)-Z*Math.sin(ax);Z=y*Math.sin(ax)+Z*Math.cos(ax);return[W/2+X*sc,H/2+Y*sc,Z,s]});
 const items=[];m.bonds.forEach(([a,b,o])=>items.push({z:(P[a][2]+P[b][2])/2,bond:[a,b,o]}));P.forEach((p,i)=>items.push({z:p[2],atom:p,i}));items.sort((a,b)=>a.z-b.z);
 for(const it of items){if(it.bond){const[a,b,o]=it.bond,A=P[a],B=P[b],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*6,ny=dx/L*6;const bw=Math.max(5,sc*.085),dp=.72+.28*Math.max(-1,Math.min(1,(A[2]+B[2])/3));ctx.lineCap="round";const offs=o===1?[0]:o===2?[-.5,.5]:[-1,0,1];for(const f of offs){const q=nx/6*bw*1.25*f,w2=ny/6*bw*1.25*f;ctx.strokeStyle=`rgba(${70*dp|0},${84*dp|0},${96*dp|0},1)`;ctx.lineWidth=bw;ctx.beginPath();ctx.moveTo(A[0]+q,A[1]+w2);ctx.lineTo(B[0]+q,B[1]+w2);ctx.stroke();ctx.strokeStyle=`rgba(${205*dp|0},${220*dp|0},${232*dp|0},1)`;ctx.lineWidth=bw*.5;ctx.beginPath();ctx.moveTo(A[0]+q-nx/6*bw*.14,A[1]+w2-ny/6*bw*.14);ctx.lineTo(B[0]+q-nx/6*bw*.14,B[1]+w2-ny/6*bw*.14);ctx.stroke()}}
  else{const[x,y,z,s]=it.atom,r=(s==="H"?.42:s==="Na"||s==="Cl"?.8:.62)*sc*.5*(1+z*.04),g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r),c=hex(CPK[s]||"#d070ff");const dp=.78+.22*Math.max(-1,Math.min(1,z/1.5));g.addColorStop(0,rgb(mix(c,[255,255,255],.7)));g.addColorStop(.45,rgb(mix(c,[0,0,0],1-dp)));g.addColorStop(1,rgb(mix(c,[0,0,0],.72)));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();const rim=ctx.createRadialGradient(x,y,r*.72,x,y,r);rim.addColorStop(0,"rgba(120,200,255,0)");rim.addColorStop(1,"rgba(150,215,255,.22)");ctx.fillStyle=rim;ctx.fill();ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.ellipse(x-r*.38,y-r*.42,r*.2,r*.12,-.7,0,TAU);ctx.fill();ctx.fillStyle=s==="H"||s==="S"||s==="F"?"rgba(0,0,0,.6)":"rgba(255,255,255,.85)";ctx.font=`600 ${Math.max(11,r*.6)}px Bahnschrift,Consolas`;ctx.textAlign="center";ctx.fillText(s,x,y+r*.22)}}
 ctx.save();ctx.shadowColor="rgba(127,224,255,.8)";ctx.shadowBlur=18;ctx.fillStyle="rgba(200,240,255,.95)";ctx.font="600 30px Bahnschrift,Consolas";ctx.textAlign="left";ctx.fillText(m.formula,24,H-26);ctx.restore()}
function tabExp(){const arr=D.experiments;setList(arr.map(e=>[e.name,`${e.level}${e.mins?" · "+e.mins+" dk":""}`]),i=>selExp(arr[i].key),Math.max(0,arr.findIndex(e=>e.key===(S.exp||arr[0].key))));selExp(S.exp||arr[0].key)}
function selExp(k,fromSrv){const arr=D.experiments,i=arr.findIndex(e=>e.key===k);if(i<0)return;const e=arr[i];S.exp=k;S.expT=performance.now();state({exp:k});markList(i);
 card(e.name,`<p class="k">${esc(e.level)} seviye${e.mins?" · yaklaşık "+e.mins+" dakika":""}</p><p>${esc(e.aim)}</p><h4>MALZEMELER</h4><ul>${e.mats.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h4>ADIMLAR</h4><ol id="steps">${e.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><h4>NE GÖZLENİR</h4><p>${esc(e.observe)}</p><h4>NEDEN?</h4><p>${esc(e.why)}</p><div class="warn"><b>Güvenlik:</b> ${esc(e.safety)}</div>`,false)}
function tabPh(){setList(D.ph.map(p=>[p.name,"pH "+p.ph]),i=>selPh(D.ph[i].ph,D.ph[i].name),-1);selPh(S.ph===undefined?7:S.ph,S.phName)}
function selPh(v,name){S.ph=v;S.phName=name;const i=D.ph.findIndex(p=>p.name===name);markList(i);const near=D.ph.reduce((a,b)=>Math.abs(b.ph-v)<Math.abs(a.ph-v)?b:a);const kind=v<6.9?"asidik":v>7.1?"bazik":"nötr";
 card("pH "+(+v).toFixed(1),`<p>Ortam <b>${kind}</b>. Hidrojen iyonu derişimi yaklaşık ${Math.pow(10,-v).toExponential(1)} mol/L, pOH ${(14-v).toFixed(1)}.</p><p class="k">En yakın madde: ${esc(near.name)} (pH ${near.ph}) — ${esc(near.desc)}</p>`,false)}
function phColor(v){const st=[[0,[220,20,40]],[3,[245,110,40]],[5,[250,200,40]],[7,[60,170,70]],[9,[40,150,160]],[11,[70,90,200]],[14,[120,50,170]]];for(let i=1;i<st.length;i++)if(v<=st[i][0]){const a=st[i-1],b=st[i];return mix(a[1],b[1],(v-a[0])/(b[0]-a[0]))}return st[st.length-1][1]}

 yeast(t){const cx=W/2;glass(cx-50,H*.45,100,H*.35,.6,"rgba(220,190,120,.6)");bubs(cx-50,H*.45,100,H*.35,t*1.6,22);const r=Math.min(110,16+t*10);balloonShape(cx,H*.45-r-8,r,[110,170,255],t);label("maya şekeri → alkol + CO2 (balon şişer)",cx,H*.9)},
 celery(t){const cx=W/2,h=H*.62,y=H*.12,k=Math.min(1,t/8);ctx.fillStyle="#9fd070";ctx.fillRect(cx-26,y,52,h);for(let i=-2;i<=2;i++){ctx.strokeStyle="rgba(60,100,40,.5)";ctx.beginPath();ctx.moveTo(cx+i*9,y);ctx.lineTo(cx+i*9,y+h);ctx.stroke();ctx.strokeStyle="rgba(230,60,80,.9)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+i*9,y+h);ctx.lineTo(cx+i*9,y+h-h*k*(.7+.3*Math.abs(i)/2));ctx.stroke()}glass(cx-70,y+h,140,H*.14,.8,"rgba(230,60,80,.55)");ctx.fillStyle="rgba(190,255,210,.9)";ctx.beginPath();ctx.arc(cx+W*.2,H*.5,36,0,TAU);ctx.fillStyle="#9fd070";ctx.fill();for(let i=0;i<6;i++){const a=i/6*TAU;ctx.fillStyle="rgba(230,60,80,"+k+")";ctx.beginPath();ctx.arc(cx+W*.2+Math.cos(a)*20,H*.5+Math.sin(a)*20,5,0,TAU);ctx.fill()}label("kesit: renkli noktalar taşıma boruları",cx+W*.2,H*.5+60);label("su ksilemde yukarı çıkar",cx,H*.92)},
 germ(t){const cx=W/2,gy=H*.6,d=Math.min(1,t/12);ctx.fillStyle="#6a4a2a";ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle="#caa56a";ctx.beginPath();ctx.ellipse(cx,gy+30,18,11,0,0,TAU);ctx.fill();ctx.strokeStyle="#e8e0c0";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,gy+36);ctx.lineTo(cx-8*d,gy+36+Math.min(1,d*2)*90);ctx.stroke();ctx.strokeStyle="#6ad060";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(cx,gy+20);ctx.quadraticCurveTo(cx+10,gy-60*Math.max(0,d-.2),cx,gy-170*Math.max(0,d-.2));ctx.stroke();if(d>.6){ctx.fillStyle="#4cc040";ctx.beginPath();ctx.ellipse(cx-26,gy-170*(d-.2)+10,24,10,-.5,0,TAU);ctx.ellipse(cx+26,gy-170*(d-.2)+10,24,10,.5,0,TAU);ctx.fill()}ctx.fillStyle="rgba(190,255,210,.9)";ctx.font="13px Consolas";ctx.textAlign="center";ctx.fillText("gün "+(1+Math.floor(d*7)),cx,H*.12);label("önce kök, sonra gövde ve yapraklar",cx,H*.92)},
 photo(t){const cx=W/2,gy=H*.72,d=Math.min(1,t/8),bend=d*.9;ctx.fillStyle="#6a4a2a";ctx.fillRect(cx-60,gy,120,H*.14);ctx.fillStyle="#ffe070";ctx.beginPath();ctx.arc(W*.9,H*.2,22,0,TAU);ctx.fill();for(let i=0;i<8;i++){const a=i/8*TAU;ctx.strokeStyle="#ffe070";ctx.beginPath();ctx.moveTo(W*.9+Math.cos(a)*30,H*.2+Math.sin(a)*30);ctx.lineTo(W*.9+Math.cos(a)*44,H*.2+Math.sin(a)*44);ctx.stroke()}ctx.strokeStyle="#4cc040";ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(cx,gy);ctx.quadraticCurveTo(cx,gy-120,cx+Math.sin(bend)*120,gy-210+bend*30);ctx.stroke();ctx.fillStyle="#3aa030";ctx.beginPath();ctx.ellipse(cx+Math.sin(bend)*120,gy-215+bend*30,26,12,bend,0,TAU);ctx.fill();label("bitki ışığa doğru bükülür (oksin hormonu)",cx,H*.92)},
 egg(t){const cx=W/2;[[-1,"Saf su",1.25],[1,"Şurup",.8]].forEach(([s,n,f])=>{const x=cx+s*130,k=Math.min(1,t/6),sc=1+(f-1)*k;glass(x-60,H*.3,120,H*.42,.75,s<0?"rgba(160,205,255,.3)":"rgba(230,170,60,.5)",n);ctx.fillStyle="#f0e8d0";ctx.beginPath();ctx.ellipse(x,H*.55,22*sc,30*sc,0,0,TAU);ctx.fill();ctx.fillStyle="#fff8e8";ctx.beginPath();ctx.arc(x,H*.55,9*sc,0,TAU);ctx.fill()});label("kabuksuz yumurta: zar seçici geçirgendir",cx,H*.88)},
 photosyn(t){const cx=W/2,ph=Math.floor(t/6)%2,rate=ph?.5:2.2;glass(cx-80,H*.3,160,H*.45,.8,"rgba(120,190,255,.3)");ctx.strokeStyle="#4cc040";ctx.lineWidth=5;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(cx-30+i*15,H*.7);ctx.quadraticCurveTo(cx-30+i*15+Math.sin(t+i)*6,H*.5,cx-30+i*15,H*.36)}ctx.stroke();bubs(cx-60,H*.3,120,H*.4,t*rate,16,"rgba(220,255,255,.8)");const lx=ph?cx+W*.34:cx+W*.15;ctx.fillStyle="#ffe070";ctx.beginPath();ctx.arc(lx,H*.25,18,0,TAU);ctx.fill();label(ph?"lamba uzak: az kabarcık":"lamba yakın: çok kabarcık",cx,H*.88)},
 enzyme(t){const cx=W/2,k=Math.min(1,t/8);[[-1,"Taze kivi",1],[1,"Konserve kivi",0]].forEach(([s,n,a])=>{const x=cx+s*140;ctx.fillStyle="rgba(255,190,90,.6)";ctx.fillRect(x-60,H*.45,120,H*.2);if(a){ctx.fillStyle="rgba(255,200,110,.9)";ctx.beginPath();ctx.ellipse(x,H*.45+H*.2,60,H*.1*k+4,0,0,TAU);ctx.fill()}ctx.fillStyle="#7ac040";ctx.beginPath();ctx.arc(x,H*.43,26,0,TAU);ctx.fill();ctx.fillStyle="#d8f0a0";ctx.beginPath();ctx.arc(x,H*.43,12,0,TAU);ctx.fill();ctx.fillStyle="#cfe";ctx.font="12px Segoe UI";ctx.textAlign="center";ctx.fillText(n,x,H*.75)});label("taze meyvedeki proteaz jelatini (proteini) sulandırır",cx,H*.9)},
 ruler(t){const cx=W/2,ph=t%4,drop=Math.max(0,Math.min(1,(ph-1)/.6)),catch_=ph>1.25;const rh=H*.55,ry=H*.12+(catch_?Math.min(1,(ph-1)/.25)*H*.15:drop*H*.2);ctx.fillStyle="#f0d070";ctx.fillRect(cx-12,ry,24,rh);ctx.fillStyle="#222";ctx.font="10px Consolas";for(let i=0;i<=30;i+=2){ctx.fillRect(cx-12,ry+i*(rh/30),i%10===0?14:8,1);if(i%10===0)ctx.fillText(i,cx+4,ry+i*(rh/30)+10)}ctx.fillStyle="#f0b090";ctx.fillRect(cx-40,H*.12+H*.22-(catch_?0:0),28,14);ctx.fillRect(cx+12,H*.12+H*.22,28,14);label(ph<1?"cetvel bırakılmak üzere":catch_?"yakaladı: düşme mesafesi ≈ 20 cm → ≈ 0,2 sn":"düşüyor…",cx,H*.92)},
 heart(t){SY.heart(t,W/2,H*.5,Math.min(W,H)/420)},
 bubbles(t){const cx=W/2;glass(cx-80,H*.25,160,H*.5,.7,"rgba(140,220,170,.3)");bubs(cx-80,H*.25,160,H*.5,t,18);label("deney animasyonu için kartı okuyun",cx,H*.88)}
};
BE.chroma=AE.chroma;
// ---- genetik: DNA sarmalı + Punnett
function drawGen(t){backdrop();const p=S.punnett;if(p){const g1=p.gametes1,g2=p.gametes2,n=g1.length,m=g2.length,cs=Math.min(90,(W*.7)/(m+1),(H*.7)/(n+1)),x0=W/2-(m+1)*cs/2,y0=H/2-(n+1)*cs/2;ctx.font=`${cs*.28}px Consolas`;ctx.textAlign="center";ctx.fillStyle="#8dffb0";g2.forEach((g,j)=>ctx.fillText(g,x0+(j+1.5)*cs,y0+cs*.6));g1.forEach((g,i)=>ctx.fillText(g,x0+cs*.5,y0+(i+1.5)*cs+cs*.1));for(let i=0;i<n;i++)for(let j=0;j<m;j++){const gt=p.grid[i][j],dom=gt[0]===gt[0].toUpperCase()?1:0;ctx.fillStyle=dom?"rgba(60,180,100,.35)":"rgba(220,120,60,.35)";ctx.fillRect(x0+(j+1)*cs+2,y0+(i+1)*cs+2,cs-4,cs-4);ctx.fillStyle="#fff";ctx.fillText(gt,x0+(j+1.5)*cs,y0+(i+1.5)*cs+cs*.1)}label(`${p.p1} × ${p.p2}`,W/2,y0-14);return}
 const N=26,x0=W*.1,x1=W*.9,cy=H/2,amp=H*.16;glow(W/2,cy,W*.42,[90,255,160],.09);const pairs=["AT","TA","GC","CG","AT","GC","CG","TA","GC","AT"];const col={A:"#ff6a6a",T:"#ffd36a",G:"#6ad6ff",C:"#b08aff"};
 for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N,a=i*.45+t*1.2,y1=cy+Math.sin(a)*amp,y2=cy-Math.sin(a)*amp,d=Math.cos(a),pr=pairs[i%pairs.length];if(i%2===0){const gr=ctx.createLinearGradient(x,y1,x,y2);gr.addColorStop(0,col[pr[0]]);gr.addColorStop(.5,col[pr[0]]);gr.addColorStop(.5,col[pr[1]]);gr.addColorStop(1,col[pr[1]]);ctx.strokeStyle=gr;ctx.lineWidth=5;ctx.globalAlpha=.55+.4*Math.abs(d);ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="11px Consolas";ctx.textAlign="center";ctx.fillText(pr[0],x,y1-10*Math.sign(Math.sin(a)||1));ctx.fillText(pr[1],x,y2+14*Math.sign(Math.sin(a)||1))}
  for(const[yy,f]of[[y1,d>0],[y2,d<=0]]){const r=f?9:6.5,sg=ctx.createRadialGradient(x-r*.35,yy-r*.35,r*.1,x,yy,r);sg.addColorStop(0,f?"#eafff0":"#9adcb4");sg.addColorStop(.55,f?"#6fe89a":"#3a9a60");sg.addColorStop(1,f?"#1f7a44":"#134a2a");ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x,yy,r,0,TAU);ctx.fill()}}
 label("A–T ve G–C eşleşir · çift sarmal",W/2,H*.9)}
function drawCls(t){backdrop();const c=D.classif,n=c.levels.length,h=Math.min(48,(H*.7)/n),cx=W/2,base=H*.82;for(let i=0;i<n;i++){const w=(W*.55)*(1-i/(n+1)),y=base-(i+1)*h,k=.5+.5*Math.sin(t*2-i*.5);ctx.fillStyle=`rgba(${40+i*18},${150-i*8},${110+i*12},${.55+.25*k})`;ctx.fillRect(cx-w/2,y,w,h-3);ctx.fillStyle="#fff";ctx.font="13px Consolas";ctx.textAlign="center";ctx.fillText(`${c.levels[i]}: ${c.human[i]}`,cx,y+h/2+4)}label("insanın sınıflandırması (tür → üst alem)",cx,H*.92)}
function drawInfo(t){backdrop();for(let i=0;i<30;i++){const a=i*2.4+t*.1,r=H*.3*((i*.37)%1)+30;ctx.strokeStyle="rgba(141,255,176,.2)";ctx.beginPath();ctx.arc(W/2+Math.cos(a)*r*1.4,H/2+Math.sin(a)*r,12+(i%5)*5,0,TAU);ctx.stroke()}if(S.fact){wrap(S.fact,W/2,H*.4,Math.min(W*.7,640),24)}}
function wrap(txt,x,y,mw,lh){ctx.fillStyle="#dfffe8";ctx.font="19px Segoe UI";ctx.textAlign="center";const words=txt.split(" ");let line="",yy=y;for(const w of words){const test=line+w+" ";if(ctx.measureText(test).width>mw){ctx.fillText(line,x,yy);line=w+" ";yy+=lh}else line=test}ctx.fillText(line,x,yy)}
// ---- ana döngü
function frame(ts){tt=(ts-T0)/1000;if(!W||Math.abs(cv.width-W*DPR)>2)resize();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 if(D&&tab){try{
  if(!BIO){if(tab==="mol")drawMol(tt);else if(tab==="exp")drawExp((performance.now()-(S.expT||T0))/1000);else if(tab==="ph")drawPh(tt);else if(tab==="calc"||tab==="safe"||tab==="info")drawIdleChem(tt);if(tab==="table")drawBohr(tt)}
  else{if(tab==="cell")drawCell(tt);else if(tab==="sys")drawSys(tt);else if(tab==="exp")drawExp((performance.now()-(S.expT||T0))/1000);else if(tab==="gen")drawGen(tt);else if(tab==="cls")drawCls(tt);else if(tab==="info")drawInfo(tt)}}catch(e){ctx.fillStyle="#f88";ctx.fillText("çizim hatası: "+e.message,20,40)}}
 requestAnimationFrame(frame)}
$("close").onclick=()=>send({type:"scene_close"});$("peek").onclick=()=>send({type:"mode_peek"});
$("cmd").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&e.target.value.trim()){send({type:"text",text:e.target.value.trim()});e.target.value=""}else if(e.key==="Escape")send({type:"scene_close"})});
addEventListener("keydown",e=>{if(e.key==="Escape")send({type:"scene_close"})});
setTimeout(resize,50);requestAnimationFrame(frame);connect();window.focus();
