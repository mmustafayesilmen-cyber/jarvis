<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS HOLOGRAFİK DÜNYA</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' ws://127.0.0.1:8765 https://server.arcgisonline.com"><link rel="stylesheet" href="/kit/modes.css"><link rel="stylesheet" href="/kit/stark.css"><script src="/kit/modes.js"></script>
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css"><script src="/vendor/maplibre/maplibre-gl-csp.js"></script>
<style>
:root{--c:#3fe8ff;--ln:rgba(63,232,255,.28);--hi:rgba(63,232,255,.12);--card:rgba(3,16,26,.8)}
#dw{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(260px,340px);gap:14px}
@media (max-width:820px){#dw{grid-template-columns:1fr;grid-template-rows:minmax(240px,45%) 1fr}}
#mapw{position:relative;border:1px solid var(--ln);border-radius:18px;overflow:hidden;min-height:200px;background:#02080e}
#map{position:absolute;inset:0;filter:hue-rotate(155deg) saturate(.55) brightness(.8) contrast(1.15)}
#mapw::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(63,232,255,.05) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(2,10,18,.7) 100%);box-shadow:inset 0 0 60px rgba(63,232,255,.18)}
#mmsg{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:none;padding:10px 12px;background:rgba(2,10,18,.85);border:1px solid var(--bad);border-radius:10px;color:var(--bad);font-size:13px}
.mk{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 14px var(--c),0 0 28px var(--c);cursor:pointer}.mk.sel{background:var(--gold);box-shadow:0 0 16px var(--gold),0 0 32px var(--gold)}
#side{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.pl{width:100%;text-align:left;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:rgba(0,0,0,.25);color:var(--txt);font:inherit;letter-spacing:0;cursor:pointer}.pl.cur{border-color:var(--c);background:var(--hi)}.pl b{display:block;color:#fff;font-size:14px}.pl span{font-size:12px;color:var(--mut)}
.f{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.5)!important;font-size:10.5px}.maplibregl-ctrl-attrib a{color:rgba(226,247,251,.8)!important}
</style></head><body>
<div id="stage"><div class="hd"><h1>Holografik Dünya</h1><span class="sub" id="cnt"></span><span class="sp"></span>
 <form id="af" style="display:flex;gap:6px;flex-wrap:wrap;max-width:100%"><input class="tx" id="q" aria-label="Yer ara ve kaydet" placeholder="Yer adı (örn. Paris)" maxlength="80" style="width:220px;flex:1;min-width:130px"><button class="prim" type="submit">ARA VE KAYDET</button></form></div>
<div id="dw"><div id="mapw"><div id="map"></div><div id="mmsg" role="alert"></div></div><div id="side"></div></div></div>
<script>
const E=Mode.esc,P=s=>String(s).replace(/\|/g," ");let V={places:[],weather:{}},sel=null,map=null,mks={},cf=null,pick=null,busy=false;
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
function mmsg(t){const m=$("mmsg");m.style.display=t?"block":"none";m.textContent=t||""}
function initMap(){if(map||!window.maplibregl)return mmsg(window.maplibregl?"":"Harita kütüphanesi yüklenemedi; kayıtlı yerler yine de listede.");
 maplibregl.setWorkerUrl("/vendor/maplibre/maplibre-gl-csp-worker.js");
 map=new maplibregl.Map({container:"map",center:[30,35],zoom:1.6,attributionControl:{compact:true},style:{version:8,sources:{sat:{type:"raster",tiles:[ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19,attribution:"Uydu: Esri, Maxar, Earthstar Geographics"}},layers:[{id:"sat",type:"raster",source:"sat"}]}});
 map.on("error",e=>{const m=String(e&&e.error&&e.error.message||"");if(/Failed to fetch|NetworkError|status 0/.test(m))mmsg("Harita döşemeleri alınamıyor: internet bağlantısı yok ya da harita sunucusuna ulaşılamıyor. Kayıtlı yerleriniz listede duruyor.")});
 let okm=false;map.on("load",()=>{okm=true;mmsg("")});map.on("idle",()=>{okm=true});setTimeout(()=>{if(!okm)mmsg("Harita döşemeleri henüz yüklenemedi: bağlantı yavaş ya da yok olabilir. Kayıtlı yerleriniz listede duruyor.")},9000);
 map.on("click",e=>{pick={lat:e.lngLat.lat,lon:e.lngLat.lng};side()});
 [200,900].forEach(ms=>setTimeout(()=>map&&map.resize(),ms));addEventListener("resize",()=>map&&map.resize())}
function markers(){if(!map)return;Object.values(mks).forEach(m=>m.remove());mks={};
 V.places.forEach(p=>{const el=document.createElement("div");el.className="mk"+(p.id===sel?" sel":"");el.title=p.name;el.setAttribute("role","button");el.tabIndex=0;el.setAttribute("aria-label",p.name);
  const go=()=>Mode.cmd("§sec|"+p.id);el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go()};
  mks[p.id]=new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(map)})}
function wx(p){const w=V.weather[p.id];if(!w)return'<div class="tc">Hava bilgisi için yeri seçin.</div>';if(!w.ok)return`<div class="err">${E(w.err)}</div>`;const v=w.v;
 return`<div style="font:300 30px Bahnschrift;color:#fff">${v.temp}° <small style="font-size:14px;color:var(--mut)">${E(v.d)} · rüzgâr ${v.wind} km/sa</small></div>`+v.days.map(x=>`<div class="row"><span>${E(x.date.slice(5))} ${E(x.d)}</span><b>${x.lo}° / ${x.hi}° · %${x.pp}</b></div>`).join("")+`<div class="src">Kaynak: ${E(v.src)} · ${new Date(w.at*1000).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</div>`}
function side(){$("cnt").textContent=V.places.length?V.places.length+" kayıtlı yer":"";const p=V.places.find(x=>x.id===sel);
 let h=`<div class="card"><h3>KAYITLI YERLER</h3>`+(V.places.length?V.places.map(x=>`<button class="pl ${x.id===sel?"cur":""}" data-o="${x.id}"><b>${E(x.name)}</b><span>${x.plan?"plan: "+E(x.plan)+" · ":""}${x.lat}, ${x.lon}</span></button>`).join('<div style="height:6px"></div>'):'<div class="empty">Henüz kayıtlı yer yok.<br><span class="tc">Haritada yalnızca kaydettiğiniz yerler görünür. Yukarıdan yer arayın ya da haritaya tıklayıp koordinatı adlandırın.</span></div>')+`</div>`;
 if(pick)h=`<div class="card"><h3>HARİTADAN YER EKLE</h3><div class="tc">${pick.lat.toFixed(4)}, ${pick.lon.toFixed(4)}</div><form id="pf" class="f"><input class="tx" id="pn" aria-label="Yer adı" placeholder="Yer adı" maxlength="60" required><div class="a" style="display:flex;gap:6px"><button class="prim sm" type="submit">KAYDET</button><button class="sm" type="button" data-x="1">VAZGEÇ</button></div></form></div>`+h;
 if(p)h=`<div class="card"><h3>${E(p.name)}</h3><div class="tc">${E(p.full||"")}</div><div class="tc">${p.lat}, ${p.lon}</div>${wx(p)}
  <form id="ef" class="f"><input class="tx" id="en" value="${E(p.name)}" aria-label="Ad" maxlength="60"><textarea class="tx" id="eo" aria-label="Seyahat notu" placeholder="Seyahat notu / plan" maxlength="400">${E(p.note||"")}</textarea><label class="tc" for="ep">Plan tarihi (isteğe bağlı)</label><input class="tx" type="date" id="ep" value="${E(p.plan||"")}"><div class="a" style="display:flex;gap:6px;flex-wrap:wrap"><button class="prim sm" type="submit">KAYDET</button>${cf===p.id?`<span class="err">Kaldırılsın mı?</span><button class="sm" data-yo="${p.id}" type="button">EVET</button><button class="sm" data-x="1" type="button">VAZGEÇ</button>`:`<button class="sm" data-ys="${p.id}" type="button">KALDIR</button>`}</div></form></div>`+h;
 $("side").innerHTML=h}
function render(v){V=v;if(v.sel!==undefined&&v.sel!==null){sel=v.sel;const p=v.places.find(x=>x.id===sel);if(p&&map)map.flyTo({center:[p.lon,p.lat],zoom:Math.max(map.getZoom(),5),duration:1200})}
 busy=false;initMap();markers();side()}
Mode.start({kind:"dunya",title:"HOLOGRAFİK DÜNYA",placeholder:"Komut: yer ekle: Paris · kayıtlı yerlerim · Paris hava nasıl",init:d=>render(d),act:d=>{if(d.err){mmsg("");$("log").textContent="Jarvis: "+d.err}if(d.data){render(d.data)}if(d.weather){Object.assign(V.weather,d.weather);side()}}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.o)return Mode.cmd("§sec|"+b.dataset.o);
 if(b.dataset.ys){cf=b.dataset.ys*1;return side()}
 if(b.dataset.yo){cf=null;return Mode.cmd("§yso|"+b.dataset.yo)}
 if(b.dataset.x){cf=null;pick=null;return side()}});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
 if(id==="af"){const q=$("q").value.trim();if(q){Mode.cmd("yer ekle: "+q);$("q").value=""}}
 else if(id==="pf"&&pick){Mode.cmd(`§y|${P($("pn").value)}|${pick.lat}|${pick.lon}`);pick=null}
 else if(id==="ef"&&sel)Mode.cmd(`§yd|${sel}|${P($("en").value)}|${P($("eo").value)}|${$("ep").value}`)});
</script></body></html>
