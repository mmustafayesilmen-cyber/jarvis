function setSpeed(v){if(v)lastScale=v;timeScale=v;$("spd").textContent=v?"×"+(v>=10?v.toFixed(0):v.toFixed(2)):"DURDU";$("play").textContent=v?"❚❚":"▶";$("play").classList.toggle("on",!v)}

$("close").onclick=()=>send({type:"scene_close"});$("peek").onclick=()=>send({type:"mode_peek"});$("orb").onclick=()=>{showOrb=!showOrb;$("orb").classList.toggle("on",showOrb)};$("lab").onclick=()=>{showLab=!showLab;$("lab").classList.toggle("on",showLab)};
$("fast").onclick=()=>setSpeed(Math.min(40,(timeScale||lastScale/2)*2));$("slow").onclick=()=>setSpeed(Math.max(.05,(timeScale||lastScale*2)/2));$("play").onclick=()=>setSpeed(timeScale?0:lastScale||1);
// ---- elle gezinme: tıkla, ok tuşları, tekerlek
function stepFocus(d){const i=ORDER.indexOf(focus);show(ORDER[((i<0?(d>0?-1:0):i)+d+ORDER.length)%ORDER.length])}
$("pnext").onclick=()=>stepFocus(1);$("pprev").onclick=()=>stepFocus(-1);
function pick(e){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;for(const h of hits){const d=Math.hypot(mx-h.x,my-h.y);if(d<=h.r+10&&d-h.r<bd){bd=d-h.r;best=h}}return best}
cv.addEventListener("click",e=>{const h=pick(e);if(h)show(h.k)});
cv.addEventListener("dblclick",e=>{if(!pick(e))show("overview")});
cv.addEventListener("mousemove",e=>{cv.style.cursor=pick(e)?"pointer":"default"});
cv.addEventListener("wheel",e=>{e.preventDefault();camT.z=clamp(camT.z*(e.deltaY<0?1.12:1/1.12),.35,40)},{passive:false});
addEventListener("keydown",e=>{if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="Escape")send({type:"scene_close"});else if(e.key==="ArrowRight")stepFocus(1);else if(e.key==="ArrowLeft")stepFocus(-1);else if(e.key==="Home")show("overview");
  else if(e.key==="+"||e.key==="=")camT.z=Math.min(40,camT.z*1.2);else if(e.key==="-")camT.z=Math.max(.35,camT.z/1.2);else if(e.key===" "){e.preventDefault();setSpeed(timeScale?0:lastScale||1)}});
addEventListener("resize",resize);buildChips();resize();setSpeed(1);requestAnimationFrame(frame);connect();window.focus();
</script></body></html>
