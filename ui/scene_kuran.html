<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS KUR'AN-I KERİM</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/scene_kit.css"><script src="/kit/scene_kit.js"></script>
<style>
/* Mushaf görünümü sade tutulur: metne efekt, animasyon ya da süs uygulanmaz. Metin yalnızca textContent ile yazılır (değiştirilmez). */
@font-face{font-family:"Amiri Quran";src:url("/fonts/AmiriQuran.ttf") format("truetype");font-display:block}
:root{--paper:#fbf6e8;--paper2:#f5edd8;--ink:#1d1a14;--gold:#a8853f;--gold2:#c9a75e;--green:#1f5a4a;--mut:#6b6254;--ui:#e2f7fb;--uimut:rgba(226,247,251,.6);--ln:rgba(201,167,94,.35);--sz:34px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141210;color:var(--ui);font-family:"Segoe UI",sans-serif;user-select:none}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:5;background:#0e0c0a;border-bottom:1px solid var(--ln)}
#title{font:600 14px "Segoe UI";letter-spacing:.3em;color:var(--gold2);margin-right:6px;white-space:nowrap}
select,input.n{background:#1d1a16;color:#f4ead2;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;font:13px "Segoe UI";outline:0}
input.n{width:58px;text-align:center}
button{font:600 12px "Segoe UI";letter-spacing:.06em;padding:7px 12px;cursor:pointer;color:#f0dfb4;border:1px solid var(--ln);background:#1d1a16;border-radius:8px;white-space:nowrap}
button:hover{background:#2a251e;border-color:var(--gold2)}button.on{background:#3a3022;border-color:var(--gold2);color:#fff}
.grp{display:flex;gap:4px;align-items:center}.sep{width:1px;height:24px;background:var(--ln);margin:0 4px}
#sp{flex:1}
.lis{color:#fff;border-color:var(--gold2);background:linear-gradient(#3a3022,#2a2318)}
#close{border-color:rgba(255,120,84,.5);color:#ff9a7a}
#tools{position:fixed;top:56px;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:5;background:#0e0c0a;border-bottom:1px solid var(--ln);overflow-x:auto}
#spread{position:fixed;top:114px;bottom:70px;left:16px;right:16px;display:flex;gap:18px;justify-content:center}
.pg{flex:1;max-width:820px;background:var(--paper);color:var(--ink);border-radius:6px;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.pg .fr{position:absolute;inset:10px;border:1.5px solid var(--gold);border-radius:3px;pointer-events:none}.pg .fr::after{content:"";position:absolute;inset:4px;border:1px solid var(--gold2);border-radius:2px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:20px 30px 6px;font-size:13px;color:var(--mut)}
.pb{flex:1;overflow:auto;padding:6px 34px 10px}
.pf{text-align:center;padding:4px 0 18px;font-size:13px;color:var(--mut)}
/* Arapça sayfa */
#ar .ph{direction:rtl}#ar .ph b{font-family:"Amiri Quran";font-size:20px;font-weight:400;color:var(--ink)}
.q{direction:rtl;text-align:justify;text-align-last:center;font-family:"Amiri Quran","Times New Roman",serif;font-size:var(--sz);line-height:2.75;margin:0;padding:4px 0;word-spacing:.08em}
.ay{cursor:pointer;border-radius:6px}.ay:hover{background:rgba(201,167,94,.12)}.ay.sel{background:rgba(31,90,74,.12);box-shadow:0 0 0 1px rgba(31,90,74,.35)}
.ae{display:inline-block;min-width:1.55em;height:1.55em;line-height:1.5em;text-align:center;font-family:"Amiri Quran","Times New Roman",serif;font-size:.56em;color:var(--green);border:1.5px solid var(--gold);border-radius:50%;margin:0 .15em;vertical-align:middle;background:radial-gradient(circle,#fffaf0,var(--paper2))}
.sh{margin:14px auto 6px;max-width:92%;border:1.5px solid var(--gold);border-radius:4px;padding:8px 12px 7px;margin-top:22px;text-align:center;background:linear-gradient(var(--paper2),var(--paper));position:relative}
.sh::before,.sh::after{content:"";position:absolute;top:50%;width:14px;height:14px;border:1.5px solid var(--gold);transform:translateY(-50%) rotate(45deg);background:var(--paper)}.sh::before{left:-8px}.sh::after{right:-8px}
.sh .an{font-family:"Amiri Quran","Times New Roman",serif;font-size:calc(var(--sz)*.9);direction:rtl;line-height:2.1;padding:4px 0 2px}
.sh .tn{font-size:12px;color:var(--mut);letter-spacing:.04em}
.bs{text-align:center;direction:rtl;font-family:"Amiri Quran","Times New Roman",serif;font-size:calc(var(--sz)*.95);line-height:2.5;margin:6px 0 8px}
/* meal sayfası */
#tr .pb{font:17px/1.75 "Segoe UI",sans-serif}
.me{padding:6px 8px;border-radius:6px;cursor:pointer;margin:2px 0}.me:hover{background:rgba(201,167,94,.12)}.me.sel{background:rgba(31,90,74,.1);box-shadow:0 0 0 1px rgba(31,90,74,.3)}
.me b{color:var(--green);font-weight:700;margin-right:6px;white-space:nowrap}
.me i{display:block;font-size:12.5px;color:var(--mut);font-style:normal;margin-top:2px}
.mh{margin:12px 0 4px;font:700 15px "Segoe UI";color:var(--green);border-bottom:1px solid var(--gold2);padding-bottom:3px}
body.v-ar #tr,body.v-tr #ar{display:none}body.v-ar #ar,body.v-tr #tr{max-width:1100px}
#marks{display:none;position:fixed;top:104px;right:16px;z-index:8;background:#1d1a16;border:1px solid var(--ln);border-radius:10px;padding:8px;min-width:240px;max-height:60vh;overflow:auto}#marks.on{display:block}
#marks div{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}#marks div:hover{background:#2a251e}#marks small{color:var(--uimut)}
#src{position:fixed;left:16px;right:16px;bottom:52px;text-align:center;font-size:11px;color:rgba(240,223,180,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:fixed;left:16px;right:16px;bottom:8px;z-index:9;display:flex;gap:10px;align-items:center}
#cmdw{flex:1;display:flex;align-items:center;gap:10px;background:#0e0c0a;border:1px solid var(--ln);border-radius:12px;padding:3px 6px 3px 12px}#cmdw span{color:var(--gold2);font:600 13px Consolas}
#cmd{flex:1;padding:8px 0;background:transparent;border:0;color:#fff;font:13.5px Consolas;outline:0;user-select:text}
#log{max-width:40%;font:12.5px Consolas;color:#f0dfb4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kit-cap-slot{display:none}   /* Kur’an sayfasında metnin üstüne altyazı binmez; Jarvis’in cevabı alttaki satırda görünür */
</style></head><body class="v-both">
<div id="top"><span id="title">KUR'AN-I KERİM</span><span id="sp"></span>
 <button id="peek" title="Masaüstüne geç">MASAÜSTÜ</button><button id="close">KAPAT · ESC</button></div>
<div id="tools">
 <select id="sura" title="Sure"></select>
 <div class="grp"><button id="next" title="Sonraki sayfa (←)">‹</button><input class="n" id="pgn" title="Sayfa (1-604)"><button id="prev" title="Önceki sayfa (→)">›</button></div>
 <select id="juz" title="Cüz"></select>
 <span class="sep"></span>
 <div class="grp" id="vw"><button data-v="both">ARAPÇA + MEAL</button><button data-v="ar">ARAPÇA</button><button data-v="tr">MEAL</button></div>
 <div class="grp"><button id="sm" title="Yazıyı küçült">A−</button><button id="bg" title="Yazıyı büyüt">A+</button></div>
 <button id="mk" title="Kaldığım yeri işaretle">🔖 İŞARETLE</button><button id="mkl" title="Yer işaretlerim">▾</button>
 <span style="flex:1"></span>
 <button class="lis" id="lm" title="Açık yerin Türkçe mealini YouTube Music'te aç">▶ MEALİ DİNLE</button><button class="lis" id="la" title="Açık yerin Arapça tilavetini YouTube Music'te aç">▶ ARAPÇASINI DİNLE</button>
</div>
<div id="marks"></div>
<div id="spread">
 <div class="pg" id="tr"><div class="fr"></div><div class="ph"><span id="trh"></span><span id="trj"></span></div><div class="pb" id="trb"></div><div class="pf" id="trf"></div></div>
 <div class="pg" id="ar"><div class="fr"></div><div class="ph"><b id="arh"></b><span id="arj"></span></div><div class="pb" id="arb"></div><div class="pf" id="arf"></div></div>
</div>
<div id="kit-cap-slot"></div>
<div id="src"></div>
<div id="bar"><div id="cmdw"><span>›</span><input id="cmd" placeholder="Komut: Yasin suresi · Bakara 255. ayet · sayfa 50 · cüz 30 · sonraki sayfa · meali dinle · Arapçasını dinle · işaretle · çık" spellcheck="false" autocomplete="off"></div><div id="log"></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),TOK=new URLSearchParams(location.search).get("t");
let ws,V=null;
const AD=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function cmd(t){send({type:"text",text:t});$("log").textContent="› komut uygulanıyor…"}
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const isSel=(s,a)=>V&&V.sel&&V.sel[0]===s&&V.sel[1]===a;
function select(s,a){send({type:"kuran_sel",s,a});if(V){V.sel=[s,a];paint()}}
function paint(){document.querySelectorAll("[data-s]").forEach(e=>{const s=+e.dataset.s,a0=+e.dataset.a,a1=+(e.dataset.b||e.dataset.a);e.classList.toggle("sel",!!(V.sel&&V.sel[0]===s&&V.sel[1]>=a0&&V.sel[1]<=a1))})}
function render(v){V=v;document.body.className="v-"+v.view;document.documentElement.style.setProperty("--sz",v.size+"px");
 // üst çubuk
 const S=$("sura");if(!S.options.length){v.suras.forEach(s=>{const o=document.createElement("option");o.value=s.n;o.textContent=`${s.n}. ${s.tr} (${s.ayahs})`;S.appendChild(o)});
  const J=$("juz");for(let i=1;i<=30;i++){const o=document.createElement("option");o.value=i;o.textContent=i+". cüz";J.appendChild(o)}}
 S.value=v.sura;$("juz").value=v.juz;if(document.activeElement!==$("pgn"))$("pgn").value=v.page;
 document.querySelectorAll("#vw button").forEach(b=>b.classList.toggle("on",b.dataset.v===v.view));
 $("next").disabled=v.page>=604;$("prev").disabled=v.page<=1;
 // Arapça sayfa (metin olduğu gibi; yalnızca textContent)
 $("arh").textContent=v.suraAr;$("arj").textContent=AD(v.juz)+" الجزء";$("arf").textContent=AD(v.page);
 const B=$("arb");B.innerHTML="";let p=null;
 for(const it of v.items){
  if(it.head){p=null;const h=el("div","sh");h.appendChild(el("div","an",it.ar));h.appendChild(el("div","tn",`${it.tr} Sûresi · ${it.ayahs} âyet · ${it.type}`));B.appendChild(h);
   if(it.basmala)B.appendChild(el("p","bs",it.basmala));continue}
  if(!p){p=el("p","q");B.appendChild(p)}
  const sp=el("span","ay",it.ar);sp.dataset.s=it.s;sp.dataset.a=it.a;sp.title=`${it.s}:${it.a}`;sp.onclick=()=>select(it.s,it.a);p.appendChild(sp);
  p.appendChild(document.createTextNode(" "));const e=el("span","ae",AD(it.a));e.dataset.s=it.s;e.dataset.a=it.a;e.onclick=()=>select(it.s,it.a);p.appendChild(e);p.appendChild(document.createTextNode(" "))}
 // meal sayfası
 $("trh").textContent=`${v.suraName} Sûresi`;$("trj").textContent=`${v.juz}. cüz`;$("trf").textContent=`${v.page}. sayfa · ${v.range}`;
 const T=$("trb");T.innerHTML="";
 for(const m of v.meal){if(m.head)T.appendChild(el("div","mh",`${m.head} Sûresi`));
  const d=el("div","me");d.dataset.s=m.s;d.dataset.a=m.a0;d.dataset.b=m.a1;
  d.appendChild(el("b",null,m.a0===m.a1?`${m.a0}.`:`${m.a0}–${m.a1}.`));d.appendChild(document.createTextNode(m.tr));
  if(m.a0!==m.a1)d.appendChild(el("i",null,`Diyanet mealinde ${m.a0}–${m.a1}. âyetler birlikte çevrilmiştir`+(m.out?"; bu grubun bir kısmı komşu sayfadadır.":".")));
  d.onclick=()=>select(m.s,m.a0);T.appendChild(d)}
 paint();
 const sel=document.querySelector(".ay.sel");if(sel&&!isVisible(sel))sel.scrollIntoView({block:"center"});
 // yer işaretleri
 const M=$("marks");M.innerHTML="";if(!v.marks.length)M.appendChild(el("div",null,"Henüz yer işareti yok"));
 v.marks.slice().reverse().forEach(m=>{const d=el("div");d.appendChild(el("span",null,m.t));d.appendChild(el("small",null,"s. "+m.page));d.onclick=()=>{send({type:"kuran_page",page:m.page});M.classList.remove("on")};M.appendChild(d)});
 $("src").textContent=`Metin: ${v.source.text}  ·  Meal: ${v.source.meal}`;$("src").title=v.source.verification}
function isVisible(e){const r=e.getBoundingClientRect(),p=e.closest(".pb").getBoundingClientRect();return r.top>=p.top&&r.bottom<=p.bottom}
function connect(){ws=new WebSocket("ws://127.0.0.1:8765/ws?t="+TOK);ws.onopen=()=>send({type:"scene_ready",kind:"kuran"});
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.kind!=="kuran")return;
  if(m.type==="scene_init"&&m.data)render(m.data);
  else if(m.type==="scene_do"){const d=m.do||{};if(d.data){const turned=!V||d.data.page!==V.page;render(d.data);if(turned){$("arb").scrollTop=0;$("trb").scrollTop=0}}if(d.msg)$("log").textContent=d.msg}};
 ws.onclose=()=>setTimeout(connect,1500)}
const go=p=>send({type:"kuran_page",page:p});
$("next").onclick=()=>V&&go(V.page+1);$("prev").onclick=()=>V&&go(V.page-1);
$("pgn").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"){const n=+e.target.value;if(n>=1&&n<=604)go(n);e.target.blur()}else if(e.key==="Escape")e.target.blur()});
$("sura").onchange=e=>send({type:"kuran_sura",s:+e.target.value});$("juz").onchange=e=>send({type:"kuran_juz",juz:+e.target.value});
document.querySelectorAll("#vw button").forEach(b=>b.onclick=()=>{send({type:"kuran_view",view:b.dataset.v});if(V){V.view=b.dataset.v;document.body.className="v-"+V.view;document.querySelectorAll("#vw button").forEach(x=>x.classList.toggle("on",x===b))}});
$("sm").onclick=()=>V&&send({type:"kuran_size",size:V.size-4});$("bg").onclick=()=>V&&send({type:"kuran_size",size:V.size+4});
$("mk").onclick=()=>send({type:"kuran_mark"});$("mkl").onclick=()=>$("marks").classList.toggle("on");
$("lm").onclick=()=>send({type:"kuran_listen",kind:"meal"});$("la").onclick=()=>send({type:"kuran_listen",kind:"ar"});
function shut(){send({type:"scene_close"})}
$("close").onclick=shut;$("peek").onclick=()=>send({type:"mode_peek"});
$("cmd").addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&e.target.value.trim()){cmd(e.target.value.trim());e.target.value=""}else if(e.key==="Escape")e.target.blur()});
addEventListener("keydown",e=>{const tag=(document.activeElement||{}).tagName;if(tag==="INPUT"||tag==="SELECT")return;
 if(e.key==="Escape"){if($("marks").classList.contains("on")){$("marks").classList.remove("on");return}shut()}
 else if(V&&(e.key==="ArrowLeft"||e.key==="PageDown"))go(V.page+1);else if(V&&(e.key==="ArrowRight"||e.key==="PageUp"))go(V.page-1)});
connect();window.focus();
</script></body></html>
