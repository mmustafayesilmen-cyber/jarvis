<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>JARVIS SOHBET</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:8765"><link rel="stylesheet" href="/kit/modes.css"><script src="/kit/modes.js"></script>
<style>
:root{--c:#8fd0ff;--c2:#5aa8ff;--ln:rgba(143,208,255,.22);--hi:rgba(143,208,255,.12);--card:rgba(8,16,34,.66)}
html,body{background:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(90,168,255,.09),transparent 70%),radial-gradient(ellipse at 50% -10%,#0c1d3a 0%,#02060e 66%)}
#stage{display:flex;flex-direction:column;align-items:center}
#chat{width:min(900px,100%);flex:1;min-height:0;overflow-y:auto;padding:8px 6px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.m{max-width:86%;padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.6;user-select:text;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:linear-gradient(135deg,rgba(90,168,255,.28),rgba(90,168,255,.14));border:1px solid var(--ln);border-bottom-right-radius:6px}
.m.j{align-self:flex-start;background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.m.j.err{border-color:rgba(255,138,112,.5)}
.m.j .who{display:block;font:600 10.5px Bahnschrift,Consolas;letter-spacing:.3em;color:var(--c);margin-bottom:5px}
.m.j.live::after{content:"▍";color:var(--c);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.m pre{margin:8px 0 2px;padding:10px 12px;background:rgba(0,0,0,.45);border:1px solid var(--ln);border-radius:10px;overflow-x:auto;font:13px Consolas;line-height:1.45;white-space:pre}
.m code{font:13.5px Consolas;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:5px}.m pre code{background:none;padding:0}
#think{width:min(900px,100%);display:none;align-items:center;gap:10px;padding:8px 14px;margin-bottom:4px;border:1px dashed var(--ln);border-radius:12px;color:var(--mut);font:12.5px Consolas}
#think.on{display:flex}#think b{color:var(--c);letter-spacing:.2em;font-weight:600}
#think span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.dots i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--c);animation:dp 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
#empty{margin:auto;text-align:center;color:var(--mut);max-width:560px;line-height:1.7}#empty h2{font:300 34px Bahnschrift;color:#fff;letter-spacing:.12em;margin:0 0 12px}
#modes{position:fixed;top:14px;right:260px;z-index:6;display:flex;gap:6px}#modes button{padding:6px 10px;font-size:11px}
</style></head><body>
<div id="modes"><button data-c="otomatik düşün" id="m_auto">OTOMATİK</button><button data-c="derin düşün" id="m_hep">DERİN</button><button data-c="hızlı cevap ver" id="m_hic">HIZLI</button><button data-c="yeni sohbet" id="m_new">YENİ SOHBET</button></div>
<div id="stage">
 <div id="chat"><div id="empty"><h2>SOHBET</h2>Benimle her şeyi konuşabilirsiniz: fikir, açıklama, tavsiye, kod ya da sadece sohbet. Konuşun ya da aşağıya yazın. Zor sorularda önce düşünür, sonra cevaplarım.</div></div>
 <div id="think"><b>DÜŞÜNÜYOR</b><span id="tt"></span><div class="dots"><i></i><i></i><i></i></div></div>
</div>
<script>
let cur=null,curTxt="",thBuf="",busy=false;
Mode.start({kind:"sohbet",title:"SOHBET",placeholder:"Yazın ya da konuşun · yeni sohbet · sus · derin düşün · hızlı cevap ver · bunu hatırla · çık",init:snap,act});
const chat=$("chat");
function md(s){ // yalnızca güvenli biçimlendirme: kod bloğu, satır içi kod, kalın; HTML hep kaçırılır
 const parts=String(s).split(/```/);
 return parts.map((p,i)=>{
  if(i%2){const nl=p.indexOf("\n");const body=nl>=0&&/^[\w+#-]*$/.test(p.slice(0,nl).trim())?p.slice(nl+1):p;return "<pre><code>"+Mode.esc(body.replace(/\n$/,""))+"</code></pre>"}
  return Mode.esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}).join("")}
function bottom(){chat.scrollTop=chat.scrollHeight}
function add(role,text,cls){const e=$("empty");if(e)e.remove();const d=document.createElement("div");d.className="m "+(role==="user"?"u":"j")+(cls?" "+cls:"");
 d.innerHTML=(role==="user"?"":'<span class="who">JARVIS</span>')+'<span class="b">'+md(text)+"</span>";chat.appendChild(d);bottom();return d}
function setBusy(b){busy=b;Mode.pill(b?"CEVAPLIYOR":"HAZIR");if(!b){$("think").classList.remove("on");thBuf=""}}
function mark(m){["auto","hep","hic"].forEach(k=>$("m_"+k).classList.toggle("cur",k===(m==="hep"?"hep":m==="hic"?"hic":"auto")))}
function snap(s){chat.innerHTML="";cur=null;curTxt="";if(!s.msgs.length)chat.innerHTML='<div id="empty"><h2>SOHBET</h2>Benimle her şeyi konuşabilirsiniz: fikir, açıklama, tavsiye, kod ya da sadece sohbet. Konuşun ya da aşağıya yazın. Zor sorularda önce düşünür, sonra cevaplarım.</div>';
 s.msgs.forEach(m=>add(m.role,m.content));setBusy(false);mark(s.think);
 if(s.busy){cur=add("assistant","","live");setBusy(true)}}
function act(d){
 if(d.snap)snap(d.snap);
 if(d.think)mark(d.think);
 if(d.stop){if(cur)cur.classList.remove("live");cur=null;setBusy(false)}
 if(d.user!==undefined){if(cur)cur.classList.remove("live");add("user",d.user);cur=add("assistant","","live");curTxt="";setBusy(true)}
 if(d.thinking){$("think").classList.add("on")}
 if(d.th){thBuf=(thBuf+d.th).slice(-400);$("tt").textContent=thBuf.replace(/\s+/g," ");$("think").classList.add("on")}
 if(d.tok){if(!cur){cur=add("assistant","","live");curTxt=""}curTxt+=d.tok;$("think").classList.remove("on");cur.querySelector(".b").innerHTML=md(curTxt);bottom()}
 if(d.done){if(!cur)cur=add("assistant","");cur.classList.remove("live");if(d.err)cur.classList.add("err");cur.querySelector(".b").innerHTML=md(d.text||curTxt);cur=null;curTxt="";setBusy(false);bottom()}
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>Mode.cmd(b.dataset.c));
</script></body></html>
